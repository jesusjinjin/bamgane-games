<style>
  :root { --accent-1: #14b8a6; --accent-2: #0d9488; }

  /* 마당 멍석을 위에서 내려다본 배경. 가운데는 결만 있어 콩이 잘 보인다. */
  .stage { background: url('assets/oddone/bg.webp?v=176') center / cover no-repeat; }
  .topbar { background: rgba(22, 22, 40, .42); }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(20,18,14,.22) 0%, rgba(20,18,14,.03) 26%,
                                        rgba(20,18,14,.24) 62%, rgba(20,18,14,.54) 100%);
  }
  .body { z-index: 1; }

  /* 판정 → 콩 → 회차 → 남은 시간 → 버튼.
     140 + 300 + 16 + 40 + 68 = 564 로 게임 영역 안에 들어간다. */
  .board { width: 100%; display: grid; justify-items: center;
           grid-template-rows: 140px 300px 16px 40px auto; align-content: center; }
  .slot    { display: grid; place-items: center; order: 1; align-self: end; }
  /* 콩판을 86px 끌어올린다.

     처음에는 45px 만 올려 맨 윗줄을 조약돌 밀기의 얼음판 윗선(247px)에 맞췄는데,
     콩판 아래가 버튼 쪽으로 몰려 보여서 한 줄만큼(31 + 여백 10 = 41px) 더 올렸다.
     칸 크기는 그대로 두고 자리만 옮기므로 버튼과 회차 표시는 움직이지 않는다. */
  .padslot { display: grid; place-items: center; order: 2;
             transform: translateY(-86px); }
  .rounds  { order: 3; }
  .status  { order: 4; align-self: center; }
  .controls{ text-align: center; order: 5; }

  .rounds { display: flex; gap: 9px; align-items: center; }
  .pip { width: 34px; height: 6px; border-radius: 3px; background: rgba(30,51,48,.85); }
  .pip.ok   { background: #22c55e; }
  .pip.fail { background: #e11d48; }

  /* 10열 6행. 콩 그림은 무채색이라 코드가 색을 입혀 넣는다. */
  .pad { display: grid; gap: 10px; }
  .cell { width: 48px; height: 31px; cursor: pointer;
          background: center / contain no-repeat;
          filter: drop-shadow(0 2px 3px rgba(20,14,6,.45)); }
  /* 시작 전에는 콩을 덮어 둔다. 미리 훑어볼 수 없게. */
  /* 헛짚었을 때 판이 짧게 흔들린다. 붉은 표시를 뺐으니
     "지금 틀렸다" 를 알려 주는 것은 이 흔들림과 소리뿐이다. */
  .pad.wrong { animation: pad-wrong .26s cubic-bezier(.2,.7,.3,1); }
  @keyframes pad-wrong {
    0%   { transform: translate(0, 0); }
    14%  { transform: translate(-9px, 0); }
    34%  { transform: translate(7px, 0); }
    56%  { transform: translate(-5px, 0); }
    78%  { transform: translate(3px, 0); }
    100% { transform: translate(0, 0); }
  }

  .pad.idle .cell { background-image: none !important;
                    background-color: rgba(46,40,30,.55);
                    border-radius: 50%; cursor: default; filter: none; }

  .cell.hit  { outline: 3px solid var(--ok); outline-offset: 3px; border-radius: 50%; }
  /* 헛짚은 칸에 붉은 원을 그렸었는데 화면이 지저분해져서 뺐다.
     `miss` 표는 남긴다 — 같은 칸을 또 눌러도 시간이 두 번 깎이지 않게 하는 표시다. */

  .status { font-size: 15px; color: var(--text-dim); letter-spacing: .3px;
            text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .status b { color: #fff; font-size: 17px; }
  .status .time { font-variant-numeric: tabular-nums; }
  .verdict .detail { text-shadow: 0 3px 10px rgba(0,0,0,.9); }
  .verdict .sub { display: none; }
  .verdict .mark { background: rgba(16,20,26,.72); }
  .verdict.ok .mark { background: rgba(16,40,26,.72); border-color: #4ade80; }
</style>

</div></div>

<script>
"use strict";

const R = RULES.oddone;
const pad    = document.getElementById("pad");
const status = document.getElementById("status");
const slot   = document.getElementById("slot");
const go     = document.getElementById("go");

const COUNT = R.cols * R.rows;
pad.style.gridTemplateColumns = "repeat(" + R.cols + ", 48px)";

/* 콩 그림은 무채색이다. 여기에 색을 곱해 쓴다.
   색과 정답 자리가 매판 바뀌므로 색칠된 콩을 미리 받아 둘 수 없다.
   판마다 두 벌(보통 콩 · 다른 콩)만 만들어 60칸에 나눠 준다. */
const beanImg = new Image();
let beanReady = false;
beanImg.onload = () => { 평균재기(); beanReady = true; reset(); };
beanImg.src = "assets/oddone/bean.webp?v=176";

/* ── 색 차이를 사람 눈 기준으로 재는 자 ──────────────────────────
   회차마다 "이만큼 다르게" 를 ΔE 로 정해 두고, 그 ΔE 가 나오는
   색을 거꾸로 찾아 쓴다. 그래야 어떤 콩이 걸려도 난이도가 같다.

   곱하기로 칠하므로 칠한 뒤의 평균색은 정확히
   (콩 그림의 평균색 × 칠한 색 ÷ 255) 이다. 캔버스를 만들어 재 볼 필요 없이
   이 식으로 바로 얻을 수 있어서, 후보 색을 수십 번 따져 봐도 빠르다. */
let 바탕평균 = { r: 200, g: 200, b: 200 };

function 평균재기() {
  const c = document.createElement("canvas");
  c.width = beanImg.width; c.height = beanImg.height;
  const x = c.getContext("2d");
  x.drawImage(beanImg, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 200) continue;          // 투명한 바깥은 뺀다
    r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
  }
  if (n) 바탕평균 = { r: r / n, g: g / n, b: b / n };
}

function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let t;
  if (h < 60)       t = [c, x, 0];
  else if (h < 120) t = [x, c, 0];
  else if (h < 180) t = [0, c, x];
  else if (h < 240) t = [0, x, c];
  else if (h < 300) t = [x, 0, c];
  else              t = [c, 0, x];
  return { r: (t[0] + m) * 255, g: (t[1] + m) * 255, b: (t[2] + m) * 255 };
}

// 이 색으로 칠했을 때 콩이 띠게 될 평균색
function 칠한색(h, s, l) {
  const t = hsl2rgb(h, s, l);
  return { r: 바탕평균.r * t.r / 255,
           g: 바탕평균.g * t.g / 255,
           b: 바탕평균.b * t.b / 255 };
}

function lab(c) {
  const f = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  const R = f(c.r), G = f(c.g), B = f(c.b);
  let X = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047;
  let Y = (R * 0.2126 + G * 0.7152 + B * 0.0722);
  let Z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
  const k = (t) => t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116);
  X = k(X); Y = k(Y); Z = k(Z);
  return { L: 116 * Y - 16, a: 500 * (X - Y), b: 200 * (Y - Z) };
}

/* 두 색이 사람 눈에 얼마나 달라 보이는가 (CIEDE2000).

   Lab 위 직선거리(ΔE76)로 재면 안 된다. 사람 눈은 채도가 높을수록 같은 색
   차이를 둔하게 느끼는데 직선거리에는 그 보정이 없다. 그래서 숫자를 똑같이
   9.0 으로 맞춰 놓아도 실제 체감이 콩마다 크게 벌어졌다.

     팥 × 진하기      2.65   ← 숫자만 9 이고 사실상 안 보인다
     동부콩 × 색조    9.25   ← 같은 설정인데 3.5배 잘 보인다

   아래 식은 그 보정을 넣은 표준 자다. 길지만 매판 스무 번쯤만 부르므로
   느려질 걱정은 없다. 이걸 쓰면 어떤 콩이 걸리든 그 회차의 난이도가 같다. */
function 차이(c1, c2) {
  const A = lab(c1), B = lab(c2);
  const C1 = Math.hypot(A.a, A.b), C2 = Math.hypot(B.a, B.b);
  const Cb = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Math.pow(Cb, 7) / (Math.pow(Cb, 7) + Math.pow(25, 7))));
  const a1 = (1 + G) * A.a, a2 = (1 + G) * B.a;
  const C1p = Math.hypot(a1, A.b), C2p = Math.hypot(a2, B.b);
  const 각 = (x, y) => { if (x === 0 && y === 0) return 0;
                         const d = Math.atan2(y, x) * 180 / Math.PI; return d < 0 ? d + 360 : d; };
  const h1p = 각(a1, A.b), h2p = 각(a2, B.b);

  const dLp = B.L - A.L, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0) {
    dhp = h2p - h1p;
    if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360;
  }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(dhp * Math.PI / 360);

  const Lbp = (A.L + B.L) / 2, Cbp = (C1p + C2p) / 2;
  let hbp = h1p + h2p;
  if (C1p * C2p !== 0) {
    if (Math.abs(h1p - h2p) > 180) hbp += (hbp < 360 ? 360 : -360);
    hbp /= 2;
  }
  const T = 1 - 0.17 * Math.cos((hbp - 30) * Math.PI / 180)
              + 0.24 * Math.cos(2 * hbp * Math.PI / 180)
              + 0.32 * Math.cos((3 * hbp + 6) * Math.PI / 180)
              - 0.20 * Math.cos((4 * hbp - 63) * Math.PI / 180);
  const dTh = 30 * Math.exp(-Math.pow((hbp - 275) / 25, 2));
  const Rc = 2 * Math.sqrt(Math.pow(Cbp, 7) / (Math.pow(Cbp, 7) + Math.pow(25, 7)));
  const Sl = 1 + (0.015 * Math.pow(Lbp - 50, 2)) / Math.sqrt(20 + Math.pow(Lbp - 50, 2));
  const Sc = 1 + 0.045 * Cbp;
  const Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(2 * dTh * Math.PI / 180) * Rc;

  return Math.sqrt(Math.pow(dLp / Sl, 2) + Math.pow(dCp / Sc, 2) + Math.pow(dHp / Sh, 2)
                   + Rt * (dCp / Sc) * (dHp / Sh));
}

function tintBean(h, s, l) {
  if (!beanReady) return "";
  const c = document.createElement("canvas");
  c.width = beanImg.width; c.height = beanImg.height;
  const x = c.getContext("2d");
  x.drawImage(beanImg, 0, 0);
  // 밝기와 결을 남긴 채 색만 입힌다
  x.globalCompositeOperation = "multiply";
  x.fillStyle = "hsl(" + h + "," + s.toFixed(1) + "%," + l.toFixed(2) + "%)";
  x.fillRect(0, 0, c.width, c.height);
  // 곱하기가 투명 부분까지 칠하므로 콩 모양으로 다시 오려 낸다
  x.globalCompositeOperation = "destination-in";
  x.drawImage(beanImg, 0, 0);
  return "url(" + c.toDataURL() + ")";
}

// 헛짚었을 때 낼 소리. 이 게임에서 파일로 된 소리는 이것 하나다.
Sound.use({ oops: "assets/_sounds/oddone/oops.mp3?v=176" });

const roundsBox = document.createElement("div");
roundsBox.className = "rounds";
status.before(roundsBox);

// 회차가 오를수록 색 차이가 옅어진다. 마지막 판이 가장 안 보인다.
const ROUNDS = R.단계.length;

// 회차별 목표 ΔE. 값을 딱 고정하면 몇 판 만에 감이 외워지므로 조금 흔든다.
function 이번목표(k) {
  const t = R.단계[k];
  return t * (1 + (Math.random() * 2 - 1) * R.흔들림);
}

let state = "ready";     // ready | running | done
let round = 0;           // 지금 몇 번째
let 깎인시간 = 0;        // 잘못 골라 깎인 초. 남은 시간에서 뺀다
let marks = [];          // 회차별 성패
let times = [];          // 회차별 걸린 시간
let oddIndex = 0;        // 다른 칸의 자리
let t0 = 0, raf = 0;

function elapsed() { return (performance.now() - t0) / 1000; }

function pips() {
  roundsBox.innerHTML = "";
  for (let i = 0; i < ROUNDS; i++) {
    const p = document.createElement("div");
    p.className = "pip" + (marks[i] === undefined ? "" : (marks[i] ? " ok" : " fail"));
    roundsBox.appendChild(p);
  }
}

/* 콩 종류. 예전에는 색조를 0~360 아무 데서나 뽑아 파란 콩·보라 콩이 나왔다.
   실제로 있을 법한 콩으로 묶어 두면 화면이 훨씬 그럴듯해지고,
   판마다 "오늘은 무슨 콩" 이라는 재미도 생긴다.
   너무 어두운 것은 넣지 않았다 — 멍석 위에서 콩인지 그림자인지 모른다. */
const 콩종류 = [
  { 이름: "메주콩",   h: [40, 50],   s: [52, 68], l: [54, 64] },
  { 이름: "팥",       h: [4, 14],    s: [58, 72], l: [42, 50] },
  { 이름: "완두콩",   h: [82, 104],  s: [42, 58], l: [46, 56] },
  { 이름: "강낭콩",   h: [338, 354], s: [44, 60], l: [44, 54] },
  { 이름: "동부콩",   h: [28, 40],   s: [24, 38], l: [62, 72] },
  // 보랏빛·잿빛 두 가지는 마지막 판에만 내보낸다. 멍석이 누런 짚빛이라
  // 이 둘만 바탕에서 유난히 도드라져 보이는데, 그러면 눈이 콩 색부터
  // 낯설어져서 "다른 한 알 찾기" 와는 다른 일이 되어 버린다.
  { 이름: "쥐눈이콩", h: [258, 276], s: [18, 30], l: [38, 46], 막판만: true },
  { 이름: "서리태",   h: [198, 218], s: [20, 34], l: [40, 48], 막판만: true },
  { 이름: "녹두",     h: [64, 80],   s: [40, 55], l: [52, 62] },
];

function 사이(범위) { return 범위[0] + Math.random() * (범위[1] - 범위[0]); }

/* 목표 ΔE 가 나오도록 어긋남의 크기를 거꾸로 찾는다.

   어긋나는 방향도 매판 다르다 — 밝기만 다르면 몇 판 만에
   "밝은 놈을 찾으면 된다" 가 되어 눈이 한 가지 일만 하게 된다.
   색조·진하기로도 어긋나게 하면 매판 다른 종류의 눈썰미를 쓴다.

   크기와 ΔE 는 색마다 관계가 달라서 식으로 못 푼다. 대신 ΔE 가
   크기에 따라 단조롭게 커지므로 반씩 좁혀 가면 스무 번 안에 잡힌다. */
const 어긋남축 = [
  { 이름: "밝기",   상한: 26, 적용: (c, m) => ({ h: c.h, s: c.s, l: Math.min(94, Math.max(6, c.l + m)) }) },
  { 이름: "색조",   상한: 50, 적용: (c, m) => ({ h: c.h + m, s: c.s, l: c.l }) },
  { 이름: "진하기", 상한: 55, 적용: (c, m) => ({ h: c.h, s: Math.min(100, Math.max(4, c.s + m)), l: c.l }) },
];

function 크기찾기(바탕, 축, 방향, 목표) {
  const 기준 = 칠한색(바탕.h, 바탕.s, 바탕.l);
  const 재기 = (m) => { const o = 축.적용(바탕, 방향 * m);
                        return 차이(기준, 칠한색(o.h, o.s, o.l)); };
  // 이 축으로는 목표까지 못 벌어지면 밝기로 되돌린다. 밝기는 어떤 색에서도 벌어진다.
  if (재기(축.상한) < 목표) return null;
  let lo = 0, hi = 축.상한;
  for (let i = 0; i < 24; i++) {
    const m = (lo + hi) / 2;
    if (재기(m) < 목표) lo = m; else hi = m;
  }
  return 축.적용(바탕, 방향 * ((lo + hi) / 2));
}

// 판을 새로 깐다. 콩 종류·어긋나는 축·자리 모두 매판 바뀐다.
let 이번판 = {};                  // 무엇이 어떻게 어긋났는지 (확인용)

function build(목표, 회차) {
  // 막판 전용 콩은 마지막 회차에만 후보에 넣는다
  const 막판 = 회차 === ROUNDS - 1;
  const 후보 = 막판 ? 콩종류 : 콩종류.filter((t) => !t.막판만);
  const 종류 = 후보[Math.floor(Math.random() * 후보.length)];
  const 바탕 = { h: 사이(종류.h), s: 사이(종류.s), l: 사이(종류.l) };
  const 방향 = Math.random() < 0.5 ? 1 : -1;

  let 축 = 어긋남축[Math.floor(Math.random() * 어긋남축.length)];
  let 다른 = 크기찾기(바탕, 축, 방향, 목표);
  if (!다른) { 축 = 어긋남축[0]; 다른 = 크기찾기(바탕, 축, 방향, 목표); }
  // 밝기로도 안 되면(아주 밝거나 아주 어두운 콩) 반대쪽으로 밀어 본다
  if (!다른) { 다른 = 크기찾기(바탕, 축, -방향, 목표) || 축.적용(바탕, -방향 * 축.상한); }

  이번판 = { 콩: 종류.이름, 축: 축.이름,
             ΔE: 차이(칠한색(바탕.h, 바탕.s, 바탕.l), 칠한색(다른.h, 다른.s, 다른.l)) };

  // 색칠은 판마다 두 번만. 60번 그리면 느려진다.
  const normal = tintBean(바탕.h, 바탕.s, 바탕.l);
  const odd    = tintBean(다른.h, 다른.s, 다른.l);

  oddIndex = Math.floor(Math.random() * COUNT);
  pad.innerHTML = "";
  for (let i = 0; i < COUNT; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    c.style.backgroundImage = (i === oddIndex) ? odd : normal;
    c.dataset.i = i;
    pad.appendChild(c);
  }
}

/* 판을 짧게 흔든다. 애니메이션을 다시 걸려면 클래스를 뗐다 붙여야 하는데,
   그냥 붙이면 브라우저가 한 번에 처리해서 아무 일도 안 일어난다.
   그래서 사이에 레이아웃을 한 번 읽어 강제로 끊어 준다. */
function 흔들기() {
  pad.classList.remove("wrong");
  void pad.offsetWidth;
  pad.classList.add("wrong");
}

function 남은시간() { return Math.max(0, R.전체초 - elapsed() - 깎인시간); }

function 안내() {
  status.innerHTML = "<b>" + (round + 1) + "</b> / " + ROUNDS + " 회"
                   + " &nbsp;·&nbsp; 남은 시간 <b class='time'>"
                   + 남은시간().toFixed(2) + "</b>초";
}

function tick() {
  안내();
  if (남은시간() <= 0) { finish(false, "시간 초과"); return; }
  raf = requestAnimationFrame(tick);
}

function reset() {
  cancelAnimationFrame(raf);
  state = "ready";
  round = 0; marks = []; times = []; 깎인시간 = 0;
  slot.innerHTML = "";
  build(이번목표(0), 0);
  pad.classList.add("idle");
  status.innerHTML = "<b>" + ROUNDS + "</b>단계 &nbsp;·&nbsp; 모두 <b>"
                   + R.전체초.toFixed(1) + "</b>초 안에 &nbsp;·&nbsp; "
                   + COUNT + "칸 중 하나";
  go.textContent = "도 전";
  pips();
}

function start() {
  round = 0; marks = []; times = []; 깎인시간 = 0;
  t0 = performance.now();
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
  slot.innerHTML = "";
  pad.classList.remove("idle");
  go.textContent = "포 기";
  pips();
  nextRound();
}

function nextRound() {
  state = "running";
  build(이번목표(round), round);
  // 시계는 판마다 새로 켜지 않는다. 다섯 단계를 하나의 시간으로 치른다.
  안내();
}

function finish(ok, why) {
  cancelAnimationFrame(raf);
  state = "done";

  // 정답 자리는 언제나 초록으로 알려 준다.
  // 잘못 누른 칸에는 이미 붉은 표시가 붙어 있어 둘이 구별된다.
  const cells = pad.children;
  if (cells[oddIndex]) cells[oddIndex].classList.add("hit");
  pad.classList.remove("idle");

  // 깎인 시간까지 얹어야 실제로 쓴 시간이 된다
  const 쓴시간 = elapsed() + 깎인시간;
  status.innerHTML = ok
    ? "다섯 단계 <b class='time'>" + 쓴시간.toFixed(2) + "</b>초"
    : "정답은 표시된 칸";

  slot.innerHTML = verdictHtml(ok,
    ok ? 쓴시간.toFixed(2) + " 초" : (why || "실패"), "");
  go.textContent = "다 시";
  if (ok) Sound.success(); else Sound.fail();
}

pad.addEventListener("click", (e) => {
  if (state !== "running") return;
  const cell = e.target.closest(".cell");
  if (!cell) return;

  /* 잘못 골라도 그 자리에서 끝내지 않는다.

     한 번에 죽으면 다섯 단계가 다 무의미해진다 — 1단계에서 헛짚은 사람이나
     5단계까지 간 사람이나 결과가 같다. 대신 시간을 1초 깎고 계속 찾게 한다.
     헛짚은 칸은 붉게 남겨 두고 다시 눌러도 또 깎이지 않는다. */
  if (Number(cell.dataset.i) !== oddIndex) {
    if (cell.classList.contains("miss")) return;   // 이미 헛짚은 칸
    cell.classList.add("miss");
    깎인시간 += R.깎임;
    if (!Sound.play("oops")) Sound.thud(0.34);
    흔들기();
    안내();
    if (남은시간() <= 0) finish(false, "시간 초과");
    return;
  }

  times.push(elapsed());
  marks.push(true); pips();
  Sound.tick(1 + round * 0.12);

  round++;
  if (round >= ROUNDS) { cancelAnimationFrame(raf); finish(true); return; }
  nextRound();
});

function press() {
  if (state === "ready") start();
  else if (state === "running") { marks.push(false); pips(); finish(false, "포기"); }
  else reset();
}

go.addEventListener("click", press);
onPressKey(press);
reset();
</script>
</body>
</html>
