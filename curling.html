<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ec4899' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ec4899'/%3E%3C/svg%3E">
<title>조약돌 밀기</title>
<link rel="stylesheet" href="common.css?v=84">
<script src="common.js?v=84"></script>
<script src="sound.js?v=84"></script>
<style>
  :root { --accent-1: #f59e0b; --accent-2: #ea580c; }

  /* 겨울 우물가. 가운데 얼음판이 돌이 미끄러지는 길이다. */
  .stage { background: url('assets/curling/bg.webp') center / cover no-repeat; }
  .topbar { background: rgba(22, 22, 40, .42); }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(16,20,28,.20) 0%, rgba(16,20,28,.02) 26%,
                                        rgba(16,20,28,.20) 62%, rgba(16,20,28,.50) 100%);
  }
  .body { z-index: 1; }

  /* 조작 프레임(432) + 안내(30) + 버튼. 판정은 프레임 위에 겹친다.
     얼음판은 가로세로 비가 3.75:1 이라 프레임 세로를 다 못 채운다.
     남는 위아래로는 겨울 우물가 배경이 비친다. */
  .board { width: 100%; display: grid; justify-items: center;
           grid-template-rows: var(--play-h) 30px auto; align-content: center;
           position: relative; }
  /* 프레임 한가운데에 두면 떠 보인다. 돌탑은 탑이 바닥에서 올라가느라
     저절로 아래에 놓이는데, 이 게임만 가운데면 게임을 바꿀 때 눈이 위아래로 튄다.
     프레임 아래쪽에 붙여 돌탑 1층과 비슷한 높이에 오게 한다. */
  .iceslot { display: grid; place-items: end center; order: 1;
             width: var(--play-w); height: var(--play-h); }
  .status  { order: 2; align-self: center; }
  .controls{ text-align: center; order: 3; }
  .slot { position: absolute; left: 50%; top: calc(var(--play-h) / 2);
          transform: translate(-50%, -50%); z-index: 4;
          display: grid; place-items: center; pointer-events: none; }

  /* 얼음판은 배경 그림이 맡는다. 캔버스는 돌과 과녁만 그린다. */
  canvas { cursor: grab; touch-action: none; }
  canvas.idle { cursor: default; }
  canvas.pulling { cursor: grabbing; }

  .status { font-size: 15px; color: var(--text-dim); letter-spacing: .3px;
            text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .status b { color: #fff; font-size: 17px; }
  .verdict .detail { text-shadow: 0 3px 10px rgba(0,0,0,.9); }
  .verdict .sub { display: none; }
  .verdict .mark { background: rgba(16,20,26,.72); }
  .verdict.ok .mark { background: rgba(16,40,26,.72); border-color: #4ade80; }
</style>
</head>
<body>
<div id="fit"><div class="stage">

  <div class="topbar">
    <a class="back" href="index.html" title="목록으로">←</a>
    <div class="tile sm pic"><img src="assets/_icons/curling.webp" alt=""></div>
    <div class="titles">
      <h1>조약돌 밀기</h1>
      <p>Mini Curling</p>
    </div>
  </div>

  <div class="body">
    <div class="play">
      <div class="board">
        <div class="iceslot playslot"><canvas id="cv" width="768" height="432" class="idle"></canvas></div>
        <div class="status" id="status"></div>
        <div class="slot" id="slot"></div>
        <div class="controls">
          <button class="btn" id="go">도 전</button>
          <div class="hint">돌을 뒤로 당겼다 놓기</div>
        </div>
      </div>
    </div>

    <aside class="rules card">
      <h2>규칙</h2>
      <ul>
        <li>돌을 뒤로 당겼다 놓으세요</li>
        <li>많이 당길수록 멀리 갑니다</li>
        <li>과녁 한가운데 멈춰야 성공</li>
        <li>기회는 한 번뿐입니다</li>
        <li><b>[성공기준]</b> 과녁 8.5px 이내</li>
      </ul>
    </aside>
  </div>

</div></div>

<script>
"use strict";

const R = RULES.curling;

Sound.use({
  thud:       "assets/_sounds/curling/release.mp3",  // 놓고 미는 순간 · 멈춤
  slide:      "assets/_sounds/curling/slide.mp3",    // 미끄러지는 지속음
  success:    "assets/_sounds/common/success.mp3",
  fail:       "assets/_sounds/common/fail.mp3",
});
const cv     = document.getElementById("cv");
const ctx    = cv.getContext("2d");
const status = document.getElementById("status");
const slot   = document.getElementById("slot");
const go     = document.getElementById("go");

const W = cv.width, H = cv.height;
const CY = H / 2;
// 캔버스를 900 → 768 로 줄이면서 안의 모든 값을 같은 수로 곱했다.
// 비율이 하나도 안 바뀌므로 실력 기준은 그대로다.
const SCALE = 768 / 900;         // 0.8533
const START_X = 80 * SCALE;      // 돌이 출발하는 자리
const STONE_R = 15 * SCALE;      // 판정은 중심 좌표로 한다. 이 값은 보기용 크기다.
// 최대로 당길 수 있는 거리. 예전 150 에서 20% 늘렸다.
// 벽에 튕겨 보내면 지나는 길이 훨씬 길어지는데 최대 세기로도 모자랐다.
// 늘린 것은 당기는 구간뿐이고 POWER 는 손대지 않았다. 그래야
// 지금까지와 같은 만큼 당겼을 때 세기가 그대로다 — 손에 익은 감각을 지킨다.
const MAX_PULL = 180 * SCALE;
const TARGET_R = R.targetR * SCALE;   // 성공 반지름 10 → 8.5

// 돌이 노는 구간의 높이. 캔버스는 프레임에 맞춰 432 로 키웠지만
// 이 값은 예전 캔버스 높이(240)를 그대로 곱한 것이라 난이도가 안 바뀐다.
// 벽을 캔버스 가장자리가 아니라 이 값으로 잡는 이유가 그것이다.
const LANE_H = 240 * SCALE;           // 204.8
const LANE_TOP = CY - LANE_H / 2;     // 얼음판 위 경계
const LANE_BOT = CY + LANE_H / 2;     // 얼음판 아래 경계
// 돌 중심이 여기까지 오면 튕긴다
const WALL_TOP = LANE_TOP + STONE_R + 2;
const WALL_BOT = LANE_BOT - STONE_R - 2;

// 조약돌 그림. 판정은 중심 좌표로 하므로 그림 크기는 보기용일 뿐이다.
const stoneImg = new Image();
let stoneReady = false;
stoneImg.onload = () => { stoneReady = true; draw(); };
stoneImg.src = "assets/curling/stone.webp";

let state = "ready";             // ready | aiming | sliding | done
let stone = { x: START_X, y: CY, vx: 0, vy: 0 };
let targetX = 0;                 // 과녁 중심 (매판 조금씩 달라진다)
let pulling = false;
let pull = { x: 0, y: 0 };       // 당긴 정도
let anim = 0;

// 얼음 마찰은 고정한다. 매판 다르게 하면 같은 세기로 당겨도 결과가 140px 넘게
// 벌어져서 실력이 아니라 운으로 갈린다.
const FRICTION = 0.982;
// 당긴 거리를 속도로 바꾸는 비율. 과녁 범위가 당김 구간의 한가운데 오도록 맞췄다.
const POWER = 0.094;

function newRound() {
  // 과녁 위치만 매판 다르게 → 눈으로 보고 세기를 가늠하는 것이 실력이 된다.
  // 캔버스를 넓히면서 출발점이 16px 밀렸으므로 과녁도 같이 밀어 거리를 지킨다.
  targetX = (486 + Math.random() * 190) * SCALE;
  stone = { x: START_X, y: CY, vx: 0, vy: 0 };
  pull = { x: 0, y: 0 };
  pulling = false;
}

function drawTarget() {
  // 과녁: 안쪽 원 두 개만. 바깥 큰 원들은 눈밭을 어지럽히기만 해서 뺐다.
  // 눈밭 위라 붉은 기가 도는 색이라야 눈에 띈다.
  // 원이 하나뿐이라 테두리를 진하게 해야 멀리서도 보인다.
  ctx.beginPath(); ctx.arc(targetX, CY, TARGET_R * 2.6, 0, 6.2832);
  ctx.fillStyle = "rgba(190, 60, 40, .22)"; ctx.fill();
  ctx.strokeStyle = "rgba(180, 55, 38, .70)"; ctx.lineWidth = 2; ctx.stroke();
  // 성공 범위 — 여기 멈춰야 한다
  ctx.beginPath(); ctx.arc(targetX, CY, TARGET_R, 0, 6.2832);
  ctx.fillStyle = "rgba(200, 60, 44, .62)";
  ctx.fill();
  ctx.strokeStyle = "#e2564a"; ctx.lineWidth = 2.5; ctx.stroke();
}

// 얼음판 경계를 눈 쌓인 조약돌 줄로 표시한다.
// 그냥 선을 그으면 "여기가 끝" 으로만 읽히는데, 돌을 놓으면
// "부딪히면 튕기겠구나" 가 한눈에 온다.
//
// 자리를 난수로 흩지 않고 규칙적으로 놓는다 — 매판 달라지면
// 어디서 튕길지 가늠이 안 되어 운 게임이 된다.
function drawEdge(y) {
  const r = 7 * SCALE;                  // 조약돌 반지름
  const gap = r * 1.75;                 // 조금씩 겹쳐 한 줄로 이어 보이게
  for (let x = gap / 2; x < W + r; x += gap) {
    // 크기를 조금씩 달리해 손으로 놓은 것처럼 보이게 한다.
    // 난수가 아니라 x 로 정해지므로 매판 같은 모양이다.
    const k = 0.82 + 0.18 * Math.abs(Math.sin(x * 0.37));
    const rw = r * 1.15 * k, rh = r * 0.78 * k;

    ctx.beginPath();
    ctx.ellipse(x, y, rw, rh, 0, 0, 6.2832);
    ctx.fillStyle = "rgba(118, 128, 142, .85)";     // 젖은 돌빛
    ctx.fill();

    // 위에 얹힌 눈
    ctx.beginPath();
    ctx.ellipse(x, y - rh * 0.34, rw * 0.86, rh * 0.5, 0, Math.PI, 0);
    ctx.fillStyle = "rgba(242, 247, 252, .92)";
    ctx.fill();
  }
}

// 돌이 나갈 쪽으로 깔리는 옅은 노란 길.
// 길이는 고정이고 끝은 투명하게 흩어진다. 당긴 만큼 길어지게 하면
// 세기까지 눈으로 읽혀서 손 감각으로 가늠하는 재미가 사라진다.
// 끝을 흐려 두면 "어디까지 간다" 가 아니라 "이쪽으로 간다" 로만 읽힌다.
const AIM_LEN = 150 * SCALE;      // 길의 길이 (당긴 세기와 무관)
const AIM_W   = 40 * SCALE;       // 돌 몸통만 한 폭

function 길그리기() {
  const len = Math.hypot(pull.x, pull.y);
  if (len < 8 * SCALE) return;          // 놓아도 안 나가는 세기 — 아직 방향이랄 게 없다

  ctx.save();
  ctx.translate(stone.x, stone.y);
  ctx.rotate(Math.atan2(pull.y, pull.x));

  const s = STONE_R * 0.3;              // 돌 밑에서 시작해 깔려 나간다
  const 깔기 = (폭, 진하기) => {
    const g = ctx.createLinearGradient(s, 0, s + AIM_LEN, 0);
    g.addColorStop(0,    "rgba(255, 212, 84, " + 진하기 + ")");
    g.addColorStop(0.45, "rgba(255, 212, 84, " + (진하기 * 0.55).toFixed(3) + ")");
    g.addColorStop(1,    "rgba(255, 212, 84, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(s, -폭 / 2, AIM_LEN, 폭);
  };

  깔기(AIM_W, 0.30);                    // 길 전체
  깔기(AIM_W * 0.3, 0.34);              // 한가운데만 조금 더 — 눈 위에서도 선이 잡힌다

  ctx.restore();
}

function drawStone() {
  // 당기는 동안 돌이 조금만 뒤로 물러난다.
  // 눌리고 있다는 것만 알려줄 뿐, 세기를 재기에는 턱없이 작다.
  const k = pulling ? 0.16 : 0;
  const x = stone.x - pull.x * k;
  const y = stone.y - pull.y * k;

  if (stoneReady) {
    // 컬링 스톤은 납작하다. 그림(96×96) 안에서 돌 몸통은 가로 84 · 세로 52 를 쓴다.
    // 몸통 가로가 44px 로 보이도록 역산해서 그린다. 세로는 27px 쯤 된다.
    const d = 44 * 96 / 84 * SCALE;
    ctx.drawImage(stoneImg, x - d / 2, y - d / 2, d, d);
    return;
  }
  // 그림이 아직 안 왔을 때만 쓰는 대체 모양
  const g = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, STONE_R);
  g.addColorStop(0, "#e6edf7");
  g.addColorStop(1, "#8fa3bd");
  ctx.beginPath(); ctx.arc(x, y, STONE_R, 0, 6.2832);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#5b6b83"; ctx.lineWidth = 2; ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 얼음판. 예전에는 이 띠가 실제로 돌이 노는 구간보다 좁아서,
  // 위아래로 튕길 수 있다는 걸 아무도 몰랐다. 이제 노는 구간과 정확히 같다.
  ctx.fillStyle = "rgba(70, 92, 120, .16)";
  ctx.fillRect(0, LANE_TOP, W, LANE_H);
  drawEdge(LANE_TOP);          // 위 경계 — 여기 부딪히면 튕긴다
  drawEdge(LANE_BOT);

  // 출발선
  ctx.strokeStyle = "rgba(40,60,86,.45)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 7]);
  ctx.beginPath(); ctx.moveTo(START_X, LANE_TOP + 6); ctx.lineTo(START_X, LANE_BOT - 6); ctx.stroke();
  ctx.setLineDash([]);

  // 과녁은 시작 전에는 감춘다. 자리가 매판 바뀌므로 미리 보여줄 이유가 없고,
  // 시작하는 순간 나타나야 "이번 판은 여기구나" 가 눈에 들어온다.
  if (state !== "ready") drawTarget();

  // 당기는 동안만 갈 길을 깔아 준다. 세기는 여전히 손 감각으로 가늠한다.
  if (state === "aiming" && pulling) 길그리기();
  drawStone();
}

function toCanvas(ev) {
  const b = cv.getBoundingClientRect();
  return { x: (ev.clientX - b.left) * (W / b.width),
           y: (ev.clientY - b.top)  * (H / b.height) };
}

// 과녁 중심까지의 거리. 굴러가는 중에 보여주는 값과 마지막 판정값은
// 반드시 같은 자로 재야 한다. 예전에는 화면에 가로 거리만 띄우고 판정은
// 가로세로를 함께 봐서, 비스듬히 민 판은 "0px" 이라고 떠 있다가
// 멈추는 순간 갑자기 80px 로 튀었다.
function distToTarget() {
  return Math.hypot(stone.x - targetX, stone.y - CY);
}

// 물리는 실제로 흐른 시간으로 굴린다. 프레임 수로 세면 144Hz 모니터에서
// 같은 거리를 2.4배 빨리 지나가 버려서 사람마다 체감이 달라진다.
const STEP = 1 / 60;             // 계산 기준 한 칸 (초). 이 값이 예전 한 프레임이다.
let lastT = 0, carry = 0;
let 튕김 = false;                 // 이번 프레임에 벽에 부딪혔는가 (소리용)

function slide(now) {
  // 흐른 시간만큼 예전과 똑같은 계산을 여러 번 돌린다.
  // 이러면 어떤 주사율에서도 굴러가는 거리와 시간이 같아진다.
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : STEP;
  lastT = now;
  carry += dt;

  let out = false;
  while (carry >= STEP) {
    carry -= STEP;
    stone.x += stone.vx;
    stone.y += stone.vy;
    stone.vx *= FRICTION;
    stone.vy *= FRICTION;

    // 위아래 벽에 부딪히면 튕긴다
    if (stone.y < WALL_TOP) { stone.y = WALL_TOP; stone.vy = -stone.vy * .7; 튕김 = true; }
    if (stone.y > WALL_BOT) { stone.y = WALL_BOT; stone.vy = -stone.vy * .7; 튕김 = true; }

    if (stone.x > W - STONE_R) { out = true; break; }
    if (Math.hypot(stone.vx, stone.vy) <= 0.06 * SCALE) break;
  }

  // 위아래 벽에 부딪혔으면 그 순간 소리를 낸다.
  // 튕기는 것이 눈에만 보이고 소리가 없으면 화면이 죽어 보인다.
  if (튕김) { Sound.thud(0.35); Sound.crackle(1.4); 튕김 = false; }

  const speed = Math.hypot(stone.vx, stone.vy);
  // 미끄러지는 소리를 속도에 맞춰 계속 울린다.
  // 처음 민 세기가 대략 11 정도라 그 값으로 나눠 0~1 로 바꾼다.
  Sound.slideSet(Math.min(1, speed / (11 * SCALE)));
  status.innerHTML = "굴러가는 중 &nbsp;·&nbsp; <b>"
                   + distToTarget().toFixed(1) + "</b>px";

  draw();
  if (speed > 0.06 * SCALE && !out) {
    anim = requestAnimationFrame(slide);
  } else {
    anim = 0;
    judge(out);
  }
}

function judge(out) {
  const d = distToTarget();
  const ok = !out && d <= TARGET_R;
  state = "done";
  cv.classList.add("idle");

  // 멈추면 미끄러지는 소리만 끊는다.
  // 예전에는 여기서 한 번 더 울렸다(자리 잡는 소리 + 느려질수록 조여드는 낮은 음).
  // 떡·돌탑은 내가 누른 순간 나는 소리라 반응으로 들리지만,
  // 조약돌은 손을 뗀 지 한참 뒤라 내 조작과 이어지지 않는다.
  // 판정음 직전에 낮게 울리기까지 해서 판정음이 두 번 나는 것처럼 들렸다.
  Sound.slideStop();

  status.innerHTML = out
    ? "과녁을 지나쳐 나갔습니다"
    : "중심에서 <b>" + d.toFixed(1) + "</b>px";

  slot.innerHTML = verdictHtml(ok,
    out ? "지나침" : d.toFixed(1) + " px",
    "");
  go.textContent = "다 시";

  setTimeout(() => { if (ok) Sound.success(); else Sound.fail(); }, 120);
  draw();
}

cv.addEventListener("pointerdown", (e) => {
  if (state !== "aiming") return;
  const p = toCanvas(e);
  if (Math.hypot(p.x - stone.x, p.y - stone.y) > 30 * SCALE) return;
  pulling = true;
  cv.classList.add("pulling");
  cv.setPointerCapture(e.pointerId);
  status.innerHTML = "뒤로 당겼다 놓으세요";
  draw();
});

cv.addEventListener("pointermove", (e) => {
  if (!pulling) return;
  const p = toCanvas(e);
  let dx = stone.x - p.x, dy = stone.y - p.y;
  const len = Math.hypot(dx, dy);
  if (len > MAX_PULL) { dx = dx / len * MAX_PULL; dy = dy / len * MAX_PULL; }
  // 앞쪽으로는 당길 수 없다
  pull = { x: Math.max(0, dx), y: dy };
  draw();
});

cv.addEventListener("pointerup", () => {
  if (!pulling) return;
  pulling = false;
  cv.classList.remove("pulling");
  const power = Math.hypot(pull.x, pull.y);
  if (power < 8 * SCALE) { draw(); return; }        // 살짝 건드린 건 무시

  state = "sliding";
  stone.vx = pull.x * POWER;
  stone.vy = pull.y * POWER;
  // 손에서 놓는 순간 — 미는 힘에 따라 세기가 달라진다
  Sound.thud(0.3 + Math.min(0.6, power / MAX_PULL * 0.6));
  Sound.crackle(1.6);
  Sound.slideStart();             // 여기서부터 멈출 때까지 계속 미끄러지는 소리
  튕김 = false;
  lastT = 0; carry = 0;           // 시간 누적을 새로 시작한다
  anim = requestAnimationFrame(slide);
});

function reset() {
  cancelAnimationFrame(anim); anim = 0;
  Sound.slideStop();
  state = "ready";
  newRound();
  slot.innerHTML = "";
  cv.classList.add("idle");
  status.innerHTML = "과녁 한가운데 멈추면 성공";
  go.textContent = "도 전";
  draw();
}

function start() {
  cancelAnimationFrame(anim); anim = 0;
  state = "aiming";
  newRound();
  slot.innerHTML = "";
  cv.classList.remove("idle");
  status.innerHTML = "돌을 잡고 뒤로 당기세요";
  go.textContent = "포 기";
  draw();
}

function press() {
  if (state === "ready") start();
  else if (state === "aiming" || state === "sliding") {
    cancelAnimationFrame(anim); anim = 0;
    Sound.slideStop();                        // 포기해도 소리는 끊어야 한다
    state = "done"; pulling = false;
    cv.classList.add("idle");
    slot.innerHTML = verdictHtml(false, "포기", "");
    go.textContent = "다 시";
  } else reset();
}

go.addEventListener("click", press);
onPressKey(press);
reset();
</script>
</body>
</html>
