<style>
  :root { --accent-1: #f59e0b; --accent-2: #ea580c; }

  /* 겨울 우물가. 가운데 얼음판이 돌이 미끄러지는 길이다. */
  .stage { background: url('assets/curling/bg.webp') center / cover no-repeat; }
  .topbar { background: rgba(22, 22, 40, .42); }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(16,20,28,.20) 0%, rgba(16,20,28,.02) 26%,
                                        rgba(16,20,28,.20) 62%, rgba(16,20,28,.50) 100%);
  }
  .body { z-index: 1; }

  /* 조작 프레임(432) + 안내(30) + 버튼. 판정은 프레임 위에 겹친다.
     얼음판은 가로세로 비가 3.75:1 이라 프레임 세로를 다 못 채운다.
     남는 위아래로는 겨울 우물가 배경이 비친다. */
  .board { width: 100%; display: grid; justify-items: center;
           grid-template-rows: var(--play-h) 30px auto; align-content: center;
           position: relative; }
  /* 프레임 한가운데에 두면 떠 보인다. 돌탑은 탑이 바닥에서 올라가느라
     저절로 아래에 놓이는데, 이 게임만 가운데면 게임을 바꿀 때 눈이 위아래로 튄다.
     프레임 아래쪽에 붙여 돌탑 1층과 비슷한 높이에 오게 한다. */
  .iceslot { display: grid; place-items: end center; order: 1;
             width: var(--play-w); height: var(--play-h); }
  .status  { order: 2; align-self: center; }
  .controls{ text-align: center; order: 3; }
  .slot { position: absolute; left: 50%; top: calc(var(--play-h) / 2);
          transform: translate(-50%, -50%); z-index: 4;
          display: grid; place-items: center; pointer-events: none; }

  /* 얼음판은 배경 그림이 맡는다. 캔버스는 돌과 과녁만 그린다. */
  canvas { cursor: grab; touch-action: none; }
  canvas.idle { cursor: default; }
  canvas.pulling { cursor: grabbing; }

  .status { font-size: 15px; color: var(--text-dim); letter-spacing: .3px;
            text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .status b { color: #fff; font-size: 17px; }
  .verdict .detail { text-shadow: 0 3px 10px rgba(0,0,0,.9); }
  .verdict .sub { display: none; }
  .verdict .mark { background: rgba(16,20,26,.72); }
  .verdict.ok .mark { background: rgba(16,40,26,.72); border-color: #4ade80; }
</style>
</head>
<body>
<div id="fit"><div class="stage">

  <div class="topbar">
    <a class="back" href="index.html" title="목록으로">←</a>

  <div class="body">
    <div class="play">
      <div class="board">
        <div class="iceslot playslot"><canvas id="cv" width="768" height="432" class="idle"></canvas></div>
        <div class="status" id="status"></div>
        <div class="slot" id="slot"></div>
        <div class="controls">
          <button class="btn" id="go">도 전</button>

    <aside class="rules card">
      <h2>규칙</h2>

        <li>돌을 뒤로 당겼다 놓으세요</li>
        <li>많이 당길수록 멀리 갑니다</li>
        <li>과녁 자리는 매판 달라집니다</li>
        <li>얼음 기둥과 사방 끝에서 튕깁니다</li>
        <li>과녁 한가운데 멈춰야 성공</li>
        <li>기회는 한 번뿐입니다</li>
        <li><b>[성공기준]</b> 과녁 8.5px 이내</li>
      </ul>
    </aside>
  </div>

</div></div>

<script>
"use strict";

const R = RULES.curling;

Sound.use({
  thud:       "assets/_sounds/curling/release.mp3",  // 놓고 미는 순간 · 멈춤
  slide:      "assets/_sounds/curling/slide.mp3",    // 미끄러지는 지속음
  success:    "assets/_sounds/common/success.mp3",
  fail:       "assets/_sounds/common/fail.mp3",
});
const cv     = document.getElementById("cv");
const ctx    = cv.getContext("2d");
const status = document.getElementById("status");
const slot   = document.getElementById("slot");
const go     = document.getElementById("go");

const W = cv.width, H = cv.height;
const CY = H / 2;
// 캔버스를 900 → 768 로 줄이면서 안의 모든 값을 같은 수로 곱했다.
// 비율이 하나도 안 바뀌므로 실력 기준은 그대로다.
const SCALE = 768 / 900;         // 0.8533
const START_X = 80 * SCALE;      // 돌이 출발하는 자리
const STONE_R = 15 * SCALE;      // 판정은 중심 좌표로 한다. 이 값은 보기용 크기다.
/* 최대로 당길 수 있는 거리. 150 → 180 → 252 로 두 번 늘렸다.

   벽과 고드름에 튕겨 보내면 지나는 길이 훨씬 길어진다. 특히 50도 넘게
   기울여 보내면 최대로 당겨도 526px 에서 멎어, 과녁이 놓이는 구간(415~577)의
   끝자락에 못 닿았다. 252 로 늘리면 710px 까지 간다.

   늘린 것은 당기는 구간뿐이고 POWER 는 두 번 다 손대지 않았다. 그래야
   지금까지와 같은 만큼 당겼을 때 세기가 그대로다 — 손에 익은 감각을 지킨다.
   위쪽으로 쓸 구간만 더 생기는 셈이다. */
const MAX_PULL = 252 * SCALE;
const TARGET_R = R.targetR * SCALE;   // 성공 반지름 10 → 8.5

// 돌이 노는 구간의 높이. 캔버스는 프레임에 맞춰 432 로 키웠지만
// 이 값은 예전 캔버스 높이(240)를 그대로 곱한 것이라 난이도가 안 바뀐다.
// 벽을 캔버스 가장자리가 아니라 이 값으로 잡는 이유가 그것이다.
const LANE_H = 240 * SCALE;           // 204.8
const LANE_TOP = CY - LANE_H / 2;     // 얼음판 위 경계
const LANE_BOT = CY + LANE_H / 2;     // 얼음판 아래 경계
const LANE_RIGHT = W - 8;             // 오른쪽 끝 줄
// 돌 중심이 여기까지 오면 튕긴다
const WALL_TOP = LANE_TOP + STONE_R + 2;
const WALL_BOT = LANE_BOT - STONE_R - 2;
const WALL_RIGHT = LANE_RIGHT - STONE_R - 2;
// 오른쪽에서 되튕겨 돌아온 돌이 화면 왼쪽으로 사라지지 않게 막는다.
// 여기는 줄을 안 그린다 — 출발선 뒤라 눈에 걸리적거리기만 한다.
const WALL_LEFT = STONE_R + 2;

// 조약돌 그림. 판정은 중심 좌표로 하므로 그림 크기는 보기용일 뿐이다.
const stoneImg = new Image();
let stoneReady = false;
stoneImg.onload = () => { stoneReady = true; draw(); };
stoneImg.src = "assets/curling/stone.webp";

let state = "ready";             // ready | aiming | sliding | done
let stone = { x: START_X, y: CY, vx: 0, vy: 0 };
let targetX = 0, targetY = CY;   // 과녁 중심 (매판 달라진다)
let 고드름 = [];                  // 얼음판을 가로막는 얼음 기둥 두 개
let pulling = false;
let pull = { x: 0, y: 0 };       // 당긴 정도
let anim = 0;

// 얼음 마찰은 고정한다. 매판 다르게 하면 같은 세기로 당겨도 결과가 140px 넘게
// 벌어져서 실력이 아니라 운으로 갈린다.
const FRICTION = 0.982;
// 당긴 거리를 속도로 바꾸는 비율. 과녁 범위가 당김 구간의 한가운데 오도록 맞췄다.
const POWER = 0.094;

/* 얼음판에 홀로 선 삼각 고드름. 밑이 넓고 위가 뾰족하다.

   벽에 붙여 놓으면 "통로 한쪽이 좁아진 것" 이라 반대쪽으로 피하면 그만이다.
   떼어 놓으면 위로 넘길지 아래로 돌릴지를 매번 골라야 한다.

   두 개를 지그재그로 엇갈려 세운다 — 하나는 위쪽 반, 하나는 아래쪽 반.
   같은 줄에 나란히 서면 벽 하나가 두꺼워진 것과 다를 바 없어서
   위아래 어느 쪽으로 돌리든 결과가 같아진다.

   크기는 곧게 가는 길만 걸리적거릴 만큼이다. */
const 고드름수 = 2;
const 높이최소 = 0.11, 높이최대 = 0.16;   // 얼음판 높이 대비
const 밑변비 = 0.58;                      // 높이 대비 밑변 폭
const 엇갈림최소 = 0.15, 엇갈림최대 = 0.28;  // 가운데선에서 얼마나 비켜 서나

// 쪽: -1 이면 위쪽 반, +1 이면 아래쪽 반
function 고드름만들기(x, 쪽) {
  const h = LANE_H * (높이최소 + Math.random() * (높이최대 - 높이최소));
  const w = h * 밑변비;
  const 비켜 = LANE_H * (엇갈림최소 + Math.random() * (엇갈림최대 - 엇갈림최소));
  const 여유 = 9;
  // 삼각형의 세로 한가운데를 잡고 위아래로 펼친다
  let 중심 = CY + 쪽 * 비켜;
  중심 = Math.min(LANE_BOT - 여유 - h / 2, Math.max(LANE_TOP + 여유 + h / 2, 중심));
  const 밑 = 중심 + h / 2;
  return {
    x, 밑, 높이: h, 폭: w, 꼭지: 밑 - h,
    // 울퉁불퉁하게 그릴 때 쓰는 값. 매판 흔들리지 않게 미리 뽑아 둔다.
    결: Array.from({ length: 4 }, () => 0.55 + Math.random() * 0.9),
  };
}

// 충돌에 쓰는 삼각형 세 점. 그림은 이 안쪽에서 울퉁불퉁하게 그린다.
function 고드름점(g) {
  return [{ x: g.x,           y: g.꼭지 },
          { x: g.x + g.폭 / 2, y: g.밑 },
          { x: g.x - g.폭 / 2, y: g.밑 }];
}

function 고드름놓기() {
  고드름 = [];
  // 출발점 앞은 비워 둔다 — 놓자마자 부딪히면 손쓸 도리가 없다.
  // 오른쪽 끝도 과녁이 놓일 자리(415~577)보다 앞에서 끊는다.
  const 왼끝 = START_X + 110 * SCALE;
  const 오른끝 = 470 * SCALE;
  const 칸 = (오른끝 - 왼끝) / 고드름수;

  // 어느 쪽이 위로 갈지는 매판 뒤집는다
  const 첫쪽 = Math.random() < 0.5 ? -1 : 1;

  for (let i = 0; i < 고드름수; i++) {
    const x = 왼끝 + 칸 * i + 칸 * (0.22 + Math.random() * 0.56);
    고드름.push(고드름만들기(x, i % 2 === 0 ? 첫쪽 : -첫쪽));
  }
}
/* 한 번 밀어 보고 돌이 멎은 자리를 돌려준다. 판을 만들 때만 쓴다. */
function 굴려보기(당김, 각도) {
  const 담아둠 = stone;
  const rad = 각도 * Math.PI / 180;
  stone = { x: START_X, y: CY,
            vx: 당김 * POWER * Math.cos(rad), vy: 당김 * POWER * Math.sin(rad) };
  let 튕김수 = 0, n = 0;
  while (n++ < 3000) {
    stone.x += stone.vx; stone.y += stone.vy;
    stone.vx *= FRICTION; stone.vy *= FRICTION;
    if (stone.y < WALL_TOP) { stone.y = WALL_TOP; stone.vy = -stone.vy * .7; 튕김수++; }
    if (stone.y > WALL_BOT) { stone.y = WALL_BOT; stone.vy = -stone.vy * .7; 튕김수++; }
    if (stone.x > WALL_RIGHT) { stone.x = WALL_RIGHT; stone.vx = -stone.vx * .7; 튕김수++; }
    if (stone.x < WALL_LEFT)  { stone.x = WALL_LEFT;  stone.vx = -stone.vx * .7; 튕김수++; }
    if (기둥충돌()) 튕김수++;
    if (Math.hypot(stone.vx, stone.vy) <= 0.06 * SCALE) break;
  }
  const 끝 = { x: stone.x, y: stone.y, 튕김수 };
  stone = 담아둠;
  return 끝;
}

/* 과녁 자리를 정한다.

   자리를 먼저 아무 데나 찍고 "풀 수 있나" 를 뒤늦게 확인하면 안 된다.
   세기와 각도를 격자로 훑어야 하는데 한 판에 400ms 가까이 걸렸다.
   누르는 순간 화면이 멎는다.

   그래서 거꾸로 한다 — **실제로 한 번 밀어 보고 돌이 멎은 자리를 과녁으로 삼는다.**
   그 자리는 방금 그 손짓으로 닿은 곳이니 풀 수 있는 판인 것이 확실하고,
   확인에 한 번의 굴림밖에 안 든다.

   고드름을 넘어온 길이면 그 판은 튕겨야만 넣을 수 있는 판이 된다.
   판이 어려워지는 만큼 반드시 답이 하나는 있다는 것도 같이 보장된다. */
function 과녁정하기() {
  const 왼 = 486 * SCALE, 오른 = 676 * SCALE;      // 과녁이 놓일 가로 구간
  const 여유 = TARGET_R * 2.6 + 4;                  // 얼음판 안에 온전히 들어오게
  for (let 시도 = 0; 시도 < 300; 시도++) {
    const 세기 = MAX_PULL * (0.42 + Math.random() * 0.58);
    const 각도 = (Math.random() * 2 - 1) * 46;
    const 끝 = 굴려보기(세기, 각도);
    if (끝.x < 왼 || 끝.x > 오른) continue;
    if (끝.y < LANE_TOP + 여유 || 끝.y > LANE_BOT - 여유) continue;
    targetX = 끝.x; targetY = 끝.y;
    return true;
  }
  return false;
}

function newRound() {
  고드름놓기();
  // 밀어서 닿는 자리를 못 찾으면 (아주 드물다) 고드름을 치우고 다시 찾는다.
  if (!과녁정하기()) {
    고드름 = [];
    if (!과녁정하기()) {          // 그래도 안 되면 예전처럼 아무 데나
      targetX = (486 + Math.random() * 190) * SCALE;
      targetY = CY;
    }
  }
  stone = { x: START_X, y: CY, vx: 0, vy: 0 };
  pull = { x: 0, y: 0 };
  pulling = false;
}

function drawTarget() {
  // 과녁: 안쪽 원 두 개만. 바깥 큰 원들은 눈밭을 어지럽히기만 해서 뺐다.
  // 눈밭 위라 붉은 기가 도는 색이라야 눈에 띈다.
  // 원이 하나뿐이라 테두리를 진하게 해야 멀리서도 보인다.
  ctx.beginPath(); ctx.arc(targetX, targetY, TARGET_R * 2.6, 0, 6.2832);
  ctx.fillStyle = "rgba(190, 60, 40, .22)"; ctx.fill();
  ctx.strokeStyle = "rgba(180, 55, 38, .70)"; ctx.lineWidth = 2; ctx.stroke();
  // 성공 범위 — 여기 멈춰야 한다
  ctx.beginPath(); ctx.arc(targetX, targetY, TARGET_R, 0, 6.2832);
  ctx.fillStyle = "rgba(200, 60, 44, .62)";
  ctx.fill();
  ctx.strokeStyle = "#e2564a"; ctx.lineWidth = 2.5; ctx.stroke();
}

/* 삼각 고드름을 그린다.

   충돌은 반듯한 삼각형으로 따지고, 그림은 그 안쪽에서 옆구리를 울퉁불퉁하게
   깎아 얼음처럼 보이게 한다. 그림이 판정보다 조금 작은 쪽이 억울함이 덜하다 —
   "닿을 줄 알았는데 안 닿았다" 보다 "안 닿을 줄 알았는데 닿았다" 가 낫다. */
function drawIcicles() {
  for (const g of 고드름) {
    const 반 = g.폭 / 2;

    // 옆구리를 몇 마디로 나눠 안쪽으로 조금씩 깎는다
    const 옆 = (부호) => {
      const 점 = [];
      for (let i = 1; i <= g.결.length; i++) {
        const t = i / (g.결.length + 1);              // 꼭지 → 밑
        const 기본 = 반 * t;
        점.push({ x: g.x + 부호 * 기본 * (0.80 + 0.20 * g.결[i - 1]),
                  y: g.꼭지 + g.높이 * t });
      }
      return 점;
    };

    ctx.beginPath();
    ctx.moveTo(g.x, g.꼭지);
    for (const p of 옆(1)) ctx.lineTo(p.x, p.y);
    ctx.lineTo(g.x + 반, g.밑);
    ctx.lineTo(g.x - 반, g.밑);
    for (const p of 옆(-1).reverse()) ctx.lineTo(p.x, p.y);
    ctx.closePath();

    // 왼쪽이 밝고 오른쪽이 그늘진 얼음빛
    const 결 = ctx.createLinearGradient(g.x - 반, 0, g.x + 반, 0);
    결.addColorStop(0,    "rgba(126, 200, 240, .97)");
    결.addColorStop(0.34, "rgba(196, 232, 250, .98)");
    결.addColorStop(0.62, "rgba(96, 178, 226, .97)");
    결.addColorStop(1,    "rgba(58, 140, 198, .97)");
    ctx.fillStyle = 결;
    ctx.fill();
    ctx.strokeStyle = "rgba(40, 108, 160, .8)";
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // 꼭지에서 흘러내리는 밝은 결 두 줄
    ctx.beginPath();
    ctx.moveTo(g.x - 반 * 0.06, g.꼭지 + g.높이 * 0.12);
    ctx.lineTo(g.x - 반 * 0.42, g.밑 - g.높이 * 0.06);
    ctx.moveTo(g.x + 반 * 0.10, g.꼭지 + g.높이 * 0.30);
    ctx.lineTo(g.x + 반 * 0.30, g.밑 - g.높이 * 0.10);
    ctx.strokeStyle = "rgba(255, 255, 255, .55)";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.stroke();

    // 바닥에 깔리는 그림자 — 얼음판 위에 서 있는 것으로 읽히게
    ctx.beginPath();
    ctx.ellipse(g.x, g.밑, 반 * 0.9, g.높이 * 0.06, 0, 0, 6.2832);
    ctx.fillStyle = "rgba(30, 62, 96, .22)";
    ctx.fill();
  }
}

// 얼음판 경계를 눈 쌓인 조약돌 줄로 표시한다.
// 그냥 선을 그으면 "여기가 끝" 으로만 읽히는데, 돌을 놓으면
// "부딪히면 튕기겠구나" 가 한눈에 온다.
//
// 자리를 난수로 흩지 않고 규칙적으로 놓는다 — 매판 달라지면
// 어디서 튕길지 가늠이 안 되어 운 게임이 된다.
function 조약돌(x, y, k) {
  const r = 7 * SCALE;
  const rw = r * 1.15 * k, rh = r * 0.78 * k;

  ctx.beginPath();
  ctx.ellipse(x, y, rw, rh, 0, 0, 6.2832);
  ctx.fillStyle = "rgba(118, 128, 142, .85)";     // 젖은 돌빛
  ctx.fill();

  // 위에 얹힌 눈
  ctx.beginPath();
  ctx.ellipse(x, y - rh * 0.34, rw * 0.86, rh * 0.5, 0, Math.PI, 0);
  ctx.fillStyle = "rgba(242, 247, 252, .92)";
  ctx.fill();
}

function drawEdge(y) {
  const gap = 7 * SCALE * 1.75;          // 조금씩 겹쳐 한 줄로 이어 보이게
  for (let x = gap / 2; x < W + 7 * SCALE; x += gap) {
    // 크기를 조금씩 달리해 손으로 놓은 것처럼 보이게 한다.
    // 난수가 아니라 x 로 정해지므로 매판 같은 모양이다.
    조약돌(x, y, 0.82 + 0.18 * Math.abs(Math.sin(x * 0.37)));
  }
}

// 오른쪽 끝 줄. 여기 부딪히면 되돌아온다.
// 예전에는 여기 닿으면 "지나침" 으로 판이 끝났는데, 그러면 세게 미는 길이
// 통째로 막혀서 튕겨 돌아오는 수를 못 썼다.
function drawEdgeV(x) {
  const gap = 7 * SCALE * 1.75;
  for (let y = LANE_TOP + gap / 2; y < LANE_BOT; y += gap) {
    조약돌(x, y, 0.82 + 0.18 * Math.abs(Math.sin(y * 0.37)));
  }
}

// 돌이 나갈 쪽으로 깔리는 옅은 노란 길.
// 길이는 고정이고 끝은 투명하게 흩어진다. 당긴 만큼 길어지게 하면
// 세기까지 눈으로 읽혀서 손 감각으로 가늠하는 재미가 사라진다.
// 끝을 흐려 두면 "어디까지 간다" 가 아니라 "이쪽으로 간다" 로만 읽힌다.
const AIM_LEN = 150 * SCALE;      // 길의 길이 (당긴 세기와 무관)
const AIM_W   = 40 * SCALE;       // 돌 몸통만 한 폭

function 길그리기() {
  const len = Math.hypot(pull.x, pull.y);
  if (len < 8 * SCALE) return;          // 놓아도 안 나가는 세기 — 아직 방향이랄 게 없다

  ctx.save();
  ctx.translate(stone.x, stone.y);
  ctx.rotate(Math.atan2(pull.y, pull.x));

  const s = STONE_R * 0.3;              // 돌 밑에서 시작해 깔려 나간다
  const 깔기 = (폭, 진하기) => {
    const g = ctx.createLinearGradient(s, 0, s + AIM_LEN, 0);
    g.addColorStop(0,    "rgba(255, 212, 84, " + 진하기 + ")");
    g.addColorStop(0.45, "rgba(255, 212, 84, " + (진하기 * 0.55).toFixed(3) + ")");
    g.addColorStop(1,    "rgba(255, 212, 84, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(s, -폭 / 2, AIM_LEN, 폭);
  };

  깔기(AIM_W, 0.30);                    // 길 전체
  깔기(AIM_W * 0.3, 0.34);              // 한가운데만 조금 더 — 눈 위에서도 선이 잡힌다

  ctx.restore();
}

function drawStone() {
  // 당기는 동안 돌이 조금만 뒤로 물러난다.
  // 눌리고 있다는 것만 알려줄 뿐, 세기를 재기에는 턱없이 작다.
  const k = pulling ? 0.16 : 0;
  const x = stone.x - pull.x * k;
  const y = stone.y - pull.y * k;

  if (stoneReady) {
    // 컬링 스톤은 납작하다. 그림(96×96) 안에서 돌 몸통은 가로 84 · 세로 52 를 쓴다.
    // 몸통 가로가 44px 로 보이도록 역산해서 그린다. 세로는 27px 쯤 된다.
    const d = 44 * 96 / 84 * SCALE;
    ctx.drawImage(stoneImg, x - d / 2, y - d / 2, d, d);
    return;
  }
  // 그림이 아직 안 왔을 때만 쓰는 대체 모양
  const g = ctx.createRadialGradient(x - 4, y - 5, 2, x, y, STONE_R);
  g.addColorStop(0, "#e6edf7");
  g.addColorStop(1, "#8fa3bd");
  ctx.beginPath(); ctx.arc(x, y, STONE_R, 0, 6.2832);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#5b6b83"; ctx.lineWidth = 2; ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 얼음판. 예전에는 이 띠가 실제로 돌이 노는 구간보다 좁아서,
  // 위아래로 튕길 수 있다는 걸 아무도 몰랐다. 이제 노는 구간과 정확히 같다.
  ctx.fillStyle = "rgba(70, 92, 120, .16)";
  ctx.fillRect(0, LANE_TOP, W, LANE_H);
  drawEdge(LANE_TOP);          // 위 경계 — 여기 부딪히면 튕긴다
  drawEdge(LANE_BOT);
  drawEdgeV(LANE_RIGHT);       // 오른쪽 끝 — 여기서도 되돌아온다

  // 출발선
  ctx.strokeStyle = "rgba(40,60,86,.45)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 7]);
  ctx.beginPath(); ctx.moveTo(START_X, LANE_TOP + 6); ctx.lineTo(START_X, LANE_BOT - 6); ctx.stroke();
  ctx.setLineDash([]);

  // 과녁과 기둥은 시작 전에는 감춘다. 자리가 매판 바뀌므로 미리 보여줄 이유가 없고,
  // 시작하는 순간 나타나야 "이번 판은 여기구나" 가 눈에 들어온다.
  if (state !== "ready") { drawTarget(); drawIcicles(); }

  // 당기는 동안만 갈 길을 깔아 준다. 세기는 여전히 손 감각으로 가늠한다.
  if (state === "aiming" && pulling) 길그리기();
  drawStone();
}

function toCanvas(ev) {
  const b = cv.getBoundingClientRect();
  return { x: (ev.clientX - b.left) * (W / b.width),
           y: (ev.clientY - b.top)  * (H / b.height) };
}

// 과녁 중심까지의 거리. 굴러가는 중에 보여주는 값과 마지막 판정값은
// 반드시 같은 자로 재야 한다. 예전에는 화면에 가로 거리만 띄우고 판정은
// 가로세로를 함께 봐서, 비스듬히 민 판은 "0px" 이라고 떠 있다가
// 멈추는 순간 갑자기 80px 로 튀었다.
function distToTarget() {
  return Math.hypot(stone.x - targetX, stone.y - targetY);
}

/* 삼각 고드름에 부딪히면 튕긴다.

   돌은 동그라미, 고드름은 삼각형이다. 삼각형의 세 변에서 돌 중심에 가장
   가까운 점을 찾아, 그 점까지가 돌 반지름보다 짧으면 닿은 것이다.
   중심이 삼각형 안까지 들어왔으면 가장 얕게 빠져나갈 변으로 밀어낸다.

   밀어내지 않으면 다음 칸에서 또 닿은 것으로 쳐서 안에 갇힌 채 부르르 떤다. */
function 변위점(a, b, p) {
  const vx = b.x - a.x, vy = b.y - a.y;
  const 길이2 = vx * vx + vy * vy;
  let t = 길이2 ? ((p.x - a.x) * vx + (p.y - a.y) * vy) / 길이2 : 0;
  t = Math.max(0, Math.min(1, t));
  return { x: a.x + vx * t, y: a.y + vy * t };
}

function 삼각형안(점들, p) {
  const 부호 = (a, b) => (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);
  const s1 = 부호(점들[0], 점들[1]);
  const s2 = 부호(점들[1], 점들[2]);
  const s3 = 부호(점들[2], 점들[0]);
  return !((s1 < 0 || s2 < 0 || s3 < 0) && (s1 > 0 || s2 > 0 || s3 > 0));
}

function 기둥충돌() {
  let 닿음 = false;
  for (const g of 고드름) {
    const 점들 = 고드름점(g);
    const 안 = 삼각형안(점들, stone);

    // 세 변 가운데 제일 가까운 곳
    let 가까운 = null, 최소 = Infinity;
    for (let i = 0; i < 3; i++) {
      const q = 변위점(점들[i], 점들[(i + 1) % 3], stone);
      const d = Math.hypot(stone.x - q.x, stone.y - q.y);
      if (d < 최소) { 최소 = d; 가까운 = q; }
    }
    if (!안 && 최소 > STONE_R) continue;

    // 밀어낼 방향. 안에 들어왔으면 가까운 변의 바깥쪽으로 나간다.
    let nx = stone.x - 가까운.x, ny = stone.y - 가까운.y;
    const 길이 = Math.hypot(nx, ny);
    if (길이 < 0.0001) { nx = 0; ny = stone.y < g.꼭지 + g.높이 / 2 ? -1 : 1; }
    else { nx /= 길이; ny /= 길이; }
    if (안) { nx = -nx; ny = -ny; }

    const 밀 = 안 ? 최소 + STONE_R : STONE_R - 최소;
    stone.x += nx * 밀;
    stone.y += ny * 밀;

    // 부딪힌 면 방향으로 되튕긴다. 벽과 같은 0.7 을 쓴다.
    const 속 = stone.vx * nx + stone.vy * ny;
    if (속 < 0) {
      stone.vx -= (1 + 0.7) * 속 * nx;
      stone.vy -= (1 + 0.7) * 속 * ny;
    }
    닿음 = true;
  }
  return 닿음;
}

// 물리는 실제로 흐른 시간으로 굴린다. 프레임 수로 세면 144Hz 모니터에서
// 같은 거리를 2.4배 빨리 지나가 버려서 사람마다 체감이 달라진다.
const STEP = 1 / 60;             // 계산 기준 한 칸 (초). 이 값이 예전 한 프레임이다.
let lastT = 0, carry = 0;
let 튕김 = false;                 // 이번 프레임에 벽에 부딪혔는가 (소리용)

function slide(now) {
  // 흐른 시간만큼 예전과 똑같은 계산을 여러 번 돌린다.
  // 이러면 어떤 주사율에서도 굴러가는 거리와 시간이 같아진다.
  const dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : STEP;
  lastT = now;
  carry += dt;

  while (carry >= STEP) {
    carry -= STEP;
    stone.x += stone.vx;
    stone.y += stone.vy;
    stone.vx *= FRICTION;
    stone.vy *= FRICTION;

    // 위아래 벽에 부딪히면 튕긴다
    if (stone.y < WALL_TOP) { stone.y = WALL_TOP; stone.vy = -stone.vy * .7; 튕김 = true; }
    if (stone.y > WALL_BOT) { stone.y = WALL_BOT; stone.vy = -stone.vy * .7; 튕김 = true; }
    // 좌우 끝에서도 튕긴다
    if (stone.x > WALL_RIGHT) { stone.x = WALL_RIGHT; stone.vx = -stone.vx * .7; 튕김 = true; }
    if (stone.x < WALL_LEFT)  { stone.x = WALL_LEFT;  stone.vx = -stone.vx * .7; 튕김 = true; }
    // 얼음 기둥에 부딪혀도 튕긴다
    if (기둥충돌()) 튕김 = true;

    if (Math.hypot(stone.vx, stone.vy) <= 0.06 * SCALE) break;
  }

  // 위아래 벽에 부딪혔으면 그 순간 소리를 낸다.
  // 튕기는 것이 눈에만 보이고 소리가 없으면 화면이 죽어 보인다.
  if (튕김) { Sound.thud(0.35); Sound.crackle(1.4); 튕김 = false; }

  const speed = Math.hypot(stone.vx, stone.vy);
  // 미끄러지는 소리를 속도에 맞춰 계속 울린다.
  // 처음 민 세기가 대략 11 정도라 그 값으로 나눠 0~1 로 바꾼다.
  Sound.slideSet(Math.min(1, speed / (11 * SCALE)));
  status.innerHTML = "굴러가는 중 &nbsp;·&nbsp; <b>"
                   + distToTarget().toFixed(1) + "</b>px";

  draw();
  if (speed > 0.06 * SCALE) {
    anim = requestAnimationFrame(slide);
  } else {
    anim = 0;
    judge();
  }
}

function judge() {
  const d = distToTarget();
  const ok = d <= TARGET_R;
  state = "done";
  cv.classList.add("idle");

  // 멈추면 미끄러지는 소리만 끊는다.
  // 예전에는 여기서 한 번 더 울렸다(자리 잡는 소리 + 느려질수록 조여드는 낮은 음).
  // 떡·돌탑은 내가 누른 순간 나는 소리라 반응으로 들리지만,
  // 조약돌은 손을 뗀 지 한참 뒤라 내 조작과 이어지지 않는다.
  // 판정음 직전에 낮게 울리기까지 해서 판정음이 두 번 나는 것처럼 들렸다.
  Sound.slideStop();

  status.innerHTML = "중심에서 <b>" + d.toFixed(1) + "</b>px";

  slot.innerHTML = verdictHtml(ok, d.toFixed(1) + " px", "");
  go.textContent = "다 시";

  setTimeout(() => { if (ok) Sound.success(); else Sound.fail(); }, 120);
  draw();
}

cv.addEventListener("pointerdown", (e) => {
  if (state !== "aiming") return;
  const p = toCanvas(e);
  if (Math.hypot(p.x - stone.x, p.y - stone.y) > 30 * SCALE) return;
  pulling = true;
  cv.classList.add("pulling");
  cv.setPointerCapture(e.pointerId);
  status.innerHTML = "뒤로 당겼다 놓으세요";
  draw();
});

cv.addEventListener("pointermove", (e) => {
  if (!pulling) return;
  const p = toCanvas(e);
  let dx = stone.x - p.x, dy = stone.y - p.y;
  const len = Math.hypot(dx, dy);
  if (len > MAX_PULL) { dx = dx / len * MAX_PULL; dy = dy / len * MAX_PULL; }
  // 앞쪽으로는 당길 수 없다
  pull = { x: Math.max(0, dx), y: dy };
  draw();
});

cv.addEventListener("pointerup", () => {
  if (!pulling) return;
  pulling = false;
  cv.classList.remove("pulling");
  const power = Math.hypot(pull.x, pull.y);
  if (power < 8 * SCALE) { draw(); return; }        // 살짝 건드린 건 무시

  state = "sliding";
  stone.vx = pull.x * POWER;
  stone.vy = pull.y * POWER;
  // 손에서 놓는 순간 — 미는 힘에 따라 세기가 달라진다
  Sound.thud(0.3 + Math.min(0.6, power / MAX_PULL * 0.6));
  Sound.crackle(1.6);
  Sound.slideStart();             // 여기서부터 멈출 때까지 계속 미끄러지는 소리
  튕김 = false;
  lastT = 0; carry = 0;           // 시간 누적을 새로 시작한다
  anim = requestAnimationFrame(slide);
});

function reset() {
  cancelAnimationFrame(anim); anim = 0;
  Sound.slideStop();
  state = "ready";
  newRound();
  slot.innerHTML = "";
  cv.classList.add("idle");
  status.innerHTML = "과녁 한가운데 멈추면 성공";
  go.textContent = "도 전";
  draw();
}

function start() {
  cancelAnimationFrame(anim); anim = 0;
  state = "aiming";
  newRound();
  slot.innerHTML = "";
  cv.classList.remove("idle");
  status.innerHTML = "돌을 잡고 뒤로 당기세요";
  go.textContent = "포 기";
  draw();
}

function press() {
  if (state === "ready") start();
  else if (state === "aiming" || state === "sliding") {
    cancelAnimationFrame(anim); anim = 0;
    Sound.slideStop();                        // 포기해도 소리는 끊어야 한다
    state = "done"; pulling = false;
    cv.classList.add("idle");
    slot.innerHTML = verdictHtml(false, "포기", "");
    go.textContent = "다 시";
  } else reset();
}

go.addEventListener("click", press);
onPressKey(press);
reset();
</script>
</body>
