<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ec4899' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ec4899'/%3E%3C/svg%3E">
<title>돌탑 쌓기</title>
<link rel="stylesheet" href="common.css?v=86">
<script src="common.js?v=86"></script>
<script src="sound.js?v=86"></script>
<style>
  :root { --accent-1: #0ea5e9; --accent-2: #4f46e5; }

  /* 뒷산 오솔길. 가운데 흙길이 세로로 비어 있어 탑이 올라갈 자리가 된다. */
  .stage { background: url('assets/stack/bg.webp') center / cover no-repeat; }
  .topbar { background: rgba(22, 22, 40, .42); }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(18,20,14,.20) 0%, rgba(18,20,14,.02) 26%,
                                        rgba(18,20,14,.22) 62%, rgba(18,20,14,.52) 100%);
  }
  .body { z-index: 1; }

  /* 조작 프레임(432) + 안내(28) + 버튼(68). 판정은 프레임 위에 겹친다.
     프레임 밖에 판정 칸을 따로 두면 프레임이 그만큼 작아져야 해서 손해다. */
  .board { width: 100%; display: grid; justify-items: center;
           grid-template-rows: var(--play-h) 30px auto; align-content: center;
           position: relative; }
  .towerslot { display: grid; place-items: center; order: 1;
               width: var(--play-w); height: var(--play-h); }
  .status    { order: 2; align-self: center; }
  .controls  { text-align: center; order: 3; }
  /* 판정은 프레임 한가운데에 떠오른다 */
  .slot { position: absolute; left: 50%; top: calc(var(--play-h) / 2);
          transform: translate(-50%, -50%); z-index: 4;
          display: grid; place-items: center; pointer-events: none; }

  /* 탑은 코드가 그린다. 돌 그림 한 장을 폭만 줄여 가며 쌓는다. */
  canvas { display: block; }

  /* 돌이 얹힐 때의 짧은 울림. 판정 흔들림보다 훨씬 작다.
     이제 매 층 울리되 세기를 다르게 한다 — 잘 놓으면 묵직하게, 아슬아슬하면 얕게.
     같은 세기로 열네 번 흔들면 금방 무뎌져서 아무 뜻도 없는 진동이 된다.
     세기는 코드가 --tp 로 넣어 준다. */
  .stage { --tp: 3px; }
  .stage.thump { animation: stage-thump .22s ease-out; }
  @keyframes stage-thump {
    0%   { transform: rotate(var(--rot, 0deg)) scale(var(--fit, 1)) translate(0, 0); }
    30%  { transform: rotate(var(--rot, 0deg)) scale(var(--fit, 1)) translate(0, var(--tp)); }
    62%  { transform: rotate(var(--rot, 0deg)) scale(var(--fit, 1))
                      translate(0, calc(var(--tp) * -0.35)); }
    100% { transform: rotate(var(--rot, 0deg)) scale(var(--fit, 1)) translate(0, 0); }
  }

  .status { font-size: 15px; color: var(--text-dim); letter-spacing: .3px;
            text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .status b { color: #fff; font-size: 17px; }
  .verdict .detail { text-shadow: 0 3px 10px rgba(0,0,0,.9); }
  .verdict .sub { display: none; }
  .verdict .mark { background: rgba(16,20,26,.72); }
  .verdict.ok .mark { background: rgba(16,40,26,.72); border-color: #4ade80; }
</style>
</head>
<body>
<div id="fit"><div class="stage">

  <div class="topbar">
    <a class="back" href="index.html" title="목록으로">←</a>
    <div class="tile sm pic"><img src="assets/_icons/stack.webp" alt=""></div>
    <div class="titles">
      <h1>돌탑 쌓기</h1>
      <p>Stack</p>
    </div>
  </div>

  <div class="body">
    <div class="play">
      <div class="board">
        <div class="towerslot playslot"><canvas id="cv" width="768" height="409"></canvas></div>
        <div class="status" id="status"></div>
        <div class="slot" id="slot"></div>
        <div class="controls">
          <button class="btn" id="go">도 전</button>
          <div class="hint">스페이스바로 내려놓기</div>
        </div>
      </div>
    </div>

    <aside class="rules card">
      <h2>규칙</h2>
      <ul>
        <li>움직이는 돌을 눌러 쌓으세요</li>
        <li>어긋난 만큼 돌이 깎입니다</li>
        <li>완전히 빗나가면 즉시 실패</li>
        <li>기회는 한 번뿐입니다</li>
        <li><b>[성공기준]</b> 14층 쌓기</li>
      </ul>
    </aside>
  </div>

</div></div>

<script>
"use strict";

const R = RULES.stack;

Sound.use({
  thud:        "assets/_sounds/stack/place-hard.mp3", // 돌이 얹히는 소리
  success:     "assets/_sounds/common/success.mp3",
  fail:        "assets/_sounds/common/fail.mp3",
});
const cv     = document.getElementById("cv");
const ctx    = cv.getContext("2d");
const status = document.getElementById("status");
const slot   = document.getElementById("slot");
const go     = document.getElementById("go");

const W = cv.width, H = cv.height;
// 층 높이는 캔버스 안에 15층이 다 들어가도록 잡는다.
// 돌 그림이 들어가면서 13px 로는 돌처럼 안 보여 20px 로 키웠다.
// 캔버스를 620 → 768 로 키우면서 안의 모든 값을 같은 수로 곱했다.
// 비율이 하나도 안 바뀌므로 실력 기준은 그대로다.
const SCALE = 768 / 620;         // 1.2387
const BAR_W = R.barW * SCALE;    // 첫 돌 너비 56 → 69.4 (화면에 보이는 값)
const BH = 20 * SCALE;           // 한 층 높이 24.8
const BASE_Y = H - 24 * SCALE;   // 바닥
const VIEW_ROWS = 15;            // 화면에 보이는 층 수 (넘으면 아래로 내려간다)

// 돌 그림. 폭이 깎여도 같은 그림을 가로로 줄여 쓴다.
const stoneImg = new Image();
let stoneReady = false;
stoneImg.onload = () => { stoneReady = true; draw(); };
stoneImg.src = "assets/stack/stone.webp";

/* 돌을 붉은 벽돌빛으로 물들인다.

   돌 그림은 한 장뿐이라 그대로 쌓으면 같은 벽돌이 열네 번 반복돼 보인다.
   층마다 색을 조금씩 달리하면 진짜 쌓아 올린 담벼락처럼 보인다.

   곱셈(multiply)으로 얹으면 원본보다 밝아질 수가 없어서 팥죽색이 된다.
   원본 베이지가 169 인데 벽돌은 230 쯤 되어야 하기 때문이다.
   그래서 "color" 로 얹는다 — 색은 새로 입히고 밝기는 원본 무늬를 그대로 쓴다.
   얹고 나면 알파가 사각형으로 번지므로 원본 알파로 다시 오려낸다. */
const 물든돌 = {};                  // 색 → 물들인 그림. 같은 색은 다시 안 만든다

/* 벽돌 색은 몇 가지 중에서 뽑는다.

   매번 새로 만들면 열네 층이 전부 다른 색이 되어 알록달록해진다.
   진짜 담벼락은 대부분 같은 색이고 사이사이 조금 다른 것이 섞여 있다.
   그래서 바탕색을 여러 번 넣어 자주 걸리게 하고, 나머지를 가끔 섞는다. */
const 벽돌색들 = [
  "hsl(12,72%,56%)",   // 바탕
  "hsl(12,72%,56%)",
  "hsl(12,72%,56%)",
  "hsl(14,66%,62%)",   // 조금 밝은 것
  "hsl(9,64%,48%)",    // 조금 어두운 것
  "hsl(18,60%,59%)",   // 주황기가 도는 것
];

function 벽돌색() {
  return 벽돌색들[Math.floor(Math.random() * 벽돌색들.length)];
}

function 물들이기(색) {
  if (물든돌[색]) return 물든돌[색];
  const c = document.createElement("canvas");
  c.width = stoneImg.naturalWidth || 216;
  c.height = stoneImg.naturalHeight || 80;
  const x = c.getContext("2d");
  x.drawImage(stoneImg, 0, 0);
  x.globalCompositeOperation = "color";            // 색만 갈아 끼우고 밝기는 유지
  x.fillStyle = 색;
  x.fillRect(0, 0, c.width, c.height);
  // 원본이 베이지라 "color" 만으로는 채도가 옅다. 한 번 더 얹어 벽돌빛을 낸다.
  x.globalCompositeOperation = "saturation";
  x.fillStyle = 색;
  x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = "destination-in";   // 원본 알파로 다시 오려낸다
  x.drawImage(stoneImg, 0, 0);
  물든돌[색] = c;
  return c;
}

let state = "ready";             // ready | running | done
let tower = [];                  // 쌓인 층들 { x, w }
let cur = null;                  // 지금 움직이는 막대
let raf = 0;
let camera = 0;                  // 탑이 높아지면 화면을 내린다

function reset() {
  cancelAnimationFrame(raf);
  state = "ready";
  camera = 0;
  tower = [{ x: (W - BAR_W) / 2, w: BAR_W, 색: 벽돌색() }];   // 맨 아래 한 층은 주어진다
  cur = null;
  slot.innerHTML = "";
  status.innerHTML = "<b>" + R.layers + "</b>층까지 쌓으면 성공";
  go.textContent = "도 전";
  draw();
}

// 돌이 묵직하게 얹힐 때 화면이 아주 살짝 울린다.
// 판정 때 쓰는 흔들림과 달리 한 번에 끝나는 짧은 것이라 따로 둔다.
// 매 층 크게 흔들면 쌓는 내내 어지러워서 폭을 작게 잡았다.
const 무대 = document.querySelector(".stage");
function 화면울림(정확도) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  // 잘 놓을수록 깊게 내려앉는다. 아슬아슬하게 걸친 판은 얕게 스친다.
  const p = Number.isFinite(정확도) ? Math.max(0, Math.min(1, 정확도)) : 0.6;
  무대.style.setProperty("--tp", (1.4 + p * 3.4).toFixed(1) + "px");
  무대.classList.remove("thump");
  void 무대.offsetWidth;
  무대.classList.add("thump");
  setTimeout(() => 무대.classList.remove("thump"), 260);
}

// 게임 중에는 지금 몇 층인지를 보여준다.
// 목표만 띄워 두면 쌓는 동안 내가 어디까지 왔는지 셀 수가 없다.
function showFloor() {
  status.innerHTML = "<b>" + tower.length + "</b>층 &nbsp;·&nbsp; 목표 <b>"
                   + R.layers + "</b>층";
}

function start() {
  state = "running";
  camera = 0;
  tower = [{ x: (W - BAR_W) / 2, w: BAR_W, 색: 벽돌색() }];
  spawn();
  slot.innerHTML = "";
  showFloor();
  // 예전에는 여기서 낮은 음을 깔고 층이 오를수록 조여들게 했다.
  // 뱃고동처럼 울려서 돌 얹히는 소리를 덮었다. 떡·조약돌과 함께 뺐다.
  go.textContent = "내려놓기";
  lastFrame = 0;
  raf = requestAnimationFrame(loop);
}

// 속도는 "초당 몇 px" 로 잡는다. 프레임 수로 세면 144Hz 모니터에서
// 2.4배 빨라져서 사람마다 난이도가 달라진다.
const SPEED_BASE = 130 * SCALE;  // 첫 층 속도 (px/초)
const SPEED_STEP = 13 * SCALE;   // 한 층 오를 때마다 더해지는 속도

/* 막바지 두 층만 따로 더 빠르게 한다.

   층마다 조금씩 빨라지기는 하는데, 그 정도로는 끝이 밋밋했다.
   14층까지 왔으면 마지막 몇 번은 손이 떨려야 완주가 값어치를 한다. */
const 막바지층 = [12, 13, 14];
const 막바지배수 = 1.2;

function 층속도(놓을층) {
  const 기본 = SPEED_BASE + (놓을층 - 1) * SPEED_STEP;
  return 막바지층.indexOf(놓을층) >= 0 ? 기본 * 막바지배수 : 기본;
}

// 새 막대를 만든다. 위로 갈수록 조금씩 빨라진다.
function spawn() {
  const top = tower[tower.length - 1];
  cur = {
    x: Math.random() < 0.5 ? 0 : W - top.w,
    w: top.w,
    dir: 0,
    speed: 층속도(tower.length + 1),   // 지금 놓으려는 것이 몇 층이 될지
    색: 벽돌색(),                     // 이 돌이 가질 색. 얹히면 그대로 남는다
  };
  cur.dir = cur.x === 0 ? 1 : -1;
}

let lastFrame = 0;

function loop(now) {
  if (state !== "running" || !cur) return;
  // 실제로 흐른 시간만큼 움직인다. 탭을 잠깐 벗어났다 와도 튀지 않게 상한을 둔다.
  const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
  lastFrame = now;

  cur.x += cur.dir * cur.speed * dt;
  if (cur.x <= 0)          { cur.x = 0;         cur.dir = 1; }
  if (cur.x + cur.w >= W)  { cur.x = W - cur.w; cur.dir = -1; }
  draw();
  raf = requestAnimationFrame(loop);
}

function drop() {
  if (state !== "running" || !cur) return;
  const top = tower[tower.length - 1];

  // 아래 층과 겹치는 부분만 남는다
  const left  = Math.max(cur.x, top.x);
  const right = Math.min(cur.x + cur.w, top.x + top.w);
  const overlap = right - left;

  if (overlap <= 0) { Sound.thud(1); finish(false, "빗나감"); return; }

  tower.push({ x: left, w: overlap, 색: cur.색 });

  // 얼마나 정확히 얹었는가. 1 이면 딱 맞았고 0 에 가까울수록 아슬아슬하다.
  const 정확도 = overlap / top.w;

  // 잘 맞을수록 묵직하게 "쿵", 빗맞을수록 가볍게 걸친 소리가 난다.
  // 소리만으로도 잘 놓았는지 알 수 있어야 손맛이 난다.
  Sound.thud(0.35 + 정확도 * 0.55);
  Sound.crackle(1 + (1 - 정확도) * 2);

  // 얹힐 때마다 화면이 울린다. 세기는 얼마나 잘 놓았는지에 따라 다르다.
  화면울림(정확도);

  showFloor();

  // 화면 밖으로 나가지 않게 시야를 올린다
  if (tower.length > VIEW_ROWS) camera = (tower.length - VIEW_ROWS) * BH;

  if (tower.length >= R.layers) { finish(true); return; }
  spawn();
  draw();
}

function finish(ok, why) {
  cancelAnimationFrame(raf);
  state = "done";
  cur = null;
  const built = tower.length;
  const topW = tower[tower.length - 1].w;

  status.innerHTML = "<b>" + built + "</b>층 &nbsp;·&nbsp; 남은 폭 <b>"
                   + topW.toFixed(1) + "</b>px";
  slot.innerHTML = verdictHtml(ok,
    ok ? built + "층 완성" : (why || "실패") + " " + built + "층",
    "");
  go.textContent = "다 시";
  // 돌이 얹히는 소리가 지나간 뒤에 판정음이 온다. 겹치면 둘 다 안 들린다.
  setTimeout(() => { if (ok) Sound.success(); else Sound.fail(); }, 130);
  draw();
}

// 돌 한 장을 그 층의 폭에 맞춰 늘려 그린다.
// 깎여 좁아진 돌도 같은 그림을 쓰므로 탑이 한 덩어리로 보인다.
function drawStone(x, y, w, dim, 색) {
  if (!stoneReady) {                       // 그림이 아직이면 실루엣이라도
    ctx.fillStyle = 색 || "#c0503a";
    roundRect(x, y, w, BH - 2 * SCALE, 4 * SCALE); ctx.fill();
    return;
  }
  ctx.save();
  if (dim) ctx.globalAlpha = 0.92;
  ctx.drawImage(색 ? 물들이기(색) : stoneImg, x, y, w, BH);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 목표 높이 선
  const goalY = BASE_Y - R.layers * BH + camera;

  // 돌빛이 흙길 색과 비슷해 묻힌다. 뒤에 옅은 판을 깔아 띄운다.
  // 돌이 오가는 가로 전체 × 바닥에서 목표선 살짝 위까지만 덮는다.
  const panelTop = goalY - 16 * SCALE;
  ctx.fillStyle = "rgba(28, 32, 26, .30)";
  roundRect(0, panelTop, W, BASE_Y + 10 * SCALE - panelTop, 16 * SCALE);
  ctx.fill();
  // 목표선은 하늘색으로. 흰색이면 돌빛·흙길과 섞여 그냥 무늬처럼 보인다.
  // 이 게임의 타일색(#0ea5e9)과 같은 계열이라 화면이 따로 놀지 않는다.
  //
  // 선 옆에 "14층" 이라고 적어 두었었는데 뺐다.
  // 아래 안내줄이 이미 "N층 · 목표 14층" 을 말해 주고 있어서 같은 말이 두 번 나온다.
  if (goalY > 6 * SCALE) {
    ctx.strokeStyle = "rgba(125, 211, 252, .85)";
    ctx.setLineDash([7 * SCALE, 7 * SCALE]);
    ctx.lineWidth = 2 * SCALE;
    ctx.beginPath(); ctx.moveTo(0, goalY); ctx.lineTo(W, goalY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 쌓인 돌
  for (let i = 0; i < tower.length; i++) {
    const b = tower[i];
    const y = BASE_Y - (i + 1) * BH + camera;
    if (y < -BH || y > H) continue;
    drawStone(b.x, y, b.w, true, b.색);
  }

  // 지금 움직이는 돌
  if (cur) {
    const y = BASE_Y - (tower.length + 1) * BH + camera;
    drawStone(cur.x, y, cur.w, false, cur.색);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function press() {
  if (state === "ready") start();
  else if (state === "running") drop();
  else reset();
}

go.addEventListener("click", press);
onPressKey(press);
reset();
</script>
