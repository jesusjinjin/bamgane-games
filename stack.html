<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ec4899' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ec4899'/%3E%3C/svg%3E">
<title>돌탑 쌓기</title>
<link rel="stylesheet" href="common.css?v=38">
<script src="common.js?v=38"></script>
<script src="sound.js?v=38"></script>
<style>
  :root { --accent-1: #0ea5e9; --accent-2: #4f46e5; }

  /* 뒷산 오솔길. 가운데 흙길이 세로로 비어 있어 탑이 올라갈 자리가 된다. */
  .stage { background: url('assets/stack/bg.webp') center / cover no-repeat; }
  .topbar { background: rgba(22, 22, 40, .42); }
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(18,20,14,.20) 0%, rgba(18,20,14,.02) 26%,
                                        rgba(18,20,14,.22) 62%, rgba(18,20,14,.52) 100%);
  }
  .body { z-index: 1; }

  /* 판정 → 돌탑 → 안내 → 버튼. 140 + 330 + 28 + 68 = 566 */
  .board { width: 100%; display: grid; justify-items: center;
           grid-template-rows: 140px 330px 28px auto; align-content: center; }
  .slot      { display: grid; place-items: center; order: 1; align-self: end; }
  .towerslot { display: grid; place-items: center; order: 2; }
  .status    { order: 3; align-self: center; }
  .controls  { text-align: center; order: 4; }

  /* 탑은 코드가 그린다. 돌 그림 한 장을 폭만 줄여 가며 쌓는다. */
  canvas { display: block; }

  .status { font-size: 15px; color: var(--text-dim); letter-spacing: .3px;
            text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .status b { color: #fff; font-size: 17px; }
  .verdict .detail { text-shadow: 0 3px 10px rgba(0,0,0,.9); }
  .verdict .sub { display: none; }
  .verdict .mark { background: rgba(16,20,26,.72); }
  .verdict.ok .mark { background: rgba(16,40,26,.72); border-color: #4ade80; }
</style>
</head>
<body>
<div id="fit"><div class="stage">

  <div class="topbar">
    <a class="back" href="index.html" title="목록으로">←</a>
    <div class="tile sm"><svg viewBox="0 0 24 24">
      <rect x="4" y="16" width="16" height="4" rx="1"/>
      <rect x="6.5" y="11" width="11" height="4" rx="1"/>
      <rect x="9" y="6" width="6" height="4" rx="1"/></svg></div>
    <div class="titles">
      <h1>돌탑 쌓기</h1>
      <p>Stack</p>
    </div>
  </div>

  <div class="body">
    <div class="play">
      <div class="board">
        <div class="towerslot"><canvas id="cv" width="620" height="330"></canvas></div>
        <div class="status" id="status"></div>
        <div class="slot" id="slot"></div>
        <div class="controls">
          <button class="btn" id="go">시 작</button>
          <div class="hint">스페이스바로 내려놓기</div>
        </div>
      </div>
    </div>

    <aside class="rules card">
      <h2>규칙</h2>
      <ul>
        <li>움직이는 돌을 눌러 쌓으세요</li>
        <li>어긋난 만큼 돌이 깎입니다</li>
        <li>완전히 빗나가면 즉시 실패</li>
        <li>기회는 한 번뿐입니다</li>
        <li><b>성공 기준 14층</b></li>
      </ul>
    </aside>
  </div>

</div></div>

<script>
"use strict";

const R = RULES.stack;
const cv     = document.getElementById("cv");
const ctx    = cv.getContext("2d");
const status = document.getElementById("status");
const slot   = document.getElementById("slot");
const go     = document.getElementById("go");

const W = cv.width, H = cv.height;
// 층 높이는 캔버스 안에 15층이 다 들어가도록 잡는다.
// 돌 그림이 들어가면서 13px 로는 돌처럼 안 보여 20px 로 키웠다.
const BH = 20;                   // 한 층 높이
const BASE_Y = H - 24;           // 바닥
const VIEW_ROWS = 15;            // 화면에 보이는 층 수 (넘으면 아래로 내려간다)

// 돌 그림. 폭이 깎여도 같은 그림을 가로로 줄여 쓴다.
const stoneImg = new Image();
let stoneReady = false;
stoneImg.onload = () => { stoneReady = true; draw(); };
stoneImg.src = "assets/stack/stone.webp";

let state = "ready";             // ready | running | done
let tower = [];                  // 쌓인 층들 { x, w }
let cur = null;                  // 지금 움직이는 막대
let raf = 0;
let camera = 0;                  // 탑이 높아지면 화면을 내린다

function reset() {
  cancelAnimationFrame(raf);
  state = "ready";
  camera = 0;
  tower = [{ x: (W - R.barW) / 2, w: R.barW }];   // 맨 아래 한 층은 주어진다
  cur = null;
  slot.innerHTML = "";
  status.innerHTML = "<b>" + R.layers + "</b>층까지 쌓으면 성공";
  go.textContent = "시 작";
  draw();
}

function start() {
  state = "running";
  camera = 0;
  tower = [{ x: (W - R.barW) / 2, w: R.barW }];
  spawn();
  slot.innerHTML = "";
  go.textContent = "내려놓기";
  lastFrame = 0;
  raf = requestAnimationFrame(loop);
}

// 속도는 "초당 몇 px" 로 잡는다. 프레임 수로 세면 144Hz 모니터에서
// 2.4배 빨라져서 사람마다 난이도가 달라진다.
const SPEED_BASE = 130;          // 첫 층 속도 (px/초)
const SPEED_STEP = 13;           // 한 층 오를 때마다 더해지는 속도

// 새 막대를 만든다. 위로 갈수록 조금씩 빨라진다.
function spawn() {
  const top = tower[tower.length - 1];
  cur = {
    x: Math.random() < 0.5 ? 0 : W - top.w,
    w: top.w,
    dir: 0,
    speed: SPEED_BASE + tower.length * SPEED_STEP,
  };
  cur.dir = cur.x === 0 ? 1 : -1;
}

let lastFrame = 0;

function loop(now) {
  if (state !== "running" || !cur) return;
  // 실제로 흐른 시간만큼 움직인다. 탭을 잠깐 벗어났다 와도 튀지 않게 상한을 둔다.
  const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
  lastFrame = now;

  cur.x += cur.dir * cur.speed * dt;
  if (cur.x <= 0)          { cur.x = 0;         cur.dir = 1; }
  if (cur.x + cur.w >= W)  { cur.x = W - cur.w; cur.dir = -1; }
  draw();
  raf = requestAnimationFrame(loop);
}

function drop() {
  if (state !== "running" || !cur) return;
  const top = tower[tower.length - 1];

  // 아래 층과 겹치는 부분만 남는다
  const left  = Math.max(cur.x, top.x);
  const right = Math.min(cur.x + cur.w, top.x + top.w);
  const overlap = right - left;

  if (overlap <= 0) { finish(false, "빗나감"); return; }

  tower.push({ x: left, w: overlap });
  Sound.crackle(1 + (1 - overlap / top.w) * 2);

  // 화면 밖으로 나가지 않게 시야를 올린다
  if (tower.length > VIEW_ROWS) camera = (tower.length - VIEW_ROWS) * BH;

  if (tower.length >= R.layers) { finish(true); return; }
  spawn();
  draw();
}

function finish(ok, why) {
  cancelAnimationFrame(raf);
  state = "done";
  cur = null;
  const built = tower.length;
  const topW = tower[tower.length - 1].w;

  status.innerHTML = "<b>" + built + "</b>층 &nbsp;·&nbsp; 남은 폭 <b>"
                   + topW.toFixed(1) + "</b>px";
  slot.innerHTML = verdictHtml(ok,
    ok ? built + "층 완성" : (why || "실패") + " " + built + "층",
    "");
  go.textContent = "다 시";
  if (ok) Sound.success(); else Sound.fail();
  draw();
}

// 돌 한 장을 그 층의 폭에 맞춰 늘려 그린다.
// 깎여 좁아진 돌도 같은 그림을 쓰므로 탑이 한 덩어리로 보인다.
function drawStone(x, y, w, dim) {
  if (!stoneReady) {                       // 그림이 아직이면 실루엣이라도
    ctx.fillStyle = "#a8a094";
    roundRect(x, y, w, BH - 2, 4); ctx.fill();
    return;
  }
  ctx.save();
  if (dim) ctx.globalAlpha = 0.92;
  ctx.drawImage(stoneImg, x, y, w, BH);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 목표 높이 선
  const goalY = BASE_Y - R.layers * BH + camera;

  // 돌빛이 흙길 색과 비슷해 묻힌다. 뒤에 옅은 판을 깔아 띄운다.
  // 돌이 오가는 가로 전체 × 바닥에서 목표선 살짝 위까지만 덮는다.
  const panelTop = goalY - 16;
  ctx.fillStyle = "rgba(28, 32, 26, .30)";
  roundRect(0, panelTop, W, BASE_Y + 10 - panelTop, 16);
  ctx.fill();
  if (goalY > 6) {
    ctx.strokeStyle = "rgba(255,255,255,.42)";
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, goalY); ctx.lineTo(W, goalY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "700 13px 'Malgun Gothic', sans-serif";
    ctx.fillText(R.layers + "층", 8, goalY - 6);
  }

  // 쌓인 돌
  for (let i = 0; i < tower.length; i++) {
    const b = tower[i];
    const y = BASE_Y - (i + 1) * BH + camera;
    if (y < -BH || y > H) continue;
    drawStone(b.x, y, b.w, true);
  }

  // 지금 움직이는 돌
  if (cur) {
    const y = BASE_Y - (tower.length + 1) * BH + camera;
    drawStone(cur.x, y, cur.w, false);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function press() {
  if (state === "ready") start();
  else if (state === "running") drop();
  else reset();
}

go.addEventListener("click", press);
onPressKey(press);
reset();
</script>
</body>
</html>
