<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ec4899' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ec4899'/%3E%3C/svg%3E">
<title>밤가네 미니게임</title>
<link rel="stylesheet" href="common.css?v=73">
<style>
  .hub { position: absolute; inset: 0; display: flex;
         flex-direction: column; align-items: center; padding-top: 26px;
         --accent-1: #6366f1; --accent-2: #4f46e5; }
  .hub h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .hub .lead { margin-top: 7px; font-size: 13px; color: var(--text-faint); }

  /* 모드 고르는 자리. 두 칸짜리 토글이라 지금 어느 쪽인지가 한눈에 보인다. */
  .modes { margin-top: 13px; display: flex; gap: 6px; padding: 4px;
           background: rgba(255,255,255,.045); border: 1px solid var(--line);
           border-radius: 13px; }
  .modes button {
    padding: 7px 24px 8px; font: inherit; font-size: 13.5px; font-weight: 700;
    color: var(--text-dim); background: none; border: 0; border-radius: 10px;
    cursor: pointer; letter-spacing: .2px;
    transition: background .16s, color .16s;
  }
  .modes button:hover { color: #fff; }
  .modes button.on {
    color: #fff; background: linear-gradient(145deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 6px 14px -6px rgba(0,0,0,.8);
  }
  .modes button.on:hover { color: #fff; }

  /* 랜덤이 도는 동안 나오는 한 줄. 자리를 늘 차지해서 화면이 덜컥이지 않게 한다. */
  .note { margin-top: 9px; height: 17px; font-size: 12.5px; color: var(--text-faint);
          letter-spacing: .2px; }
  .note b { color: #fff; }

  /* 4열 4줄. 게임이 늘면 카드를 낮춰서 무대 안에 그대로 담는다. */
  .grid { margin-top: 11px; display: grid;
          grid-template-columns: repeat(3, 236px); gap: 11px; }

  /* 랜덤이 도는 동안은 카드를 눌러도 들어가지 않는다 */
  .grid.spinning .game { pointer-events: none; }

  /* 룰렛이 지금 짚고 있는 카드 */
  .game.spot { transform: translateY(-3px);
               border-color: rgba(255,255,255,.85);
               box-shadow: 0 0 0 2px rgba(255,255,255,.35),
                           0 16px 30px -14px rgba(0,0,0,.9); }
  /* 걸린 카드 */
  .game.won { animation: won-pop .55s ease-out; border-color: #fff; }
  @keyframes won-pop {
    0%   { transform: translateY(-3px) scale(1); }
    35%  { transform: translateY(-6px) scale(1.05); }
    100% { transform: translateY(-3px) scale(1); }
  }

  .game {
    display: flex; flex-direction: column; align-items: center;
    padding: 13px 16px 11px; text-decoration: none; color: inherit;
    transition: transform .18s, border-color .18s;
  }
  .game:hover { transform: translateY(-3px);
                border-color: color-mix(in srgb, var(--accent-1) 55%, var(--line)); }
  .game .tile { width: 46px; height: 46px; border-radius: 12px; }
  .game .tile svg { width: 25px; height: 25px; }

  /* 2D 그림 타일. 그림이 타일을 꽉 채우므로 밑에 깔린 색 그라데이션은 가려진다.
     선 그림 타일보다 크게 잡는다 — 그림은 여백까지 그려져 있어서
     같은 크기로 두면 알맹이가 오히려 작아 보인다. */
  .game .tile.pic { width: 64px; height: 64px; border-radius: 15px;
                    background: none; overflow: hidden; }
  .game .tile.pic img { width: 100%; height: 100%; display: block; }
  .game .name { margin-top: 9px; font-size: 15px; font-weight: 700; }
  .game .go   { margin-top: 5px; font-size: 11.5px; color: var(--text-dim); }

  /* 아직 만들지 않은 게임. 자리만 잡아 두고 눌러도 넘어가지 않는다. */
  .game.soon { opacity: .38; cursor: default; }
  .game.soon:hover { transform: none; border-color: var(--line); }
  .game.soon .tile { filter: grayscale(.7); box-shadow: none; }
  .game.soon .go { color: var(--text-faint); }
</style>
</head>
<body>
<div id="fit"><div class="stage">
  <div class="hub">
    <h1>밤가네 미니게임</h1>
    <p class="lead">하나를 골라 도전하세요</p>
    <div class="modes">
      <button id="mNormal" class="on">일반모드</button>
      <button id="mRandom">랜덤모드</button>
    </div>
    <div class="note" id="note"></div>
    <div class="grid" id="grid"></div>
  </div>
</div></div>

<script src="common.js?v=73"></script>
<script src="sound.js?v=73"></script>
<script>
"use strict";

// 게임 목록. 여기에 한 줄 추가하면 허브에 바로 나온다.
//
// img 가 있으면 그 그림을 타일에 꽉 채워 넣고, 없으면 icon 의 선 그림을 쓴다.
// 2D 로 바꾼 게임부터 하나씩 그림을 붙여 나간다.
const GAMES = [
  { file: "ricecut.html",   name: "떡 자르기",       c1: "#ec4899", c2: "#e11d48", icon: "knife",
    img: "assets/_icons/ricecut.webp" },
  { file: "curling.html",   name: "조약돌 밀기",     c1: "#f59e0b", c2: "#ea580c", icon: "target",
    img: "assets/_icons/curling.webp" },
  { file: "stack.html",     name: "돌탑 쌓기",       c1: "#0ea5e9", c2: "#4f46e5", icon: "stack",
    img: "assets/_icons/stack.webp" },
];

// 아이콘은 선으로만 그린다. 배경 타일 색이 게임을 구분해 준다.
const ICONS = {
  knife: '<rect x="3" y="9" width="18" height="6" rx="3"/><path d="M12 3v18"/>',
  grid:  '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M15 4v16M4 9h16M4 15h16"/>',
  wire:  '<path d="M3 12c3-7 6 7 9 0s6 7 9 0"/>',
  watch: '<circle cx="12" cy="13" r="7"/><path d="M9 3h6M12 3v3M12 13l3-2.5"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2"/>',
  stack: '<rect x="4" y="16" width="16" height="4" rx="1"/><rect x="6.5" y="11" width="11" height="4" rx="1"/><rect x="9" y="6" width="6" height="4" rx="1"/>',
  bolt:  '<path d="M13 3 6 13h5l-1 8 7-10h-5z"/>',
  rings: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/>',
  drop:  '<path d="M12 20a7 7 0 0 0 7-7c0-5-7-10-7-10S5 8 5 13a7 7 0 0 0 7 7z"/>',
  odd:   '<rect x="3" y="3" width="7" height="7" rx="1.5"/>'
       + '<rect x="14" y="3" width="7" height="7" rx="1.5"/>'
       + '<rect x="3" y="14" width="7" height="7" rx="1.5"/>'
       + '<circle cx="17.5" cy="17.5" r="4"/>',
  shear: '<path d="M4 4l10 10M20 4L10 14"/><circle cx="7" cy="18" r="2.6"/>'
       + '<circle cx="17" cy="18" r="2.6"/>',
  dial:  '<circle cx="12" cy="12" r="8"/><path d="M12 12l4-4M12 4v2"/>',
  // 후보 게임 아이콘
  basket:'<path d="M4 10h16l-1.6 9H5.6z"/><path d="M8 10l2.5-5M16 10l-2.5-5"/>',
  tower: '<rect x="5" y="16" width="14" height="4" rx="2"/>'
       + '<rect x="6.5" y="10.5" width="11" height="4" rx="2"/>'
       + '<rect x="8" y="5" width="8" height="4" rx="2"/>',
  beat:  '<path d="M4 18l9-9"/><path d="M12 10l4-4a2.5 2.5 0 0 1 3.5 3.5l-4 4z"/>'
       + '<path d="M4 18l-1 3 3-1"/>',
  doors: '<rect x="2.5" y="5" width="5" height="14" rx="1"/>'
       + '<rect x="9.5" y="5" width="5" height="14" rx="1"/>'
       + '<rect x="16.5" y="5" width="5" height="14" rx="1"/>'
       + '<path d="M6 12h.01M13 12h.01M20 12h.01"/>',
};

const grid = document.getElementById("grid");
for (const g of GAMES) {
  // 아직 안 만든 게임은 링크로 두지 않는다. 눌러도 아무 일이 없어야 한다.
  const a = document.createElement(g.soon ? "div" : "a");
  if (!g.soon) a.href = g.file;
  a.className = "game card tinted" + (g.soon ? " soon" : "");
  a.style.setProperty("--accent-1", g.c1);
  a.style.setProperty("--accent-2", g.c2);
  // 2D 그림이 있으면 타일을 그림으로 채우고, 없으면 예전 선 그림을 쓴다.
  const tile = g.img
    ? '<div class="tile pic"><img src="' + g.img + '" alt=""></div>'
    : '<div class="tile"><svg viewBox="0 0 24 24">' + ICONS[g.icon] + "</svg></div>";
  a.innerHTML = tile
    + '<div class="name">' + g.name + "</div>"
    + '<div class="go">' + (g.soon ? "준비 중" : "플레이 &nbsp;→") + "</div>";
  grid.appendChild(a);
}

/* ── 모드 ────────────────────────────────────────────────
   일반모드 — 목록에서 골라서 들어간다. 처음에는 늘 이쪽이다.
   랜덤모드 — 카드에 불이 차례로 돌다가 하나에 멈추고 그 게임으로 들어간다.

   바로 넘겨 버리지 않고 굳이 돌리는 이유는 방송용이기 때문이다.
   도는 몇 초가 "뭐 걸려라" 하는 시간이 되고 채팅이 반응할 틈이 된다.
   즉시 이동하면 시청자에게는 그냥 게임이 시작된 것과 구별되지 않는다. */

const mNormal = document.getElementById("mNormal");
const mRandom = document.getElementById("mRandom");
const note    = document.getElementById("note");

// 준비 중인 게임은 뽑히면 안 된다
const playable = [...grid.children].filter((el) => !el.classList.contains("soon"));

let spinTimer = 0;

function clearMarks() {
  for (const el of playable) el.classList.remove("spot", "won");
}

function toNormal() {
  clearTimeout(spinTimer); spinTimer = 0;
  clearMarks();
  grid.classList.remove("spinning");
  mNormal.classList.add("on");
  mRandom.classList.remove("on");
  note.textContent = "";
}

function toRandom() {
  // 이미 랜덤모드가 켜져 있어도 누르면 다시 돌아야 한다.
  // 게임에 들어갔다 뒤로가기로 돌아오면 랜덤모드가 켜진 채로 남는데,
  // 그때 이 버튼이 먹지 않으면 일반모드를 눌렀다 다시 눌러야 한다.
  // 진짜로 도는 중일 때만 막는다.
  if (grid.classList.contains("spinning")) return;
  mRandom.classList.add("on");
  mNormal.classList.remove("on");
  spin();
}

function spin() {
  const n = playable.length;
  if (n === 0) return;
  if (n === 1) { land(0); return; }      // 하나뿐이면 돌릴 것이 없다

  clearTimeout(spinTimer);               // 남아 있던 예약이 있으면 먼저 치운다
  grid.classList.add("spinning");
  clearMarks();

  // 걸릴 카드를 먼저 정하고, 거기서 멈추도록 걸음 수를 맞춘다.
  // 돌다가 멈춘 자리를 결과로 삼으면 게임 수에 따라 확률이 치우친다.
  // 걸릴 카드를 먼저 정한다. 그리고 **출발점**을 옮겨서 거기 멈추게 한다.
  //
  // 걸음 수를 늘려 맞추는 방법도 있지만 그러면 안 된다. 뒤로 갈수록 한 걸음이
  // 느려지는 구조라, 게임이 12개일 때 걸음 수가 22~33 으로 벌어지면
  // 도는 시간이 3.2초에서 6.4초까지 널뛴다. 출발점만 바꾸면 늘 같은 시간이다.
  //
  // 걸음 21, 50ms 로 시작해 한 걸음마다 7% 씩 느려진다
  //   → 50·(1.07^22−1)/0.07 ≈ 2.4초. 여기에 걸린 카드 보여주는 0.8초가 붙는다.
  // 더 끌면 방송에서 늘어지고, 더 짧으면 뭐가 도는지 보이지도 않는다.
  const winner = Math.floor(Math.random() * n);
  const steps = 21;
  const start = ((winner - steps) % n + n) % n;

  let i = 0;
  let wait = 50;                         // 처음엔 빠르게

  (function step() {
    const 지금 = (start + i) % n;
    playable[(start + i - 1 + n) % n].classList.remove("spot");
    playable[지금].classList.add("spot");
    Sound.crackle(0.8);
    note.textContent = "고르는 중…";

    if (i >= steps) { land(지금); return; }
    i++;
    wait *= 1.07;                        // 점점 느려진다
    spinTimer = setTimeout(step, wait);
  })();
}

function land(k) {
  spinTimer = 0;
  clearMarks();
  const el = playable[k];
  el.classList.add("spot", "won");
  const 이름 = el.querySelector(".name").textContent;
  note.innerHTML = "<b>" + 이름 + "</b> 걸렸습니다";
  Sound.success();

  // 걸린 카드를 잠깐 보여준 뒤에 넘어간다. 바로 넘기면 뭐가 걸렸는지 안 보인다.
  spinTimer = setTimeout(() => { location.href = el.getAttribute("href"); }, 800);
}

mNormal.addEventListener("click", toNormal);
mRandom.addEventListener("click", toRandom);

/* 게임에 들어갔다가 브라우저 뒤로가기로 돌아오면, 브라우저는 이 화면을
   떠날 때 모습 그대로 되살린다(bfcache). 룰렛이 돌던 상태에서 넘어갔으므로
   돌아오면 "도는 중" 인 채로 얼어 있고, 죽은 예약도 남아 있다.
   그대로 두면 랜덤모드 버튼이 먹지 않는다. 돌아올 때마다 풀어 준다.

   모드 토글은 건드리지 않는다. 랜덤모드로 갔다 왔으면 랜덤모드인 것이 맞고,
   그 상태에서 버튼을 누르면 바로 다시 돌아간다. */
addEventListener("pageshow", () => {
  clearTimeout(spinTimer); spinTimer = 0;
  clearMarks();
  grid.classList.remove("spinning");
  note.textContent = "";
});
</script>
</body>
</html>
