<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 게임 화면들은 이 줄을 갖고 있는데 목록만 빠져 있었다.
     그래서 게임은 새 파일로 도는데 목록은 옛것을 붙잡고 있어,
     화면 구석 버전 표시가 실제와 어긋나 보였다. -->
<meta http-equiv="cache-control" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ec4899' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ec4899'/%3E%3C/svg%3E">
<title>밤가네 미니게임</title>
<link rel="stylesheet" href="common.css?v=210">
<style>
  /* 무대는 잘라 내기만 하고 스크롤이 없다. 목록은 게임이 늘수록 길어지므로
     이 칸만 굴러가게 해 둔다. 아래쪽에 여백을 둬야 마지막 줄이 바닥에 붙지 않는다. */
  .hub { position: absolute; inset: 0; display: flex;
         flex-direction: column; align-items: center;
         padding: 26px 0 28px; overflow-y: auto; overscroll-behavior: contain;
         --accent-1: #6366f1; --accent-2: #4f46e5; }
  /* 굴림대는 얇게. 방송 화면에 굵은 막대가 지나가면 눈에 거슬린다. */
  .hub::-webkit-scrollbar { width: 9px; }
  .hub::-webkit-scrollbar-track { background: transparent; }
  .hub::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16);
                                  border-radius: 5px; border: 2px solid transparent;
                                  background-clip: content-box; }
  .hub::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.3);
                                        background-clip: content-box; }
  .hub h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .hub .lead { margin-top: 7px; font-size: 13px; color: var(--text-faint); }

  /* 모드 고르는 가로줄.

     소리 조절을 이 줄 오른쪽 끝에 붙인다. 같은 줄에 넣되 **띄워서** 놓는 것은
     모드 토글이 화면 정가운데를 지켜야 하기 때문이다. 같은 흐름에 나란히 두면
     소리 조절 너비의 절반만큼 토글이 왼쪽으로 밀린다.

     오른쪽 끝은 **목록의 오른쪽 끝선**에 맞춘다. 무대 가장자리에 붙이면 목록보다
     한참 밖으로 나가 혼자 떠 보인다. 줄 너비를 목록 너비로 맞춰 두고 오른쪽에
     붙이는 방식인데, 그 너비는 아래 스크립트가 목록을 재서 넣는다 —
     여기에 977px 이라고 박아 두면 열 수가 바뀔 때 어긋난다.

     z-index 를 주는 것은 꼭 필요하다. transform 이 붙은 상자는 그 자체로
     쌓임 맥락을 만들어서, 안에 있는 판의 z-index 가 밖으로 통하지 않는다.
     그대로 두면 판이 뒤에 오는 타일에 가린다. */
  .moderow { position: relative; margin-top: 13px;
             display: flex; justify-content: center; }
  .moderow .sndbox { position: absolute; right: 0; top: 50%; z-index: 50;
                     transform: translateY(-50%); margin-left: 0; }

  /* 두 칸짜리 토글이라 지금 어느 쪽인지가 한눈에 보인다. */
  .modes { display: flex; gap: 6px; padding: 4px;
           background: rgba(255,255,255,.045); border: 1px solid var(--line);
           border-radius: 13px; }
  .modes button {
    padding: 7px 24px 8px; font: inherit; font-size: 13.5px; font-weight: 700;
    color: var(--text-dim); background: none; border: 0; border-radius: 10px;
    cursor: pointer; letter-spacing: .2px;
    transition: background .16s, color .16s;
  }
  .modes button:hover { color: #fff; }
  .modes button.on {
    color: #fff; background: linear-gradient(145deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 6px 14px -6px rgba(0,0,0,.8);
  }
  .modes button.on:hover { color: #fff; }

  /* 랜덤이 도는 동안 나오는 한 줄. 자리를 늘 차지해서 화면이 덜컥이지 않게 한다. */
  .note { margin-top: 9px; height: 17px; font-size: 12.5px; color: var(--text-faint);
          letter-spacing: .2px; }
  .note b { color: #fff; }

  /* 4열. 게임이 늘어 무대(720px) 를 넘기면 목록을 휠로 굴려 본다.
     열을 늘리거나 카드를 줄이면 게임이 더 늘 때마다 또 손봐야 한다.
     굴리게 두면 몇 개가 되든 그대로 쓴다. */
  .grid { margin-top: 11px; display: grid;
          grid-template-columns: repeat(4, 236px); gap: 11px; }

  /* 랜덤이 도는 동안은 카드를 눌러도 들어가지 않는다 */
  .grid.spinning .game { pointer-events: none; }

  /* 룰렛이 지금 짚고 있는 카드 */
  .game.spot { transform: translateY(-3px);
               border-color: rgba(255,255,255,.85);
               box-shadow: 0 0 0 2px rgba(255,255,255,.35),
                           0 16px 30px -14px rgba(0,0,0,.9); }
  /* 걸린 카드 */
  .game.won { animation: won-pop .55s ease-out; border-color: #fff; }
  @keyframes won-pop {
    0%   { transform: translateY(-3px) scale(1); }
    35%  { transform: translateY(-6px) scale(1.05); }
    100% { transform: translateY(-3px) scale(1); }
  }

  .game {
    display: flex; flex-direction: column; align-items: center;
    padding: 13px 16px 11px; text-decoration: none; color: inherit;
    transition: transform .18s, border-color .18s;
  }
  .game:hover { transform: translateY(-3px);
                border-color: color-mix(in srgb, var(--accent-1) 55%, var(--line)); }
  .game .tile { width: 46px; height: 46px; border-radius: 12px; }
  .game .tile svg { width: 25px; height: 25px; }

  /* .tile.pic 은 common.css 에 있다. 게임 상단 바도 같은 그림을 쓰기 때문이다. */
  .game .name { margin-top: 9px; font-size: 15px; font-weight: 700; }
  .game .go   { margin-top: 5px; font-size: 11.5px; color: var(--text-dim); }

  /* 아직 만들지 않은 게임. 자리만 잡아 두고 눌러도 넘어가지 않는다. */
  .game.soon { opacity: .38; cursor: default; }
  .game.soon:hover { transform: none; border-color: var(--line); }
  .game.soon .tile { filter: grayscale(.7); box-shadow: none; }
  .game.soon .go { color: var(--text-faint); }

  /* 이미 깬 게임. 랜덤모드일 때만 이렇게 보인다 —
     일반모드에서는 다시 하고 싶으면 그냥 누르면 된다. */
  .grid.rand .game.cleared { opacity: .3; pointer-events: none; }
  .grid.rand .game.cleared .tile { filter: grayscale(.85); box-shadow: none; }
  .grid.rand .game.cleared .go { color: var(--text-faint); }
  /* 깼다는 표시. 흐린 카드 위에서도 보이도록 초록으로 둔다. */
  .grid.rand .game.cleared .go::after { content: " ✓"; color: #4ade80; }

  /* 깬 기록을 지우는 버튼. 깬 것이 하나도 없으면 아예 안 보인다 —
     늘 떠 있으면 누를 일 없는 버튼이 화면만 차지한다. */
  .reset {
    margin-top: 9px; padding: 5px 13px 6px;
    font: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .2px;
    color: var(--text-dim); background: rgba(255,255,255,.05);
    border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
    transition: background .16s, color .16s, border-color .16s;
  }
  .reset:hover { color: #fff; background: rgba(255,255,255,.1);
                 border-color: rgba(255,255,255,.3); }
  .reset[hidden] { display: none; }

  /* ── 과자 왕국 테마 (홈화면) ─────────────────────────────────
     시안 A(과자 왕국 광장)로 정했다 — assets/_style/sweets-v1/hub/mock-A.png.
     사용자 조정 (2026-10-09): 안내 문구는 그대로, 플레이 표시와 카드 테두리는 게임마다 다른 색을 빼고
     **분홍 하나로 통일**. 그래서 카드에 게임별 색(--accent-1/2)을 물들이던 tinted 층을 끈다.
     배경 그림: assets/_hub/hub-bg.webp (왕관 축제 광장). 화면 장식만 바꾼다 — 목록·모드·랜덤 동작은 그대로. */
  .stage { background: url('assets/_hub/hub-bg.webp?v=210') center / cover no-repeat; }
  .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
                   background: linear-gradient(180deg, rgba(255,240,246,.55), rgba(255,240,246,.25) 40%,
                                                       rgba(120,50,80,.25)); }
  .hub { --pink: #f2668f; --pink-soft: #f6b9cd; --plum: #5b2f42; }
  .hub::-webkit-scrollbar-thumb { background: rgba(194,65,111,.35); background-clip: content-box; }
  .hub::-webkit-scrollbar-thumb:hover { background: rgba(194,65,111,.55); background-clip: content-box; }

  /* 제목 — 리본 현수막 */
  .hub h1 { padding: 10px 56px 12px; color: #fff; font-weight: 900;
            background: linear-gradient(#ff8fb3, var(--pink)); border-radius: 14px;
            box-shadow: 0 6px 0 #c84874, 0 14px 24px -10px rgba(120,30,60,.6);
            text-shadow: 0 2px 0 #c84874; }
  .hub .lead { margin-top: 14px; padding: 3px 14px; font-weight: 700; color: #7a3954;
               background: rgba(255,255,255,.82); border-radius: 999px; }

  /* 모드 토글 · 소리 단추 */
  .hub .modes { background: rgba(255,255,255,.88); border: 2px solid var(--pink-soft); border-radius: 999px; }
  .hub .modes button { color: #b45a7d; border-radius: 999px; font-weight: 800; }
  .hub .modes button:hover { color: var(--pink); }
  .hub .modes button.on { color: #fff; background: var(--pink); box-shadow: 0 6px 14px -8px rgba(160,40,80,.7); }
  .hub .modes button.on:hover { color: #fff; }
  .hub .mute { background: rgba(255,255,255,.88); border: 2px solid var(--pink-soft); color: #c2416f; }
  .hub .mute:hover { background: #fff; color: var(--pink); }
  .hub .mute.off { color: #c9a3b2; }

  .hub .note { color: #7a3954; text-shadow: 0 1px 0 rgba(255,255,255,.8); font-weight: 700; }
  .hub .note b { color: #c2416f; }
  .hub .reset { color: #b45a7d; background: rgba(255,255,255,.88); border: 2px solid var(--pink-soft); border-radius: 999px; }
  .hub .reset:hover { color: var(--pink); background: #fff; border-color: var(--pink); }

  /* 게임 카드 — 크림색 쿠키 카드, 테두리는 분홍 하나 */
  .hub .game.card { background: rgba(255,251,247,.95); border: 3px solid var(--pink-soft); border-radius: 22px;
                    color: var(--plum); box-shadow: 0 10px 18px -10px rgba(120,40,70,.55); }
  .hub .game.card.tinted::before { display: none; }
  .hub .game:hover { border-color: var(--pink); }
  .hub .game .tile { width: 58px; height: 58px; }
  .hub .game .tile.pic { border-radius: 15px; }
  .hub .game .name { margin-top: 8px; font-weight: 800; color: var(--plum); }
  /* 플레이 표시 — 분홍 알약 하나로 통일 */
  .hub .game .go { margin-top: 6px; padding: 2px 13px 3px; border-radius: 999px;
                   font-weight: 700; color: #fff; background: var(--pink); }
  .hub .game.soon .go { background: #cdb7c0; color: #fff; }
  .hub .game.soon:hover { border-color: var(--pink-soft); }
  .hub .grid.rand .game.cleared .go { background: #cdb7c0; color: #fff; }
  .hub .grid.rand .game.cleared .go::after { color: #fff; }

  /* 랜덤 룰렛 — 짚고 있는 카드는 분홍 빛, 걸린 카드는 진한 분홍 테두리 */
  .hub .game.spot { border-color: #fff;
                    box-shadow: 0 0 0 4px var(--pink), 0 0 22px rgba(242,102,143,.85); }
  .hub .game.won { border-color: var(--pink); }

  #ver { color: #7a3954; opacity: .6; }
</style>
</head>
<body>
<div id="fit"><div class="stage">
  <div class="hub">
    <h1>밤가네 미니게임</h1>
    <p class="lead">하나를 골라 도전하세요</p>
    <div class="moderow sndmount">
      <div class="modes">
        <button id="mNormal" class="on">일반모드</button>
        <button id="mRandom">랜덤모드</button>
      </div>
    </div>
    <button class="reset" id="reset" hidden>깬 게임 초기화</button>
    <div class="note" id="note"></div>
    <div class="grid" id="grid"></div>
  </div>
</div></div>

<script src="common.js?v=210"></script>
<script src="sound.js?v=210"></script>
<script>
"use strict";

// 게임 목록. 여기에 한 줄 추가하면 허브에 바로 나온다.
//
// img 가 있으면 그 그림을 타일에 꽉 채워 넣고, 없으면 icon 의 선 그림을 쓴다.
// 2D 로 바꾼 게임부터 하나씩 그림을 붙여 나간다.
const GAMES = [
  { file: "ricecut.html",   name: "롤케이크 자르기",       c1: "#ec4899", c2: "#e11d48", icon: "knife",
    img: "assets/_icons/ricecut-sweets.webp?v=210" },
  { file: "curling.html",   name: "마카롱 컬링",     c1: "#f59e0b", c2: "#ea580c", icon: "target",
    img: "assets/_icons/curling-sweets.webp?v=210" },
  { file: "stack.html",     name: "케이크 층 쌓기",       c1: "#0ea5e9", c2: "#4f46e5", icon: "stack",
    img: "assets/_icons/stack-sweets.webp?v=210" },
  { file: "oddone.html",    name: "젤리빈 고르기",       c1: "#14b8a6", c2: "#0d9488", icon: "odd",
    img: "assets/_icons/oddone-sweets.webp?v=210" },
  { file: "fill.html",      name: "사탕 담기",       c1: "#fb7185", c2: "#e11d48", icon: "basket",
    img: "assets/_icons/fill-candy.webp?v=210" },
  { file: "tower.html",     name: "마카롱 탑 해체",    c1: "#34d399", c2: "#059669", icon: "tower",
    img: "assets/_icons/tower-sweets.webp?v=210" },
];

// 아이콘은 선으로만 그린다. 배경 타일 색이 게임을 구분해 준다.
const ICONS = {
  knife: '<rect x="3" y="9" width="18" height="6" rx="3"/><path d="M12 3v18"/>',
  grid:  '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M15 4v16M4 9h16M4 15h16"/>',
  wire:  '<path d="M3 12c3-7 6 7 9 0s6 7 9 0"/>',
  watch: '<circle cx="12" cy="13" r="7"/><path d="M9 3h6M12 3v3M12 13l3-2.5"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2"/>',
  stack: '<rect x="4" y="16" width="16" height="4" rx="1"/><rect x="6.5" y="11" width="11" height="4" rx="1"/><rect x="9" y="6" width="6" height="4" rx="1"/>',
  bolt:  '<path d="M13 3 6 13h5l-1 8 7-10h-5z"/>',
  rings: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/>',
  drop:  '<path d="M12 20a7 7 0 0 0 7-7c0-5-7-10-7-10S5 8 5 13a7 7 0 0 0 7 7z"/>',
  odd:   '<rect x="3" y="3" width="7" height="7" rx="1.5"/>'
       + '<rect x="14" y="3" width="7" height="7" rx="1.5"/>'
       + '<rect x="3" y="14" width="7" height="7" rx="1.5"/>'
       + '<circle cx="17.5" cy="17.5" r="4"/>',
  shear: '<path d="M4 4l10 10M20 4L10 14"/><circle cx="7" cy="18" r="2.6"/>'
       + '<circle cx="17" cy="18" r="2.6"/>',
  dial:  '<circle cx="12" cy="12" r="8"/><path d="M12 12l4-4M12 4v2"/>',
  // 후보 게임 아이콘
  basket:'<path d="M4 10h16l-1.6 9H5.6z"/><path d="M8 10l2.5-5M16 10l-2.5-5"/>',
  tower: '<rect x="5" y="16" width="14" height="4" rx="2"/>'
       + '<rect x="6.5" y="10.5" width="11" height="4" rx="2"/>'
       + '<rect x="8" y="5" width="8" height="4" rx="2"/>',
  beat:  '<path d="M4 18l9-9"/><path d="M12 10l4-4a2.5 2.5 0 0 1 3.5 3.5l-4 4z"/>'
       + '<path d="M4 18l-1 3 3-1"/>',
  doors: '<rect x="2.5" y="5" width="5" height="14" rx="1"/>'
       + '<rect x="9.5" y="5" width="5" height="14" rx="1"/>'
       + '<rect x="16.5" y="5" width="5" height="14" rx="1"/>'
       + '<path d="M6 12h.01M13 12h.01M20 12h.01"/>',
  // 곶감 두름 — 줄에 꿴 곶감을 몇 개인지 센다
  count: '<path d="M4 5h16"/><circle cx="8" cy="10" r="3"/><circle cx="15" cy="10" r="3"/>'
       + '<circle cx="8" cy="17" r="3"/><circle cx="15" cy="17" r="3"/>',
  // 장대와 떨어지는 감
  pole:  '<path d="M4 20L16 6"/><circle cx="18" cy="5" r="2.6"/>'
       + '<circle cx="11" cy="16" r="2.2"/><circle cx="6" cy="12" r="1.8"/>',
  // 베개 — 솜이 든 둥근 네모와 바느질 선
  pillow:'<rect x="3" y="7" width="18" height="10" rx="4"/><path d="M7 7v10M17 7v10"/>',
  // 장독 항아리 — 두드려 소리를 듣는다
  jar:   '<path d="M8 6h8l1.5 3c1.5 2 1.5 8 0 10H6.5c-1.5-2-1.5-8 0-10z"/>'
       + '<path d="M6 6h12"/>',
  // 연과 연줄
  kite:  '<path d="M12 3l6 6-6 6-6-6z"/><path d="M12 15v6"/><path d="M10 21c2-1 2-2 4-3"/>',
};

const grid = document.getElementById("grid");
for (const g of GAMES) {
  // 아직 안 만든 게임은 링크로 두지 않는다. 눌러도 아무 일이 없어야 한다.
  const a = document.createElement(g.soon ? "div" : "a");
  if (!g.soon) a.href = g.file;
  a.className = "game card tinted" + (g.soon ? " soon" : "");
  a.style.setProperty("--accent-1", g.c1);
  a.style.setProperty("--accent-2", g.c2);
  // 2D 그림이 있으면 타일을 그림으로 채우고, 없으면 예전 선 그림을 쓴다.
  const tile = g.img
    ? '<div class="tile pic"><img src="' + g.img + '" alt=""></div>'
    : '<div class="tile"><svg viewBox="0 0 24 24">' + ICONS[g.icon] + "</svg></div>";
  a.innerHTML = tile
    + '<div class="name">' + g.name + "</div>"
    + '<div class="go">' + (g.soon ? "준비 중" : "플레이 &nbsp;→") + "</div>";
  if (g.file) a.dataset.file = g.file;
  grid.appendChild(a);
}

/* 모드 줄의 너비를 목록 너비에 맞춘다. 소리 조절이 그 줄의 오른쪽 끝에 붙으므로
   이렇게 해야 목록의 오른쪽 끝선과 딱 맞는다. 숫자를 박아 두지 않는 것은
   배포 빌드가 게임 수에 따라 열 수를 바꾸기 때문이다 — 그때 같이 따라온다.

   offsetWidth 를 쓰는 것은 무대에 걸린 확대·축소(--fit)를 타지 않는 값이라서다.
   getBoundingClientRect 로 재면 창 크기에 따라 값이 달라진다. */
const 모드줄 = document.querySelector(".moderow");
if (모드줄) 모드줄.style.width = grid.offsetWidth + "px";

/* ── 모드 ────────────────────────────────────────────────
   일반모드 — 목록에서 골라서 들어간다. 처음에는 늘 이쪽이다.
   랜덤모드 — 카드에 불이 차례로 돌다가 하나에 멈추고 그 게임으로 들어간다.

   바로 넘겨 버리지 않고 굳이 돌리는 이유는 방송용이기 때문이다.
   도는 몇 초가 "뭐 걸려라" 하는 시간이 되고 채팅이 반응할 틈이 된다.
   즉시 이동하면 시청자에게는 그냥 게임이 시작된 것과 구별되지 않는다. */

const mNormal = document.getElementById("mNormal");
const mRandom = document.getElementById("mRandom");
const note    = document.getElementById("note");

const reset = document.getElementById("reset");

// 준비 중인 게임은 뽑히면 안 된다
const 만든것 = [...grid.children].filter((el) => !el.classList.contains("soon"));

/* 이미 깬 게임은 랜덤 뽑기에서 뺀다.

   기록은 게임 화면에서 성공할 때 브라우저에 적힌다(common.js 의 깬기록).
   여기서는 읽어서 카드에 표시만 하고, 뽑을 때 빼면 된다.

   일반모드에서는 빼지 않는다 — 깬 게임을 다시 해보고 싶을 수 있고,
   그걸 막을 이유가 없다. 랜덤모드에서만 흐려지고 안 걸린다. */
let playable = 만든것;

function 깬것표시() {
  const 깸 = 깬기록.목록();
  let 수 = 0;
  for (const el of 만든것) {
    const 깼다 = 깸.indexOf(el.dataset.file) >= 0;
    el.classList.toggle("cleared", 깼다);
    if (깼다) 수++;
  }
  playable = 만든것.filter((el) => !el.classList.contains("cleared"));
  reset.hidden = 수 === 0;
  reset.textContent = "깬 게임 초기화 (" + 수 + ")";
  return 수;
}
깬것표시();

let spinTimer = 0;

function clearMarks() {
  for (const el of 만든것) el.classList.remove("spot", "won");
}

function toNormal() {
  clearTimeout(spinTimer); spinTimer = 0;
  clearMarks();
  grid.classList.remove("spinning", "rand");
  mNormal.classList.add("on");
  mRandom.classList.remove("on");
  note.textContent = "";
}

function toRandom() {
  // 이미 랜덤모드가 켜져 있어도 누르면 다시 돌아야 한다.
  // 게임에 들어갔다 뒤로가기로 돌아오면 랜덤모드가 켜진 채로 남는데,
  // 그때 이 버튼이 먹지 않으면 일반모드를 눌렀다 다시 눌러야 한다.
  // 진짜로 도는 중일 때만 막는다.
  if (grid.classList.contains("spinning")) return;
  mRandom.classList.add("on");
  mNormal.classList.remove("on");
  grid.classList.add("rand");
  깬것표시();
  spin();
}

function spin() {
  const n = playable.length;
  if (n === 0) {
    // 다 깼다. 그냥 아무 일도 안 일어나면 버튼이 고장 난 줄 안다.
    note.innerHTML = "<b>다 깼습니다</b> &nbsp;·&nbsp; 초기화하고 다시 하세요";
    return;
  }
  if (n === 1) { land(0); return; }      // 하나뿐이면 돌릴 것이 없다

  clearTimeout(spinTimer);               // 남아 있던 예약이 있으면 먼저 치운다
  grid.classList.add("spinning");
  clearMarks();

  // 걸릴 카드를 먼저 정하고, 거기서 멈추도록 걸음 수를 맞춘다.
  // 돌다가 멈춘 자리를 결과로 삼으면 게임 수에 따라 확률이 치우친다.
  // 걸릴 카드를 먼저 정한다. 그리고 **출발점**을 옮겨서 거기 멈추게 한다.
  //
  // 걸음 수를 늘려 맞추는 방법도 있지만 그러면 안 된다. 뒤로 갈수록 한 걸음이
  // 느려지는 구조라, 게임이 12개일 때 걸음 수가 22~33 으로 벌어지면
  // 도는 시간이 3.2초에서 6.4초까지 널뛴다. 출발점만 바꾸면 늘 같은 시간이다.
  //
  // 걸음 21, 50ms 로 시작해 한 걸음마다 7% 씩 느려진다
  //   → 50·(1.07^22−1)/0.07 ≈ 2.4초. 여기에 걸린 카드 보여주는 0.8초가 붙는다.
  // 더 끌면 방송에서 늘어지고, 더 짧으면 뭐가 도는지 보이지도 않는다.
  const winner = Math.floor(Math.random() * n);
  const steps = 21;
  const start = ((winner - steps) % n + n) % n;

  let i = 0;
  let wait = 50;                         // 처음엔 빠르게

  (function step() {
    const 지금 = (start + i) % n;
    playable[(start + i - 1 + n) % n].classList.remove("spot");
    playable[지금].classList.add("spot");
    Sound.crackle(0.8);
    note.textContent = "고르는 중…";

    if (i >= steps) { land(지금); return; }
    i++;
    wait *= 1.07;                        // 점점 느려진다
    spinTimer = setTimeout(step, wait);
  })();
}

function land(k) {
  spinTimer = 0;
  clearMarks();
  const el = playable[k];
  el.classList.add("spot", "won");
  const 이름 = el.querySelector(".name").textContent;
  note.innerHTML = "<b>" + 이름 + "</b> 걸렸습니다";
  Sound.success();

  // 걸린 카드를 잠깐 보여준 뒤에 넘어간다. 바로 넘기면 뭐가 걸렸는지 안 보인다.
  spinTimer = setTimeout(() => { location.href = el.getAttribute("href"); }, 800);
}

mNormal.addEventListener("click", toNormal);
mRandom.addEventListener("click", toRandom);

reset.addEventListener("click", () => {
  clearTimeout(spinTimer); spinTimer = 0;
  clearMarks();
  grid.classList.remove("spinning");
  깬기록.비우기();
  깬것표시();
  note.innerHTML = "<b>초기화</b> 했습니다";
  Sound.tick(1.3);
});

/* 게임에 들어갔다가 브라우저 뒤로가기로 돌아오면, 브라우저는 이 화면을
   떠날 때 모습 그대로 되살린다(bfcache). 룰렛이 돌던 상태에서 넘어갔으므로
   돌아오면 "도는 중" 인 채로 얼어 있고, 죽은 예약도 남아 있다.
   그대로 두면 랜덤모드 버튼이 먹지 않는다. 돌아올 때마다 풀어 준다.

   모드 토글은 건드리지 않는다. 랜덤모드로 갔다 왔으면 랜덤모드인 것이 맞고,
   그 상태에서 버튼을 누르면 바로 다시 돌아간다. */
addEventListener("pageshow", () => {
  clearTimeout(spinTimer); spinTimer = 0;
  clearMarks();
  grid.classList.remove("spinning");
  note.textContent = "";
  // 방금 그 게임을 깨고 돌아온 것일 수 있다. 기록을 다시 읽는다.
  깬것표시();
});
</script>
</body>
</html>
