<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ec4899' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ec4899'/%3E%3C/svg%3E">
<title>밤가네 미니게임</title>
<link rel="stylesheet" href="common.css?v=29">
<style>
  .hub { position: absolute; inset: 0; display: flex;
         flex-direction: column; align-items: center; padding-top: 34px; }
  .hub h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .hub .lead { margin-top: 8px; font-size: 13px; color: var(--text-faint); }

  /* 4열 4줄. 게임이 늘면 카드를 낮춰서 무대 안에 그대로 담는다. */
  .grid { margin-top: 20px; display: grid;
          grid-template-columns: repeat(1, 236px); gap: 13px; }

  .game {
    display: flex; flex-direction: column; align-items: center;
    padding: 13px 16px 11px; text-decoration: none; color: inherit;
    transition: transform .18s, border-color .18s;
  }
  .game:hover { transform: translateY(-3px);
                border-color: color-mix(in srgb, var(--accent-1) 55%, var(--line)); }
  .game .tile { width: 46px; height: 46px; border-radius: 12px; }
  .game .tile svg { width: 25px; height: 25px; }
  .game .name { margin-top: 9px; font-size: 15px; font-weight: 700; }
  .game .go   { margin-top: 5px; font-size: 11.5px; color: var(--text-dim); }

  /* 아직 만들지 않은 게임. 자리만 잡아 두고 눌러도 넘어가지 않는다. */
  .game.soon { opacity: .38; cursor: default; }
  .game.soon:hover { transform: none; border-color: var(--line); }
  .game.soon .tile { filter: grayscale(.7); box-shadow: none; }
  .game.soon .go { color: var(--text-faint); }
</style>
</head>
<body>
<div id="fit"><div class="stage">
  <div class="hub">
    <h1>밤가네 미니게임</h1>
    <p class="lead">하나를 골라 도전하세요</p>
    <div class="grid" id="grid"></div>
  </div>
</div></div>

<script src="common.js?v=29"></script>
<script>
"use strict";

// 게임 목록. 여기에 한 줄 추가하면 허브에 바로 나온다.
const GAMES = [
  { file: "stack.html",     name: "돌탑 쌓기",       c1: "#0ea5e9", c2: "#4f46e5", icon: "stack" },
];

// 아이콘은 선으로만 그린다. 배경 타일 색이 게임을 구분해 준다.
const ICONS = {
  knife: '<rect x="3" y="9" width="18" height="6" rx="3"/><path d="M12 3v18"/>',
  grid:  '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M15 4v16M4 9h16M4 15h16"/>',
  wire:  '<path d="M3 12c3-7 6 7 9 0s6 7 9 0"/>',
  watch: '<circle cx="12" cy="13" r="7"/><path d="M9 3h6M12 3v3M12 13l3-2.5"/>',
  target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2"/>',
  stack: '<rect x="4" y="16" width="16" height="4" rx="1"/><rect x="6.5" y="11" width="11" height="4" rx="1"/><rect x="9" y="6" width="6" height="4" rx="1"/>',
  bolt:  '<path d="M13 3 6 13h5l-1 8 7-10h-5z"/>',
  rings: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/>',
  drop:  '<path d="M12 20a7 7 0 0 0 7-7c0-5-7-10-7-10S5 8 5 13a7 7 0 0 0 7 7z"/>',
  odd:   '<rect x="3" y="3" width="7" height="7" rx="1.5"/>'
       + '<rect x="14" y="3" width="7" height="7" rx="1.5"/>'
       + '<rect x="3" y="14" width="7" height="7" rx="1.5"/>'
       + '<circle cx="17.5" cy="17.5" r="4"/>',
  shear: '<path d="M4 4l10 10M20 4L10 14"/><circle cx="7" cy="18" r="2.6"/>'
       + '<circle cx="17" cy="18" r="2.6"/>',
  dial:  '<circle cx="12" cy="12" r="8"/><path d="M12 12l4-4M12 4v2"/>',
  // 후보 게임 아이콘
  basket:'<path d="M4 10h16l-1.6 9H5.6z"/><path d="M8 10l2.5-5M16 10l-2.5-5"/>',
  tower: '<rect x="5" y="16" width="14" height="4" rx="2"/>'
       + '<rect x="6.5" y="10.5" width="11" height="4" rx="2"/>'
       + '<rect x="8" y="5" width="8" height="4" rx="2"/>',
  beat:  '<path d="M4 18l9-9"/><path d="M12 10l4-4a2.5 2.5 0 0 1 3.5 3.5l-4 4z"/>'
       + '<path d="M4 18l-1 3 3-1"/>',
  doors: '<rect x="2.5" y="5" width="5" height="14" rx="1"/>'
       + '<rect x="9.5" y="5" width="5" height="14" rx="1"/>'
       + '<rect x="16.5" y="5" width="5" height="14" rx="1"/>'
       + '<path d="M6 12h.01M13 12h.01M20 12h.01"/>',
};

const grid = document.getElementById("grid");
for (const g of GAMES) {
  // 아직 안 만든 게임은 링크로 두지 않는다. 눌러도 아무 일이 없어야 한다.
  const a = document.createElement(g.soon ? "div" : "a");
  if (!g.soon) a.href = g.file;
  a.className = "game card tinted" + (g.soon ? " soon" : "");
  a.style.setProperty("--accent-1", g.c1);
  a.style.setProperty("--accent-2", g.c2);
  a.innerHTML =
      '<div class="tile"><svg viewBox="0 0 24 24">' + ICONS[g.icon] + "</svg></div>"
    + '<div class="name">' + g.name + "</div>"
    + '<div class="go">' + (g.soon ? "준비 중" : "플레이 &nbsp;→") + "</div>";
  grid.appendChild(a);
}
</script>
</body>
</html>
