<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1a2e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23ec4899' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ec4899'/%3E%3C/svg%3E">
<title>떡 자르기</title>
<link rel="stylesheet" href="common.css?v=180">
<script src="common.js?v=180"></script>
<script src="sound.js?v=180"></script>
<style>
  :root { --accent-1: #ec4899; --accent-2: #e11d48; }

  /* 부엌 배경. 가운데 띠는 비어 있어서 떡과 글자가 잘 보인다. */
  .stage { background: url('assets/ricecut/bg.webp?v=180') center / cover no-repeat; }
  .topbar { background: rgba(22, 22, 40, .42); }
  /* 배경 위에서도 글자가 읽히게 위아래를 살짝 눌러 준다 */
  .stage::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(20,18,30,.22) 0%, rgba(20,18,30,.03) 26%,
                                        rgba(20,18,30,.24) 62%, rgba(20,18,30,.52) 100%);
  }
  .body { z-index: 1; }

  /* 조작 프레임(432) + 안내(30) + 버튼. 판정은 프레임 위에 겹친다.
     떡은 가로세로 비가 5:1 이라 프레임 세로를 다 못 채운다.
     남는 위아래로는 부엌 배경이 그대로 비쳐서 오히려 그림이 산다. */
  .board { width: 100%; display: grid; justify-items: center;
           grid-template-rows: var(--play-h) 30px auto; align-content: center;
           position: relative; }
  /* 떡을 프레임 한가운데에 둔다.

     예전에는 돌탑 1층과 높이를 맞추려고 바닥에 붙여 두었다. 그런데 이 게임은
     떡 위에서 칼이 오가므로, 바닥에 붙이면 위쪽 절반이 통째로 비고
     눈은 아래 구석만 보게 된다. 정작 봐야 할 것이 화면 밑에 몰린다.
     돌탑과 높이가 조금 어긋나는 것보다 이쪽이 낫다. */
  .cakeslot { display: grid; place-items: center; order: 1;
              width: var(--play-w); height: var(--play-h); }
  .ratio    { order: 2; align-self: center; }
  .controls { text-align: center; order: 3; }
  .slot { position: absolute; left: 50%; top: calc(var(--play-h) / 2);
          transform: translate(-50%, -50%); z-index: 4;
          display: grid; place-items: center; pointer-events: none; }

  /* 떡 — 세 상태 그림이 같은 캔버스라 contain 으로 두면 크기가 저절로 맞는다 */
  .cake {
    position: relative; width: 768px; height: 154px;
    background: url('assets/ricecut/cake-idle.webp?v=180') center / contain no-repeat;
    filter: drop-shadow(0 10px 16px rgba(40, 30, 20, .40));
  }
  /* 다 자르고 나면 온전한 그림을 숨기고 조각들로 바꿔 끼운다 */
  .cake.cut { background-image: none; }

  /* 잘린 조각. 자를 자리가 매판 다르므로 조각 그림을 미리 만들어 둘 수 없다.
     그래서 같은 그림 한 장을 조각마다 깔고 배경을 옆으로 밀어
     자기 몫만 보이게 한다. 폭과 미는 양은 코드가 넣는다. */
  .cake .piece {
    position: absolute; top: 0; height: 100%;
    background-image: var(--face, url('assets/ricecut/cake-idle.webp?v=180'));
    background-repeat: no-repeat;
    background-size: 768px auto;
    transform: translateX(var(--sh, 0));
    transition: transform .34s cubic-bezier(.2,.8,.3,1);
  }
  /* 잘린 단면. 가래떡 속살은 하얗고 매끈해서 옅은 띠 하나면 단면으로 읽힌다. */
  .cake .piece::before,
  .cake .piece::after { content: none; position: absolute; top: 9%; bottom: 9%; width: 6px; }
  .cake .piece.cl::before {
    content: ""; left: 0;
    background: linear-gradient(90deg, rgba(255,252,244,.96), rgba(255,252,244,0));
    border-radius: 50% 0 0 50% / 50% 0 0 50%;
  }
  .cake .piece.cr::after {
    content: ""; right: 0;
    background: linear-gradient(90deg, rgba(255,252,244,0), rgba(255,252,244,.96));
    border-radius: 0 50% 50% 0 / 0 50% 50% 0;
  }

  /* 칼이 닿는 순간 떡이 움찔한다. 그림만 바뀌면 맞은 느낌이 없다.
     아래로 눌렸다가 튀어오르는 한 박자. */
  .cake.shock { animation: cake-shock .34s cubic-bezier(.2,.8,.3,1); }
  @keyframes cake-shock {
    0%   { transform: scaleY(1)    translateY(0); }
    14%  { transform: scaleY(.90)  translateY(5px); }
    38%  { transform: scaleY(1.05) translateY(-3px); }
    64%  { transform: scaleY(.98)  translateY(1px); }
    100% { transform: scaleY(1)    translateY(0); }
  }

  /* 자를 자리. 두 곳이 보이되 지금 잘라야 할 쪽만 밝다.
     둘 다 밝으면 어디를 노려야 하는지 알 수 없다. */
  /* 선 색은 다홍이다. 떡이 크림빛이고 배경도 밝은 부엌이라
     흰 선은 떡 위에서 거의 사라졌다. 붉은 쪽으로 가야 눈에 걸린다. */
  .cake .guide {
    position: absolute; top: -8px; bottom: -8px; width: 2px;
    background: rgba(255, 92, 68, .42);
    transform: translateX(-50%);
    transition: background .18s, box-shadow .18s, width .18s;
  }
  /* 도전 전에는 감춘다. 어차피 누르는 순간 자리를 새로 뽑으므로
     미리 보여 줘 봐야 그 자리가 아니다 — 헛것을 보여 주는 셈이다.

     사라지고 나타나는 것은 서서히 하지 않는다. 투명도는 화면 합성 쪽이
     맡는 값이라 창이 가려지면 중간에 멎어 버린다. 그러면 도전을 눌러도
     선이 안 보이는 판이 생긴다 — 방송에서 그러면 손쓸 방법이 없다. */
  .cake .guide.hide { opacity: 0; }
  .cake .guide.on {
    width: 3px; background: rgb(255, 62, 40);
    box-shadow: 0 0 13px rgba(255, 70, 45, .95), 0 0 4px rgba(255, 190, 170, .8);
  }
  /* 이미 자른 자리 — 흔적만 남긴다 */
  .cake .guide.done { background: rgba(255, 220, 170, .55); box-shadow: none; width: 2px; }

  /* 칼 — left 는 왼쪽 모서리 기준이라 폭이 넓어지면 날 선이 그만큼 밀린다.
     가운데로 당겨야 화면에 보이는 자리와 실제 판정 자리가 맞는다. */
  .knife {
    position: absolute; top: -96px; bottom: 105px; width: 51px;
    background: url('assets/ricecut/knife.webp?v=180') center / contain no-repeat;
    transform: translateX(-50%);
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .5));
  }
  .knife.stopped { filter: drop-shadow(0 0 16px rgba(255,255,255,.85)); }

  /* 잘린 뒤 좌우 비율 */
  .ratio { font-size: 15px; color: var(--text-dim); letter-spacing: .3px;
           text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .ratio b { color: #fff; font-size: 17px; }
  .verdict .detail { text-shadow: 0 3px 10px rgba(0,0,0,.9); }
  /* 성공 기준은 규칙 카드에 있으므로 판정에서는 뺀다 */
  .verdict .sub { display: none; }
  .verdict .mark { background: rgba(16,20,26,.72); }
  .verdict.ok .mark { background: rgba(16,40,26,.72); border-color: #4ade80; }
</style>
</head>
<body>
<div id="fit"><div class="stage">

  <div class="topbar">
    <a class="back" href="index.html" title="목록으로">←</a>
    <div class="tile sm pic"><img src="assets/_icons/ricecut.webp?v=180" alt=""></div>
    <div class="titles">
      <h1>떡 자르기</h1>
      <p>Rice Cake Cut</p>
    </div>
  </div>

  <div class="body">
    <div class="play">
      <div class="board">
        <div class="cakeslot playslot">
          <div class="cake" id="cake">
            <div class="pieces" id="pieces"></div>
            <div class="guide" id="g0"></div>
            <div class="guide" id="g1"></div>
            <div class="knife" id="knife" style="left:0"></div>
          </div>
        </div>
        <div class="ratio" id="ratio"></div>
        <div class="slot" id="slot"></div>
        <div class="controls">
          <button class="btn" id="go">도 전</button>
          <div class="hint">스페이스바</div>
        </div>
      </div>
    </div>

    <aside class="rules card">
      <h2>규칙</h2>
      <ul>
        <li>칼이 좌우로 왕복합니다</li>
        <li>밝은 선에 맞춰 두 번 자르세요</li>
        <li>가운데를 지날 때 가장 빠릅니다</li>
        <li>끌수록 점점 빨라집니다</li>
        <li>자를 자리는 매판 달라집니다</li>
        <li>기회는 한 번뿐입니다</li>
        <li><b>[성공기준]</b> 두 오차의 합 1.00% 이내</li>
      </ul>
    </aside>
  </div>

</div></div>

<script>
"use strict";

const R = RULES.ricecut;

// 녹음된 소리를 등록한다. 오기 전에는 코드로 만든 소리가 대신 난다.
Sound.use({
  slice:       "assets/_sounds/ricecut/cut.mp3?v=180",     // 떡을 가르는 순간
  swoosh:      "assets/_sounds/ricecut/swoosh.mp3?v=180",  // 칼이 지나가는 바람
  thud:        "assets/_sounds/ricecut/miss.mp3?v=180",    // 도마를 치는 둔탁한 소리
  success:     "assets/_sounds/common/success.mp3?v=180",
  fail:        "assets/_sounds/common/fail.mp3?v=180",
});
const cake   = document.getElementById("cake");
const pieces = document.getElementById("pieces");
const guides = [document.getElementById("g0"), document.getElementById("g1")];
const knife = document.getElementById("knife");
const ratio = document.getElementById("ratio");
const slot = document.getElementById("slot");   // 판정이 들어갈 자리
const go   = document.getElementById("go");     // 버튼은 하나뿐. 글자만 바뀐다.

let state = "ready";      // ready | running | done
let raf = 0, t0 = 0;
let 자를자리 = [];        // 이번 판에 잘라야 할 두 곳 (0~1)
let 차례 = [];            // 어느 쪽부터 자를지. 매판 랜덤
let 몇번째 = 0;           // 지금 몇 번째 컷인가
let 오차들 = [];          // 컷마다의 오차(%)
let sweep = 2.6;          // 이번 판의 편도 기준 시간(초)
let centerK = 0.58;       // 가운데 가속. 끝 (1-K)배, 가운데 (1+K)배
let waveA = 0.2;          // 시간에 따라 빨라졌다 느려지는 폭
let waveW = 3;            // 그 각속도
let wavePhi = 0;          // 시작 시점의 위상. 매판 달라야 첫 통과부터 다르다

// 칼이 지금까지 나아간 양. 속도가 시시각각 바뀌므로 시간에 그대로 비례하지 않는다.
//
// 프레임마다 조금씩 더하는 방식이 아니라 적분식을 그대로 쓴다.
// 누른 순간의 위치를 그 시각만 가지고 정확히 되짚어야 하는데,
// 성공 창이 10ms 안팎이라 프레임 단위로 누적하면 한 프레임 오차가 곧 오판이 된다.
//
//   속도(t) = 1 + creep·t + waveA·sin(waveW·t + wavePhi)
//   나아간 양 = ∫ 속도 dt
//
// 속도는 항상 0보다 크다(waveA 가 1 미만이라). 즉 칼이 뒤로 가는 일은 없다.
function advAt(sec) {
  return sec
       + R.creep * sec * sec / 2
       + waveA * (Math.cos(wavePhi) - Math.cos(waveW * sec + wavePhi)) / waveW;
}

// 칼의 위치를 0~1 로 돌려준다. 0 = 왼쪽 끝, 1 = 오른쪽 끝.
//
// 나아간 양을 그대로 위치로 쓰지 않고 한 번 더 일그러뜨린다.
// 양 끝에서는 뜸을 들이고 가운데는 훅 지나가게 하려는 것이다.
//
//   위치 = t - K·sin(2πt)/(2π)      (t 는 0~1 로 편 왕복 위상)
//   속도 = 1 - K·cos(2πt)           → 끝 (1-K)배, 가운데 (1+K)배
//
// 끝(0, 1)과 가운데(0.5)는 그대로 0, 1, 0.5 로 남는다.
// 특히 가운데가 0.5 에 그대로 있어야 성공선이 왕복의 한가운데 시점과 맞물린다.
// K 가 1 미만이면 속도가 0 이하로 내려가지 않으므로 칼은 늘 앞으로만 간다.
function posAt(sec) {
  const phase = (advAt(sec) / sweep) % 2;          // 0~2 가 한 왕복
  const tri = phase < 1 ? phase : 2 - phase;
  return tri - centerK * Math.sin(2 * Math.PI * tri) / (2 * Math.PI);
}

function drawKnife(p) {
  knife.style.left = (p * 100) + "%";
}

// 칼이 지나갈 때마다 바람 소리를 낸다.
// 왕복 한 번에 한 번씩만 — 매 프레임 울리면 소리가 뭉개진다.
// 가운데를 지나는 순간에 맞춰 울려야 눈으로 보는 것과 귀로 듣는 것이 맞물린다.
let 지난쪽 = 0;

function frame(now) {
  const sec = (now - t0) / 1000;
  const p = posAt(sec);
  drawKnife(p);

  // 가운데(0.5)를 막 넘었는가
  const 쪽 = p < 0.5 ? -1 : 1;
  if (지난쪽 !== 0 && 쪽 !== 지난쪽) {
    // 그 순간의 속도를 소리 세기로 넘긴다. 빠를수록 날카롭게 지나간다.
    const v = Math.abs(posAt(sec + 0.008) - posAt(sec - 0.008)) / 0.016;
    Sound.swoosh(Math.min(1, v / 1.1));
  }
  지난쪽 = 쪽;

  raf = requestAnimationFrame(frame);
}

// 자르기 전에 띄워 두는 한 줄. 자르고 나면 좌우 비율이 이 자리를 대신한다.
// 칼이 지금 어디쯤인지는 절대 숫자로 보여주지 않는다. 그러면 눈이 아니라
// 숫자를 보고 누르게 되어 게임이 아니게 된다.
const GUIDE = "밝은 선에 맞춰 <b>두 번</b> 자르세요";

// 자를 자리를 매판 새로 뽑는다.
// 조각 셋이 저마다 최소 minGapPct 는 되도록 잡는다 —
// 안 그러면 종잇장처럼 얇은 조각이 나와서 자를 자리가 사실상 정해져 버린다.
function 자리뽑기() {
  const g = R.minGapPct / 100;
  const a = g + Math.random() * (1 - 3 * g);        // 첫 선
  const b = a + g + Math.random() * (1 - g - a - g); // 둘째 선
  return [a, b];
}

function 선그리기() {
  for (let i = 0; i < 2; i++) {
    guides[i].style.left = (자를자리[i] * 100) + "%";
    guides[i].className = "guide";
  }
}

function 선숨기기() {
  for (let i = 0; i < 2; i++) guides[i].className = "guide hide";
}

// 지금 잘라야 할 선만 밝힌다
function 지금선() {
  if (몇번째 >= 차례.length) return;
  guides[차례[몇번째]].classList.add("on");
}

function reset() {
  cancelAnimationFrame(raf);
  state = "ready";
  ratio.innerHTML = GUIDE;
  slot.innerHTML = "";
  knife.classList.remove("stopped");
  cake.classList.remove("ok", "fail", "shock", "cut");
  cake.style.removeProperty("--face");
  pieces.innerHTML = "";
  자를자리 = 자리뽑기();
  차례 = Math.random() < 0.5 ? [0, 1] : [1, 0];
  몇번째 = 0; 오차들 = [];
  선숨기기();
  drawKnife(0);
  go.textContent = "도 전";
}

function start() {
  // 매판 움직임을 새로 뽑는다. 외워서 하는 게 아니라 보고 읽어야 한다.
  // 흔들림 주기가 편도 시간과 맞물리면 결국 같은 박자가 되어 버리므로
  // 두 값을 따로 뽑고, 시작 위상까지 흩어 놓는다.
  sweep   = R.sweepMin  + Math.random() * (R.sweepMax  - R.sweepMin);
  centerK = R.centerMin + Math.random() * (R.centerMax - R.centerMin);
  waveA   = R.waveMin   + Math.random() * (R.waveMax   - R.waveMin);
  waveW   = 2 * Math.PI / (R.wavePMin + Math.random() * (R.wavePMax - R.wavePMin));
  wavePhi = Math.random() * Math.PI * 2;

  state = "running";
  slot.innerHTML = "";
  knife.classList.remove("stopped");
  cake.classList.remove("ok", "fail", "shock", "cut");
  cake.style.removeProperty("--face");
  pieces.innerHTML = "";
  자를자리 = 자리뽑기();
  차례 = Math.random() < 0.5 ? [0, 1] : [1, 0];
  몇번째 = 0; 오차들 = [];
  선그리기(); 지금선();
  진행표시();
  go.textContent = "자 르 기";
  지난쪽 = 0;
  // 예전에는 여기서 낮은 음을 깔고 끌수록 조여들게 했다.
  // 뱃고동처럼 울려서 칼 소리도 판정음도 다 덮었다. 뺐다.
  t0 = performance.now();
  raf = requestAnimationFrame(frame);
}

// 지금 몇 번째를 자르는 중인지, 오차가 얼마나 쌓였는지 보여준다
function 진행표시() {
  const 쌓임 = 오차들.reduce((a, b) => a + b, 0);
  ratio.innerHTML = "<b>" + (몇번째 + 1) + "</b> / " + R.cuts + " 번째"
    + (오차들.length
        ? " &nbsp;·&nbsp; 오차 <b>" + 쌓임.toFixed(2) + "</b>% / " + R.tolSum.toFixed(2) + "%"
        : " &nbsp;·&nbsp; 밝은 선에 맞추세요");
}

// 다 자른 뒤 떡을 세 조각으로 갈라 놓는다.
// 자를 자리가 매판 다르므로 조각 그림을 미리 만들 수 없다.
// 같은 그림을 조각마다 깔고 배경을 옆으로 밀어 자기 몫만 보이게 한다.
// 다 자른 뒤 조각들의 표정.
// cake-ok 은 이미 가운데가 갈려 있어 세 조각으로 나누면 엉뚱한 자국이 남는다.
// 그래서 그 틈을 떡 몸통으로 메운 통짜 웃는 그림(cake-happy)을 따로 만들어 쓴다.
const 표정 = {
  ok:   "url('assets/ricecut/cake-happy.webp?v=180')",
  fail: "url('assets/ricecut/cake-fail.webp?v=180')",
};

function 조각내기(자른곳, ok) {
  const W = cake.clientWidth;
  const 경계 = [0, ...[...자른곳].sort((a, b) => a - b).map((v) => v * W), W];
  cake.classList.add("cut");
  cake.style.setProperty("--face", ok ? 표정.ok : 표정.fail);
  pieces.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const l = 경계[i], r = 경계[i + 1];
    const d = document.createElement("div");
    d.className = "piece" + (i > 0 ? " cl" : "") + (i < 2 ? " cr" : "");
    d.style.left = l + "px";
    d.style.width = (r - l) + "px";
    d.style.backgroundPosition = (-l) + "px center";
    pieces.appendChild(d);
    // 한 박자 뒤에 좌우로 벌어진다. 바로 벌리면 잘린 게 안 보인다.
    setTimeout(() => d.style.setProperty("--sh", ((i - 1) * 9) + "px"), 60);
  }
}

function cut(at) {
  const p = posAt((at - t0) / 1000);
  const 노린곳 = 자를자리[차례[몇번째]];
  const err = Math.abs(p - 노린곳) * 100;      // % 단위
  오차들.push(err);

  drawKnife(p);
  Sound.slice();
  Sound.thud(err < 0.3 ? 0.85 : 0.45);
  cake.classList.remove("shock");
  void cake.offsetWidth;
  cake.classList.add("shock");

  // 방금 자른 선은 흔적만 남기고, 다음 선을 밝힌다
  guides[차례[몇번째]].className = "guide done";
  몇번째++;

  if (몇번째 < R.cuts) {                        // 아직 남았다
    지금선();
    진행표시();
    return;                                     // 칼은 계속 왕복한다
  }

  // 다 잘랐다
  cancelAnimationFrame(raf);
  state = "done";
  knife.classList.add("stopped");

  const 합 = 오차들.reduce((a, b) => a + b, 0);
  const ok = 합 <= R.tolSum;
  조각내기(자를자리, ok);

  ratio.innerHTML = "오차 " + 오차들.map((e) => e.toFixed(2)).join("% + ")
                  + "% = <b>" + 합.toFixed(2) + "</b>%";
  slot.innerHTML = verdictHtml(ok, "오차 " + 합.toFixed(2) + "%", "");
  go.textContent = "다 시";
  setTimeout(() => { if (ok) Sound.success(); else Sound.fail(); }, 130);
}

function press(ev) {
  if (state === "ready") start();
  else if (state === "running") cut(pressTime(ev));
  else reset();
}

go.addEventListener("click", press);
onPressKey(press);
reset();
</script>
</body>
</html>
