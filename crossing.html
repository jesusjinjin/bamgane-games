<script>
"use strict";

/* ── 엔진 시작 ──────────────────────────────────────────────────
   화면·소리와 떨어진 규칙 덩어리다. 시간(초)만 받아 상태를 바꾼다.
   시뮬레이션이 이 구간만 잘라 그대로 돌리므로 DOM 을 건드리지 않는다. 1/240초 칸으로 흐른다.

   줄 번호 0 출발 · 1~6 길과 선로 · 7 쉼터 · 8~13 강 · 14 성벽. 자리 x 는 칸 단위(0~26), 칸 i 의 가운데는 i+0.5.
   줄 위의 물건(마차·뗏목·마시멜로)은 판을 만들 때 전부 정해진다. 나중에 무작위가 끼지 않는다 —
   어느 시각의 모습이든 계산으로 바로 나온다(줄마다 따로 쓰는 난수로 미리 늘려 둔다). 바뀌는 것은 공주뿐이다.
   줄 시간 λ 는 판을 만든 때부터 잰다 (도전 전 미리 보기에서도 줄이 흐르다 그대로 이어진다). 제한 시간은 "시작!" 부터. */
function 건너기판(R, 난수, 기준) {
  const 무작위 = 난수 || Math.random;
  const 칸 = 1 / 240;
  const N = R.칸수;
  const 쉼터줄 = 1 + R.줄.findIndex((j) => j.종류 === "강");
  const 성줄 = R.줄.length + 2;
  const 정의 = (r) => (r <= 0 || r === 쉼터줄 || r >= 성줄) ? null : R.줄[r < 쉼터줄 ? r - 1 : r - 2];
  const 몇번째 = (r) => (r <= 0 || r === 쉼터줄) ? 0 : r >= 성줄 ? R.줄.length + 1 : r < 쉼터줄 ? r : r - 1;
  const 나머지 = (a, b) => ((a % b) + b) % b;

  // 줄마다 따로 쓰는 난수 — 어떤 차례로 물어봐도 같은 판이 나오게 한다 (mulberry32)
  function 씨앗난수(s) {
    return () => {
      s = (s + 0x6D2B79F5) | 0;
      let x = Math.imul(s ^ (s >>> 15), 1 | s);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  const g = {
    t: 기준 || 0, 기준: 기준 || 0, t0: null, 끝: null, 끝줄: 0, 최고: 0,
    공주: { 줄: 0, x: Math.floor(N / 2) - 0.5, 점프: null },
    다음: null,                                       // 공중에서 누른 키 하나
    문: 0, 곰위상: 0, 줄들: [], 소식: [],

  /* 줄의 움직임은 구간을 이어 붙인 것: { 시작, 끝, 이동(시작 때 밀린 칸), v(시작 때 빠르기), a(가속), 상태 }.

    const 줄 = { 종류: d.종류, d, 난, 뽑, 번호: 몇번째(r), 찾던: 0 };
    if (d.종류 === "선로") {
      줄.구간 = [{ 시작: 0, 끝: 뽑(d.열차.간격), 이동: 0, v: 0, a: 0, 상태: "잠잠" }];
    } else {
      const 쪽 = d.종류 === "길" ? 길쪽 : d.종류 === "강" ? 강쪽 : (난() < 0.5 ? -1 : 1);
      if (d.종류 === "길") 길쪽 = -길쪽; else if (d.종류 === "강") 강쪽 = -강쪽;
      const v = 뽑(d.속도) * 쪽;
      줄.물건 = [];
      const 주기 = d.가라앉음 ? d.가라앉음.뜸 + d.가라앉음.흔들 + d.가라앉음.잠김 : 0;
      const 입주기 = d.악어 ? d.악어.닫힘 + d.악어.예고 + d.악어.벌림 : 0;
      const 길이로 = (l) => Array.isArray(l) ? l[0] + Math.floor(난() * (l[1] - l[0] + 1)) : l;
      const 모양뽑기 = () => {
        let 남 = 난() * d.모양.reduce((a, m) => a + m.몫, 0);
        for (const m of d.모양) { 남 -= m.몫; if (남 <= 0) return m; }
        return d.모양[d.모양.length - 1];
      };
      let p = 0;
      while (p < R.고리최소) {
        if (d.떼) {                                    // 스쿠터 떼 — 바짝 붙어 몰려오고 떼 사이는 넓다. 가끔 마카롱 마차
          if (난() < d.떼.마차몫) { 줄.물건.push({ p, 길이: 2, 모양: "cart2" }); p += 2 + 뽑(d.틈); continue; }
          const n = 길이로(d.떼.대수);
          for (let i = 0; i < n; i++) { 줄.물건.push({ p, 길이: 1, 모양: "scooter1" }); p += 1 + (i < n - 1 ? d.떼.사이 : 0); }
          p += 뽑(d.틈); continue;
        }
        const m = d.모양 ? 모양뽑기() : null;
        const 길이 = 길이로(m ? m.길이 : d.길이);
        const o = { p, 길이, 모양: m ? m.이름 : null };
        if (d.색) o.모양 = d.색[Math.floor(난() * d.색.length)];
        if (d.가라앉음) { o.가라앉나 = 난() < d.가라앉음.몫; o.위상 = 난() * 주기; }
        if (d.구멍) o.구멍 = true;
        if (d.악어 && o.모양 === "croc") { o.악어 = true; o.입위상 = 난() * 입주기; }
        if (d.돌진 && 난() < d.돌진.몫) { const 주 = 뽑(d.돌진.주기); o.돌진 = { 주기: 주, 위상: 난() * 주 }; }
        if (d.쪼개짐 && o.모양 === d.쪼개짐.누가) { o.쪼개짐 = true; o.쪼개위상 = 난() * 쪼갬주기(d.쪼개짐); }
        if (d.흔적 && o.모양 === d.흔적.누가) { o.방울간격 = 뽑(d.흔적.간격); o.방울위상 = 난() * o.방울간격; }
        줄.물건.push(o);
        p += 길이 + 뽑(d.틈);
      }
      줄.고리 = p;
      줄.처음 = 난() * p;
      if (d.물고기) 줄.물고기 = { 찾던: 0, 구간: [{ 시작: -1e9, 끝: 뽑(d.물고기.간격), 상태: "잠잠" }] };
      const 첫길이 = d.폭주 ? 뽑(d.폭주.간격) : d.반전 ? 뽑(d.반전.간격) : Infinity;
      줄.구간 = [{ 시작: 0, 끝: 첫길이, 이동: 0, v, a: 0, 상태: "보통" }];
    }
    g.줄들.push(줄);
  }
  g.문 = R.문범위[0] + Math.floor(무작위() * (R.문범위[1] - R.문범위[0] + 1));
  /* 젤리곰 문지기 — 비킴(옆에 서 있음) → 예고(문 쪽으로 걸어옴) → 앉음(문을 막음) → 돌아감(걸어서 제자리로) → 비킴 …
     가끔 속임: 걸어오다 멈칫하고 되돌아간다 (앉지 않음). 위치 0 = 옆자리, 1 = 문 앞. 문은 "앉음" 동안만 막힌다 */
  const 곰서기 = Math.max(0.1, R.곰비킴 - R.곰예고 - (R.곰돌아감 || 0));
  g.곰 = { 난: 씨앗난수(Math.floor(무작위() * 4294967296)), 찾던: 0, 구간: [] };
  g.곰.구간.push({ 시작: -1e9, 끝: 0.1 + g.곰.난() * 곰서기, 상태: "비킴", 처음: 0, 나중: 0 });

  // 다음 구간 하나를 붙인다
  function 붙이기(줄) {
    const s = 줄.구간[줄.구간.length - 1], d = 줄.d, 길이 = s.끝 - s.시작;
    const 이동끝 = s.이동 + s.v * 길이 + 0.5 * s.a * 길이 * 길이, v끝 = s.v + s.a * 길이;
    const 새 = (상태, 초, v, a, 덧) => 줄.구간.push(Object.assign({ 시작: s.끝, 끝: s.끝 + 초, 이동: 이동끝, v, a: a || 0, 상태 }, 덧));
    if (d.종류 === "선로") {
      const k = d.열차;
      if (s.상태 === "잠잠") 새("예고", k.예고, 0, 0, { 쪽: s.다음쪽 || (줄.난() < 0.5 ? -1 : 1), 이어: s.이어,
                                                     모양: k.모양 ? k.모양[Math.floor(줄.난() * k.모양.length)] : "train" });
      else if (s.상태 === "예고") 새("지나감", (N + k.길이) / k.속도 + 0.05, 0, 0, { 쪽: s.쪽, 이어: s.이어, 모양: s.모양 });
      // 연속 열차 — 한 대가 지나간 직후 반대쪽에서 한 대 더 (종이 다시 울린다). 세 대째는 없다
      else if (!s.이어 && k.연속몫 && 줄.난() < k.연속몫) 새("잠잠", k.연속틈, 0, 0, { 이어: true, 다음쪽: -s.쪽 });
      else 새("잠잠", 줄.뽑(k.간격), 0);
    } else if (d.폭주) {
      const k = d.폭주;
      if (s.상태 === "보통") 새("예고", k.예고, v끝);
      else if (s.상태 === "예고") 새("폭주", k.길이, v끝 * k.배);
      else 새("보통", 줄.뽑(k.간격), v끝 / k.배);
    } else if (d.반전) {
      const k = d.반전;
      if (s.상태 === "보통") 새("예고", k.예고, v끝);
      else if (s.상태 === "예고") 새("전환", k.전환, v끝, -2 * v끝 / k.전환);
      else 새("보통", 줄.뽑(k.간격), v끝);
    }
  }
  function 구간찾기(줄, λ) {
    const 구 = 줄.구간;
    while (구[구.length - 1].끝 <= λ) 붙이기(줄);
    let i = Math.min(줄.찾던, 구.length - 1);
    while (i > 0 && 구[i].시작 > λ) i--;
    while (구[i].끝 <= λ) i++;
    줄.찾던 = i;
    return 구[i];
  }
  function 곰붙이기() {
    const 곰 = g.곰, s = 곰.구간[곰.구간.length - 1];
    const 새 = (상태, 초, 처음, 나중, 덧) => 곰.구간.push(Object.assign({ 시작: s.끝, 끝: s.끝 + 초, 상태, 처음, 나중 }, 덧));
    if (s.상태 === "비킴") {
      // 비켜 서 있을 때 가끔 12번 줄 한 칸으로 젤리를 던진다 (던지는 동안 문은 열려 있다)
      if (R.곰던짐 && !s.던진뒤 && 곰.난() < R.곰던짐.몫) { 새("던짐", R.곰던짐.예고, 0, 0, { c: 1 + Math.floor(곰.난() * (N - 2)) }); return; }
      if (곰.난() < (R.곰속임몫 || 0)) 새("예고", R.곰예고 * R.곰속임깊이, 0, R.곰속임깊이, { 속임: true });
      else 새("예고", R.곰예고, 0, 1);
    } else if (s.상태 === "던짐") 새("비킴", 0.3, 0, 0, { 던진뒤: true, c: s.c, 떨어짐: s.끝 });
    else if (s.상태 === "예고") {
      if (s.속임) 새("멈칫", R.곰멈칫, s.나중, s.나중);
      else 새("앉음", R.곰앉음, 1, 1);
    } else if (s.상태 === "멈칫") 새("돌아감", (R.곰돌아감 || 0.01) * s.나중, s.나중, 0);
    else if (s.상태 === "앉음") 새("돌아감", R.곰돌아감 || 0.01, 1, 0);
    else 새("비킴", 곰서기, 0, 0);
  }
  function 곰구간(λ) {
    const 곰 = g.곰, 구 = 곰.구간;
    while (구[구.length - 1].끝 <= λ) 곰붙이기();
    let i = Math.min(곰.찾던, 구.length - 1);
    while (i > 0 && 구[i].시작 > λ) i--;
    while (구[i].끝 <= λ) i++;
    곰.찾던 = i;
    return 구[i];
  }
  // 그림용 — 곰이 어디쯤(0 옆자리 ~ 1 문 앞), 어느 쪽으로 걷나
  function 곰모습(λ) {
    const s = 곰구간(λ), q = Math.max(0, Math.min(1, (λ - s.시작) / Math.max(1e-6, s.끝 - s.시작)));
    return { 상태: s.상태, 위치: s.처음 + (s.나중 - s.처음) * q, 쪽: Math.sign(s.나중 - s.처음), 몫: q, 속임: !!s.속임, c: s.c };
  }
  // 젤리 맞음 — 떨어진 순간부터 0.12초 동안 그 칸(반폭 안)에 있으면 퐁당
  function 젤리맞나(r, x, λ) {
    if (!R.곰던짐 || r !== 성줄 - 1) return false;
    const s = 곰구간(λ);
    return !!s.던진뒤 && λ - s.시작 < 0.12 && Math.abs(x - (s.c + 0.5)) < R.곰던짐.반폭;
  }
  // 뗏목에 붙은 젤리 자국 — 떨어진 때 그 칸의 뗏목에 붙어 같이 흘러가다 자국초 뒤 마른다. 떨어진 순간 정해진다
  function 젤리자국들(λ) {
    if (!R.곰던짐) return [];
    곰구간(λ);
    const 결과 = [], 줄 = g.줄들[성줄 - 1];
    for (const s of g.곰.구간) {
      if (s.상태 !== "던짐" || s.끝 > λ || s.끝 <= λ - R.곰던짐.자국초) continue;

const 끝말 = { 치임: "마차에 치였다", 열차: "열차에 치였다", 빠짐: "강에 빠졌다", 떠내려감: "떠내려갔다",
              가라앉음: "마시멜로가 가라앉았다", 눅눅: "웨하스가 눅눅해져 가라앉았다", 지렁이: "젤리 지렁이에 닿았다",
              쪼개짐: "초코바가 쪼개져 빠졌다", 젤리: "젤리곰의 젤리에 맞았다",
              잡힘: "젤리곰에게 잡혔다", 물림: "젤리 악어에게 물렸다", 물고기: "젤리 물고기에 밀려 빠졌다", 시간: "시간 초과", 포기: "포기" };
function 상태줄(t) {
  const g = 엔진.g;
  const 지난 = Math.min(R.제한초, (판상태 === "play" ? t : g.t) - g.t0);
  status.innerHTML = "<b>" + Math.min(R.줄.length, g.최고) + "</b> / " + R.줄.length + "줄 · <b>" + 지난.toFixed(1) + "</b>초";
}

function reset() {
  판상태 = "ready";
  엔진 = 건너기판(R, null, 지금());       // 미리 보기 — 도전하면 이 판 그대로 시작한다
  토끼쪽 = "위"; 착지시각 = -9; 앞점프 = false;
  앞줄상태 = [];
  반짝 = [];
  slot.innerHTML = "";
  status.innerHTML = "<b>" + R.제한초 + "</b>초 안에 성문에 들어가면 성공";
  go.textContent = "도 전";
  go.classList.remove("playing");
}

function start() {
  읽은소식 = 엔진.g.소식.length;
  판상태 = "count";
  카운트시작 = 지금();
  카운트끝 = 카운트시작 + 훑기.머묾 + 훑기.내려옴 + 0.9;   // 훑기 1.3초 → "준비" → "시작!"
  Sound.tick(1.0, 0.06);
  slot.innerHTML = "";
  go.textContent = "포 기";
  go.classList.add("playing");
}

function 끝처리() {
  if (판상태 !== "play") return;
  끝시각 = 지금();
  go.classList.remove("playing");
  const g = 엔진.g;
  판상태 = g.끝 === "포기" ? "done" : "ending";
  if (g.끝 === "성공") {
    const cx = 가로(g.문 + 0.5), cy = 줄위(14) + S / 2;
    for (let i = 0; i < 26; i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 140;
      반짝.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, 나이: 0,
                  색: ["#ffd36e", "#f9a8d4", "#fff"][i % 3] });
    }
  }
  if (g.끝 === "치임" || g.끝 === "열차") Sound.thud(0.8);
  if (g.끝 === "빠짐" || g.끝 === "떠내려감" || g.끝 === "가라앉음" || g.끝 === "눅눅" || g.끝 === "물고기" || g.끝 === "쪼개짐" || g.끝 === "젤리") Sound.swoosh(0.6);
  if (g.끝 === "지렁이") Sound.thud(0.5);
  if (g.끝 === "잡힘") Sound.thud(0.5);
  setTimeout(판정, 판상태 === "ending" ? 900 : 0);
}

function 판정() {
  판상태 = "done";
  const g = 엔진.g;
  const ok = g.끝 === "성공";
  const 걸림 = Math.min(R.제한초, g.t - g.t0);
  const 까닭 = ok ? 걸림.toFixed(1) + "초"
            : g.끝 === "포기" || g.끝 === "시간" ? 끝말[g.끝]
            : (g.끝줄 > R.줄.length ? "성문 앞" : g.끝줄 === 0 ? "쉼터" : g.끝줄 + "번째 줄") + " · " + 끝말[g.끝];
  상태줄(g.t);
  slot.innerHTML = verdictHtml(ok, 까닭);
  go.textContent = "다 시";
  setTimeout(() => { if (ok) Sound.success(); else Sound.fail(); }, 120);
}

/* 한 번 누르면 한 칸. 누르고 있어도 되풀이하지 않는다 */
const 방향키 = { ArrowUp: "위", KeyW: "위", ArrowDown: "아래", KeyS: "아래",
                 ArrowLeft: "왼", KeyA: "왼", ArrowRight: "오른", KeyD: "오른" };
addEventListener("keydown", (e) => {
  const 방향 = 방향키[e.code];
  if (!방향) return;
  e.preventDefault();
  if (e.repeat || 판상태 !== "play") return;
  엔진.입력("뛰기", 눌린시각(e), 방향);
  소식처리();
  if (엔진.g.끝) 끝처리();
});

go.addEventListener("click", () => {
  if (판상태 === "count" || 판상태 === "ending") return;
  if (판상태 === "ready") start();
  else if (판상태 === "play") { 엔진.진행(지금()); if (!엔진.g.끝) { 엔진.g.끝 = "포기"; 엔진.g.끝줄 = 0; } 끝처리(); }
  else if (판상태 === "done") reset();
});
onPressKey(() => {
  if (판상태 === "ready") start();
  else if (판상태 === "done") reset();
});

reset();
requestAnimationFrame(draw);
</script>
