<script>
"use strict";

/* ── 엔진 시작 ──────────────────────────────────────────────────
   화면·소리와 떨어진 규칙 덩어리다. 시간(초)만 받아 상태를 바꾼다.
   시뮬레이션이 이 구간만 잘라 그대로 돌리므로 DOM 을 건드리지 않는다. 1/240초 칸으로 흐른다.

     시소가 가려는 기울기 = 곰무게·곰자리 + 공주무게·공주자리 (+ 흔들기)
     시소 각가속도      = 따라감·(가려는 기울기 − 각) − 감쇠·각속도
     공주 미끄럼        += 미끄럼·sin(각) (마찰로 줄어든다)
     공주 자리          += (걷기 + 미끄럼 + 대시) · 시간

   곰 상태: 쉼 → 걷기(아무 데로 천천히) 또는 예고(씨익) → 돌진 · 속임 · 흔들기 → 쉼 */
function 시소판(R, 난수) {
  const 무작위 = 난수 || Math.random;
  const 뽑기 = (a, b) => a + (b - a) * 무작위();
  const 칸 = 1 / 240;
  const g = {
    t: 0, t0: 0, 끝: null,                     // 끝: null | "성공" | "떨어짐" | "포기"
    각: 0, 각속도: 0,                           // 시소 (+ 는 오른쪽이 내려감)
    x: 0, 미끄럼: 0, 방향: 0, 보는쪽: 1,        // 공주 자리(-1~1) · 미끄러지는 빠르기 · 입력 · 바라보는 쪽
    대시끝: -9, 대시쪽: 1, 대시가능: 0,
    곰: { 상태: "쉼", 시작: 0, 끝: 0, 자리: 0.5, 목표: 0.5, 목표2: null, 종류: "", 쪽: 1, 빠르기배: 1 },
    바람: { 상태: "잠잠", 시작: 0, 끝: 0, 쪽: 1 },
    젤리: null,                                 // 날아가는 젤리 {시작, 끝, 출발, 도착}
    웅덩이: [],                                 // 시소 위 젤리 웅덩이 {가운데, 끝}
    별: null, 다음별: 9e9, 기절끝: -9,          // 막판 별사탕 {시작, 끝(떨어지는 때), 자리} · 기절이 풀리는 때
    소식: [],
  };
  // 구간: 0~10초 익히기 · 10~20초 본게임 · 20~30초 막판
  const 단계 = () => { const 지난 = g.t - g.t0; return 지난 < R.구간[0] ? 0 : 지난 < R.구간[1] ? 1 : 2; };
  const 알림 = (t, 일, 덧) => g.소식.push(Object.assign({ t, 일 }, 덧));
  const 막판 = () => R.막판시작 != null && g.t - g.t0 >= R.막판시작;
  // 막판: 끝에 닿자마자 젤리를 던지고(던지는 중이면 건너뜀) → 아주 잠깐 숨 고르기(막판쉼) → 짧은 예고 → 반대쪽 끝으로 돌진
  function 막판다음(t) {
    const c = g.곰, 반대 = c.자리 >= 0 ? -1 : 1;
    if (!c.막판던짐 && !g.젤리) {
      const 도착 = Math.max(-0.85, Math.min(0.85, g.x + 뽑기(-0.15, 0.15)));
      g.젤리 = { 시작: t, 끝: t + R.젤리날기초, 출발: c.자리, 도착 };
      곰바꿈("던지기", R.막판던지기초, t, { 막판던짐: true }); 알림(t, "곰던지기");
      return;
    }
    if (c.상태 === "던지기" && R.막판쉼) { 곰바꿈("쉼", R.막판쉼, t, { 막판던짐: true }); return; }   // 던지고 아주 잠깐 숨 고르기
    곰바꿈("예고", R.막판예고초, t, { 종류: "돌진", 쪽: 반대, 목표: 반대 * R.곰끝, 목표2: null, 막판던짐: false });
    알림(t, "곰예고", { 종류: "돌진" });
  }
  function 곰바꿈(상태, 길이, t, 덧) { Object.assign(g.곰, { 상태, 시작: t, 끝: t + 길이 }, 덧 || {}); }

  // 3구간 광란: 끝에서 잠깐 머문 뒤 짧은 예고 → 끝↔끝 돌진. 어디로 언제 갈지 매번 다르다
  function 광란다음(t) {
    const c = g.곰, 반대 = c.자리 >= 0 ? -1 : 1, r = 무작위();
    let 종류 = "돌진", 목표 = 반대 * R.곰끝;
    if (r < R.광란속임몫) { 종류 = "속임"; 목표 = c.자리; }
    else if (r < R.광란속임몫 + R.광란던지기몫) { 종류 = "던지기"; 목표 = c.자리; }
    else if (무작위() < R.광란같은쪽몫) {
      // 같은 쪽 끝에서 한 번 더 버틴다 — 이미 끝이면 예고 없이 조금 더 머문다
      if (Math.abs(c.자리) > 0.8) { 곰바꿈("쉼", 뽑기(R.쉼최소[2], R.쉼최대[2]), t); return; }
      목표 = -반대 * R.곰끝;
    }
    곰바꿈("예고", R.예고초[2], t, { 종류, 쪽: 반대, 목표, 목표2: null });
    알림(t, "곰예고", { 종류 });
  }

  function 곰다음(t) {
    const k = 단계(), c = g.곰;
    if (막판() && c.상태 !== "예고") { 막판다음(t); return; }
    if (c.상태 === "쉼" && k === 2) { 광란다음(t); return; }
    if (c.상태 === "쉼") {
      if (무작위() < R.장난비율[k]) {
        const r = 무작위();
        const 종류 = r < R.속임몫 ? "속임" : r < R.속임몫 + R.흔들기몫 ? "흔들기"
                   : r < R.속임몫 + R.흔들기몫 + R.던지기몫[k] ? "던지기" : "돌진";
        // 돌진 목적지는 예고 때 몰래 정해 둔다. 늘 같으면 외워서 풀린다
        const 반대 = c.자리 >= 0 ? -1 : 1, r2 = 무작위();
        let 목표 = 반대 * R.곰끝, 목표2 = null;
        if (r2 < R.반대끝몫) { /* 반대쪽 끝 */ }
        else if (r2 < R.반대끝몫 + R.멈칫몫) 목표 = 반대 * 뽑기(0.05, 0.25);                       // 가운데서 멈칫
        else if (r2 < R.반대끝몫 + R.멈칫몫 + R.되돌기몫) { 목표 = 반대 * 0.45; 목표2 = -반대 * R.곰끝; }  // 갔다가 되돌아오기
        else if (Math.abs(c.자리) < 0.7) 목표 = -반대 * R.곰끝;                                    // 같은 쪽 끝으로 더 깊이
        곰바꿈("예고", R.예고초[k], t, { 종류, 쪽: 반대, 목표, 목표2 });
        알림(t, "곰예고", { 종류 });
      } else {
        // 가끔은 공주가 서 있는 쪽으로 간다 — 공주 쪽이 내리막이 된다
        const 목표 = 무작위() < R.노림비율[k] ? (Math.sign(g.x) || 1) * 뽑기(0.45, R.곰끝) : 뽑기(-R.곰끝, R.곰끝);
        const 빠르기배 = 무작위() < R.빨라짐몫 ? 뽑기(1.2, R.빨라짐최대) : 1;
        곰바꿈("걷기", 99, t, { 목표, 목표2: null, 빠르기배 });
      }
    } else if (c.상태 === "예고") {
      if (c.종류 === "돌진") { 곰바꿈("돌진", 99, t); 알림(t, "곰돌진", { 쪽: Math.sign(c.목표 - c.자리) || c.쪽 }); }
      else if (c.종류 === "흔들기") { 곰바꿈("흔들기", R.흔들기초, t); 알림(t, "곰흔들기"); }
      else if (c.종류 === "던지기") {
        // 공주가 서 있는 근처를 노린다 (조금 빗나가게)
        const 도착 = Math.max(-0.85, Math.min(0.85, g.x + 뽑기(-0.15, 0.15)));
        g.젤리 = { 시작: t, 끝: t + R.젤리날기초, 출발: c.자리, 도착 };
        곰바꿈("던지기", 0.45, t); 알림(t, "곰던지기");
      }
      else { 곰바꿈("속임", 0.45, t); 알림(t, "곰속임"); }
    } else {
      곰바꿈("쉼", 뽑기(R.쉼최소[k], R.쉼최대[k]), t);
    }
  }

  function 한칸(t) {
    g.t = t;
    const k = 단계(), c = g.곰;
    // 3구간: 곰이 가운데에 오래 머물지 못하게 — 곧바로 끝으로 돌진 (짧은 예고는 준다)
    if (k === 2 && (c.상태 === "쉼" || c.상태 === "걷기") && Math.abs(c.자리) < 0.3) {
      c.가운데 = (c.가운데 || 0) + 칸;
      if (c.가운데 >= R.가운데최대) {
        c.가운데 = 0;
        const 쪽 = 무작위() < 0.5 ? -1 : 1;
        곰바꿈("예고", R.예고초[2], t, { 종류: "돌진", 쪽, 목표: 쪽 * R.곰끝, 목표2: null });
        알림(t, "곰예고", { 종류: "돌진" });
      }
    } else c.가운데 = 0;

    // 막판이 시작되면 쉬던 곰도 곧바로 움직인다 (앞 구간의 쉼이 막판까지 이어지지 않게) — 들어서는 순간 한 번
    if (막판() && !c.막판들어섬) { c.막판들어섬 = true; if (c.상태 === "쉼" || c.상태 === "걷기") 곰다음(t); }
    // 곰 옮겨 다니기
    if (c.상태 === "걷기" || c.상태 === "돌진") {
      const 빠르기 = c.상태 === "돌진" ? R.곰돌진[k] : R.곰걷기[k] * c.빠르기배;
      const d = c.목표 - c.자리;
      if (Math.abs(d) <= 빠르기 * 칸) {
        c.자리 = c.목표;
        if (c.상태 === "돌진" && c.목표2 != null) { c.목표 = c.목표2; c.목표2 = null; 알림(t, "곰되돌기"); }   // 2단 돌진
        else 곰다음(t);
      }
      else c.자리 += Math.sign(d) * 빠르기 * 칸;
    } else if (c.끝 <= t) 곰다음(t);

    // 날아간 젤리가 떨어지면 웅덩이. 오래된 웅덩이는 녹아 없어진다
    if (g.젤리 && g.젤리.끝 <= t) {
      g.웅덩이.push({ 가운데: g.젤리.도착, 끝: t + R.웅덩이초 });
      if (g.웅덩이.length > (막판() ? R.막판웅덩이최대 : R.웅덩이최대)) g.웅덩이.shift();
      알림(t, "젤리철퍽", { 자리: g.젤리.도착 });
      g.젤리 = null;
    }
    if (g.웅덩이.length && g.웅덩이[0].끝 <= t) g.웅덩이.shift();
    const 웅덩이위 = g.웅덩이.some((u) => Math.abs(g.x - u.가운데) < R.웅덩이반폭);

    // 돌풍
    const w = g.바람;
    if (w.끝 <= t) {
      if (w.상태 === "잠잠") { Object.assign(w, { 상태: "예고", 시작: t, 끝: t + R.바람예고초, 쪽: 무작위() < 0.5 ? -1 : 1 }); 알림(t, "바람예고", { 쪽: w.쪽 }); }
      else if (w.상태 === "예고") { Object.assign(w, { 상태: "붐", 시작: t, 끝: t + R.바람초 }); 알림(t, "바람", { 쪽: w.쪽 }); }
      else Object.assign(w, { 상태: "잠잠", 시작: t, 끝: t + (막판() ? 뽑기(R.막판바람간격[0], R.막판바람간격[1]) : 뽑기(R.바람간격최소[k], R.바람간격최대[k])) });
    }

    // 별사탕 (막판 마지막) — 반짝 예고 뒤 떨어진다. 맞으면 기절. 한 번에 하나, 기절이 풀린 뒤 1초 안엔 안 떨어진다
    if (!g.별 && t >= g.다음별) {
      const 자리 = 무작위() < R.별겨눔몫 ? Math.max(-0.9, Math.min(0.9, g.x + 뽑기(-0.15, 0.15))) : 뽑기(-0.9, 0.9);
      g.별 = { 시작: t, 끝: t + R.별예고, 자리 };
      알림(t, "별예고", { 자리 });
    } else if (g.별 && t >= g.별.끝) {
      const 맞음 = Math.abs(g.x - g.별.자리) < R.별반폭;
      if (맞음) { g.기절끝 = t + R.기절초; g.대시끝 = Math.min(g.대시끝, t); 알림(t, "기절"); }
      알림(t, "별", { 자리: g.별.자리, 맞음 });
      g.별 = null;
      g.다음별 = Math.max(t + R.별간격 - R.별예고, 맞음 ? g.기절끝 + R.기절뒤쉼 - R.별예고 : 0);
    }
    const 기절 = t < g.기절끝;

    // 시소
    let 목표각 = R.곰무게 * c.자리 + R.공주무게 * g.x;
    if (c.상태 === "흔들기") 목표각 += R.흔들기폭[k] * Math.sin(2 * Math.PI * R.흔들기빠르기 * (t - c.시작));
    목표각 = Math.max(-R.최대각, Math.min(R.최대각, 목표각));
    g.각속도 += (R.따라감 * (목표각 - g.각) - R.감쇠 * g.각속도) * 칸;
    g.각 += g.각속도 * 칸;

    // 공주
    g.미끄럼 += (R.미끄럼[k] * Math.sin(g.각) + (w.상태 === "붐" ? w.쪽 * R.바람세기[k] : 0)) * 칸;
    g.미끄럼 *= Math.exp(-R.마찰 * (웅덩이위 ? R.웅덩이마찰배 : 1) * 칸);

  먼지 = []; 물보라 = []; 반짝 = []; 바람줄 = [];
  slot.innerHTML = "";
  status.innerHTML = "<b>" + R.버틸초 + "</b>초 동안 시소에서 떨어지지 않으면 성공";
  go.textContent = "도 전";
  go.classList.remove("playing");
}

function start() {
  엔진 = 시소판(R);
  엔진.시작(지금());                    // 자리만 잡아 둔다. 시간은 "시작!" 에서 다시 잰다
  읽은소식 = 0;
  걸음.앞 = null; 곰걸음.앞 = null;
  판상태 = "count";
  카운트끝 = 지금() + 1.4;
  Sound.tick(1.0, 0.2);                              // 준비 — 자주 나는 소리 -6dB
  slot.innerHTML = "";
  go.textContent = "포 기";
  go.classList.add("playing");
  상태줄();
}

// 끝났다. 떨어지는(또는 곰이 떨어지는) 모습을 다 보여 준 뒤 판정을 띄운다.
function 끝처리() {
  if (판상태 !== "play") return;
  끝시각 = 지금();
  상태줄();
  go.classList.remove("playing");
  const g = 엔진.g;
  판상태 = g.끝 === "포기" ? "done" : "ending";
  if (g.끝 === "떨어짐") setTimeout(() => 첨벙(떨어진x), 720);   // 바다에 닿는 순간 (떨어지던 그 자리)
  if (g.끝 === "성공") setTimeout(() => 첨벙(W / 2 + g.곰.자리 * 반길이), 560);
  setTimeout(판정, 판상태 === "ending" ? 1300 : 0);
}

function 판정() {
  판상태 = "done";
  const g = 엔진.g;
  const ok = g.끝 === "성공";
  const 까닭 = ok ? R.버틸초 + "초 버팀!" : g.끝 === "포기" ? "포기" : "풍덩!";
  status.innerHTML = "버틴 시간 <b>" + Math.min(R.버틸초, g.t - g.t0).toFixed(1) + "</b>초";
  slot.innerHTML = verdictHtml(ok, 까닭);
  go.textContent = "다 시";
  setTimeout(() => { if (ok) Sound.success(); else Sound.fail(); }, 120);
}

/* 걷기는 키를 쥐고 있는 동안. 대시는 스페이스를 누른 순간. */
const 쥔키 = new Set();
const 방향키 = () => ((쥔키.has("KeyD") || 쥔키.has("ArrowRight")) ? 1 : 0)
                  - ((쥔키.has("KeyA") || 쥔키.has("ArrowLeft"))  ? 1 : 0);
const 걷는키 = ["KeyA", "KeyD", "ArrowLeft", "ArrowRight"];
function 키바뀜(ev) {
  if (판상태 !== "play") return;
  엔진.입력("방향", 눌린시각(ev), 방향키());
  소식처리();
  if (엔진.g.끝) 끝처리();
}
addEventListener("keydown", (e) => {
  if (걷는키.includes(e.code)) {
    e.preventDefault();
    if (!쥔키.has(e.code)) { 쥔키.add(e.code); 키바뀜(e); }
    return;
  }
  if (e.code === "Space" && 판상태 === "play") {          // 대시는 스페이스로만 (2026-10-10 사용자)
    e.preventDefault();
    if (e.repeat) return;
    엔진.입력("대시", 눌린시각(e));
    소식처리();
  }
});
addEventListener("keyup", (e) => { if (쥔키.delete(e.code)) 키바뀜(e); });
addEventListener("blur", () => { 쥔키.clear(); 키바뀜(); });

// 스페이스·엔터는 시작과 다시하기에도 쓴다. 하는 중의 스페이스는 대시다.
go.addEventListener("click", () => {
  if (판상태 === "count") return;
  if (판상태 === "ready") start();
  else if (판상태 === "play") { 엔진.g.끝 = "포기"; 끝처리(); }
  else if (판상태 === "done") reset();
});
onPressKey(() => {
  if (판상태 === "ready") start();
  else if (판상태 === "done") reset();
});

reset();
requestAnimationFrame(draw);
</script>
